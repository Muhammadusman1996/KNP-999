<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <title>Crazy 777 Full Interface</title>
    <style>
        body {
            background: #05020a;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
        }
        .main-wrapper {
            background: linear-gradient(180deg, #0d0426, #05020a);
            border: 3px solid #00e1ff;
            border-radius: 25px;
            width: 420px;
            padding: 20px;
            box-shadow: 0 0 40px #9d00ff;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .jackpot-bar {
            background: linear-gradient(90deg, #ff0055, #9d00ff, #00e1ff);
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            text-transform: uppercase;
        }
        .multipliers-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            background: #110724;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #555;
        }
        .mult-item {
            background: #1a0b36;
            text-align: center;
            padding: 8px 0;
            border-radius: 5px;
            font-size: 14px;
            border: 1px solid #333;
            color: #ffd700;
        }
        .feature-banner {
            background: #1e1147;
            border: 2px solid #ffd700;
            color: #ffd700;
            padding: 8px;
            text-align: center;
            border-radius: 8px;
            font-weight: bold;
        }
        .reels-container {
            background-color: #000;
            border: 4px solid #00e1ff;
            border-radius: 15px;
            display: flex;
            justify-content: space-around;
            padding: 15px 10px;
        }
        .reel {
            background: #fff;
            color: #000;
            font-size: 28px;
            font-weight: bold;
            width: 70px;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }
        .special-reel {
            background: #2b1d0c;
            border: 2px solid #ffd700;
            color: #ffd700;
        }
        .controls-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #0d0426;
            padding: 15px;
            border-radius: 15px;
        }
        .bet-control {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }
        .btn-bet {
            background: #2a1b54;
            color: white;
            border: 1px solid #00e1ff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
        }
        .bet-display {
            background: #000;
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px solid #555;
            font-weight: bold;
        }
        .action-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .secondary-btns {
            display: flex;
            gap: 10px;
        }
        .btn-sec {
            background: #1a0b36;
            color: #00e1ff;
            border: 1px solid #00e1ff;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .spin-btn {
            background: radial-gradient(circle, #00ffff, #0055ff);
            color: #000;
            border: none;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 20px #00e1ff;
        }
        .spin-btn:active {
            transform: scale(0.95);
        }
        .balance-bar {
            background: #110724;
            padding: 10px;
            text-align: center;
            border-radius: 8px;
            font-size: 18px;
            border: 1px solid #333;
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="jackpot-bar">GRAND JACKPOT: $443,776,710.96</div>
    
    <div class="multipliers-grid">
        <div class="mult-item">777x1000</div>
        <div class="mult-item">77x200</div>
        <div class="mult-item">7x100</div>
        <div class="mult-item">Any7x40</div>
        <div class="mult-item">BARx40</div>
        <div class="mult-item">AnyBarx20</div>
        <div class="mult-item">Anyx10</div>
        <div class="mult-item">Symx4</div>
        <div class="mult-item">2x</div>
        <div class="mult-item">10x</div>
    </div>

    <div class="feature-banner">★ Get an extra 10x bonus ★</div>

    <div class="reels-container">
        <div class="mult-item" id="reel1">BAR</div>
        <div class="mult-item" id="reel2">7</div>
        <div class="mult-item" id="reel3">777</div>
        <div class="reel special-reel" id="reel4">10x</div>
    </div>

    <div class="balance-bar">
        Balance: $<span id="balance">100.00</span>
    </div>

    <div class="controls-panel">
        <div class="bet-control">
            <button class="btn-bet" onclick="adjustBet(-0.50)">-</button>
            <div class="bet-display">Bet: $<span id="bet">1.50</span></div>
            <button class="btn-bet" onclick="adjustBet(0.50)">+</button>
        </div>
        
        <div class="action-buttons">
            <div class="secondary-btns">
                <button class="btn-sec" onclick="toggleTurbo()">TURBO</button>
                <button class="btn-sec" onclick="toggleAuto()">AUTO</button>
            </div>
            <button class="spin-btn" id="spinBtn" onclick="spinGame()">SPIN</button>
            <div style="width: 130px;"></div> <!-- Spacer to center spin button -->
        </div>
    </div>
</div>

<script>
    let balance = 100.00;
    let currentBet = 1.50;
    let isTurbo = false;
    let isAuto = false;
    let autoInterval = null;

    function updateDisplay() {
        document.getElementById('balance').innerText = balance.toFixed(2);
        document.getElementById('bet').innerText = currentBet.toFixed(2);
    }

    function adjustBet(amount) {
        currentBet += amount;
        if (currentBet < 0.50) currentBet = 0.50;
        updateDisplay();
    }

    function toggleTurbo() {
        isTurbo = !isTurbo;
        document.querySelectorAll('.btn-sec')[0].style.borderColor = isTurbo ? '#ff0055' : '#00e1ff';
    }

    function toggleAuto() {
        isAuto = !isAuto;
        const autoBtn = document.querySelectorAll('.btn-sec')[1];
        autoBtn.style.borderColor = isAuto ? '#ff0055' : '#00e1ff';
        if (isAuto) {
            autoInterval = setInterval(spinGame, isTurbo ? 1000 : 2000);
        } else {
            clearInterval(autoInterval);
        }
    }

    function disableSpin(disable) {
        document.getElementById('spinBtn').disabled = disable;
    }

    function spinGame() {
        if (balance < currentBet) {
            alert("Insufficient balance!");
            if (isAuto) toggleAuto();
            return;
        }

        disableSpin(true);
        const symbols = ['777', '7', 'BAR', '🍒'];
        const speed = isTurbo ? 30 : 100;
        
        let counter = 0;
        const interval = setInterval(() => {
            document.getElementById('reel1').innerText = symbols[Math.floor(Math.random() * symbols.length)];
            document.getElementById('reel2').innerText = symbols[Math.floor(Math.random() * symbols.length)];
            document.getElementById('reel3').innerText = symbols[Math.floor(Math.random() * symbols.length)];
            counter++;
            if (counter > (isTurbo ? 5 : 15)) {
                clearInterval(interval);
                finalizeSpin();
            }
        }, speed);
    }

    function finalizeSpin() {
        const symbols = ['777', '7', 'BAR', '🍒'];
        const finalR1 = symbols[Math.floor(Math.random() * symbols.length)];
        const finalR2 = symbols[Math.floor(Math.random() * symbols.length)];
        const finalR3 = symbols[Math.floor(Math.random() * symbols.length)];
        
        document.getElementById('reel1').innerText = finalR1;
        document.getElementById('reel2').innerText = finalR2;
        document.getElementById('reel3').innerText = finalR3;
        
        const fourthReelSymbols = ['1x', '10x', '2x', '5x', '100x'];
        const finalFeature = fourthReelSymbols[Math.floor(Math.random() * fourthReelSymbols.length)];
        document.getElementById('reel4').innerText = finalFeature;

        calculatePayout(finalR1, finalR2, finalR3, finalFeature);
        if (!isAuto) disableSpin(false);
    }

    function calculatePayout(r1, r2, r3, feature) {
        let multiplier = parseInt(feature) || 1;
        let baseWin = 0;

        if (r1 === '777' && r2 === '777' && r3 === '777') {
            baseWin = 50;
        } else if (r1 === '7' && r2 === '7' && r3 === '7') {
            baseWin = 20;
        } else if (r1 === r2 && r2 === r3) {
            baseWin = 10;
        }
        
        const totalWin = baseWin * multiplier;
        
        if (totalWin > 0) {
            balance += totalWin;
            alert("BIG WIN! You won: $" + totalWin.toFixed(2));
        } else {
            balance -= currentBet;
        }
        updateDisplay();
    }

    updateDisplay();
</script>

</body>
</html>
