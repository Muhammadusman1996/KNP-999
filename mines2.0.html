<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mines 2 Game</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: #0A192F;
            color: white;
            font-family: Arial, sans-serif;
        }
        #game-container {
            border: 3px solid #172554;
            border-radius: 15px;
            padding: 20px;
            background: #1E293B;
            text-align: center;
            width: 380px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .jackpot-display {
            display: flex;
            justify-content: space-around;
            background: #000;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .jackpot-item {
            text-align: center;
        }
        .jackpot-title {
            color: #94A3B8;
            font-size: 11px;
            font-weight: bold;
        }
        .jackpot-value {
            color: #FACC15;
            font-size: 16px;
            font-weight: bold;
        }
        .info-panel {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            background: #0F172A;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
        }
        #grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }
        .cell {
            aspect-ratio: 1;
            background: #10B981;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.3s;
            box-shadow: inset 0 -4px 0 rgba(0,0,0,0.2);
        }
        .cell:hover {
            transform: scale(1.05);
        }
        .cell.revealed {
            background: #334155;
            cursor: default;
        }
        .cell.bomb {
            background: #EF4444;
            animation: explode 0.5s;
        }
        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0F172A;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .control-buttons {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 5px;
        }
        .btn-control {
            background: #3B82F6;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }
        .btn-control:active {
            transform: scale(0.9);
        }
        .display-box {
            background: #000;
            padding: 5px 15px;
            border-radius: 4px;
            min-width: 50px;
            text-align: center;
            font-weight: bold;
            color: #38BDF8;
        }
        #start-btn {
            background: #10B981;
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
        }
        #start-btn:active {
            transform: scale(0.98);
        }
        .win-display {
            font-size: 22px;
            font-weight: bold;
            color: #FACC15;
            margin-top: 15px;
        }
        @keyframes explode {
            0% { transform: scale(1); background: #EF4444; }
            50% { transform: scale(1.2); background: #FDE047; }
            100% { transform: scale(1); background: #EF4444; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="jackpot-display">
        <div class="jackpot-item"><div class="jackpot-title">GRAND</div><div class="jackpot-value">10000</div></div>
        <div class="jackpot-item"><div class="jackpot-title">MAJOR</div><div class="jackpot-value">3000</div></div>
        <div class="jackpot-item"><div class="jackpot-title">MINOR</div><div class="jackpot-value">1000</div></div>
    </div>

    <div class="info-panel">
        <div>NEXT WIN: <span id="next-mult" style="color: #34D399;">1.08X</span></div>
        <div>FOUND: <span id="mines-found">0</span>/22</div>
    </div>

    <div id="grid"></div>

    <div class="controls-row">
        <div class="control-group">
            <span style="font-size: 12px; color: #94A3B8;">BET</span>
            <div class="control-buttons">
                <button class="btn-control" onclick="adjustBet(-10)">-</button>
                <div class="display-box"><span id="bet-amount">10</span></div>
                <button class="btn-control" onclick="adjustBet(10)">+</button>
            </div>
        </div>
        <div class="control-group">
            <span style="font-size: 12px; color: #94A3B8;">MINES</span>
            <div class="control-buttons">
                <button class="btn-control" onclick="adjustMines(-1)">-</button>
                <div class="display-box"><span id="mine-count">3</span></div>
                <button class="btn-control" onclick="adjustMines(1)">+</button>
            </div>
        </div>
    </div>

    <button id="start-btn" onclick="startGame()">START</button>

    <div class="win-display">WIN Rs<span id="total-win">0.00</span></div>
</div>

<script>
    let bet = 10;
    let minesCount = 3;
    let gridState = []; 
    let revealedState = [];
    let gameActive = false;
    let minesFound = 0;
    const totalCells = 25;

    const multipliers = [
        1.08, 1.18, 1.29, 1.42, 1.57, 1.74, 1.94, 2.18, 2.46, 2.80,
        3.21, 3.71, 4.33, 5.11, 6.13, 7.48, 9.35, 12.08, 16.32, 23.31,
        36.60, 66.00
    ];

    function adjustBet(amount) {
        if (!gameActive) {
            bet += amount;
            if (bet < 10) bet = 10;
            document.getElementById('bet-amount').innerText = bet;
        }
    }

    function adjustMines(amount) {
        if (!gameActive) {
            minesCount += amount;
            if (minesCount < 1) minesCount = 1;
            if (minesCount > 24) minesCount = 24;
            document.getElementById('mine-count').innerText = minesCount;
        }
    }

    function createGrid() {
        const gridElement = document.getElementById('grid');
        gridElement.innerHTML = '';
        for (let i = 0; i < totalCells; i++) {
            const cell = document.createElement('div');
            cell.classList.add('cell');
            cell.dataset.index = i;
            cell.onclick = () => revealCell(i);
            gridElement.appendChild(cell);
        }
    }

    function startGame() {
        if (gameActive) return;
        gameActive = true;
        minesFound = 0;
        document.getElementById('mines-found').innerText = minesFound;
        document.getElementById('total-win').innerText = "0.00";
        document.getElementById('start-btn').innerText = "CASH OUT";
        document.getElementById('start-btn').style.backgroundColor = "#EAB308";

        gridState = new Array(totalCells).fill(false);
        revealedState = new Array(totalCells).fill(false);

        let placedMines = 0;
        while (placedMines < minesCount) {
            const randomIndex = Math.floor(Math.random() * totalCells);
            if (!gridState[randomIndex]) {
                gridState[randomIndex] = true;
                placedMines++;
            }
        }

        const cells = document.querySelectorAll('.cell');
        cells.forEach(cell => {
            cell.className = 'cell';
            cell.innerHTML = '';
        });
    }

    function revealCell(index) {
        if (!gameActive || revealedState[index]) return;

        revealedState[index] = true;
        const cell = document.querySelector(`[data-index="${index}"]`);

        if (gridState[index]) {
            cell.classList.add('bomb');
            cell.innerHTML = '💣';
            endGame(false);
        } else {
            cell.classList.add('revealed');
            cell.innerHTML = '💎';
            minesFound++;
            document.getElementById('mines-found').innerText = minesFound;
            
            if (minesFound <= multipliers.length) {
                const currentMult = multipliers[Math.min(minesFound - 1, multipliers.length - 1)];
                document.getElementById('next-mult').innerText = currentMult.toFixed(2) + "X";
                const currentWin = (bet * currentMult).toFixed(2);
                document.getElementById('total-win').innerText = currentWin;
            }

            if (minesFound === (totalCells - minesCount)) {
                endGame(true);
            }
        }
    }

    function endGame(isWon) {
        gameActive = false;
        document.getElementById('start-btn').innerText = "START";
        document.getElementById('start-btn').style.backgroundColor = "#10B981";
        
        const cells = document.querySelectorAll('.cell');
        gridState.forEach((isBomb, index) => {
            if (isBomb) {
                cells[index].classList.add('bomb');
                cells[index].innerHTML = '💣';
            } else if (!revealedState[index]) {
                cells[index].classList.add('revealed');
                cells[index].innerHTML = '💎';
            }
        });

        if (!isWon) {
            alert("Game Over! You hit a mine.");
        } else {
            alert("Congratulations! You found all safe spots!");
        }
    }

    createGrid();
</script>

</body>
</html>
