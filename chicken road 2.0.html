<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chicken Road 2 - Step Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #050b14; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 10px; }
        .header { width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center; background: #0d1b2a; padding: 12px 20px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #d4af37; }
        .balance { font-size: 1.4rem; font-weight: bold; color: #70e000; }
        
        .game-wrapper {
            position: relative;
            width: 100%;
            max-width: 900px;
            height: 400px;
            background: #101820;
            border: 6px solid #d4af37;
            border-radius: 15px;
            overflow: hidden;
            display: flex;
        }
        .lane { flex: 1; height: 100%; border-right: 2px dashed rgba(255,255,255,0.1); position: relative; display: flex; align-items: center; justify-content: center; }
        .lane:last-child { border-right: none; }
        
        .multiplier-badge {
            background: #0f3460;
            color: #ffb703;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: bold;
            border: 1px solid #ffb703;
            z-index: 1;
        }

        #chicken {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%) scaleX(-1); /* Facing right */
            width: 50px;
            height: 50px;
            font-size: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: left 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
        }

        .obstacle {
            position: absolute;
            top: -60px;
            width: 80%;
            left: 10%;
            height: 50px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }
        .car-red { background: #d90429; }
        .car-blue { background: #0077b6; }
        .car-yellow { background: #ffb703; }

        .controls-panel {
            width: 100%;
            max-width: 900px;
            background: #0d1b2a;
            padding: 15px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 10px;
            border: 1px solid #415a77;
        }
        .control-row { display: flex; justify-content: space-between; align-items: center; gap: 15px; }
        .input-group { display: flex; align-items: center; gap: 10px; }
        input { padding: 8px; border-radius: 5px; border: 1px solid #415a77; background: #1b263b; color: #fff; width: 90px; text-align: center; font-weight: bold; font-size: 1rem; }
        .difficulty-group { display: flex; gap: 5px; align-items: center;}
        .btn-diff { padding: 8px 12px; background: #1b263b; color: #fff; border: 1px solid #415a77; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-diff.active { background: #d4af37; color: #050b14; }
        
        .action-group { display: flex; gap: 10px; width: 100%; }
        button.action-btn { flex: 1; padding: 15px; color: white; border: none; border-radius: 8px; font-size: 1.2rem; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .btn-go { background: linear-gradient(to bottom, #70e000, #38b000); }
        .btn-cash { background: linear-gradient(to bottom, #ffb703, #fb8500); }
        button:disabled { background: #555; color: #888; cursor: not-allowed; }

        #status-bar { text-align: center; font-size: 1.3rem; font-weight: bold; color: #ffb703; height: 35px; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div class="header">
    <h2>Chicken Road 2</h2>
    <div class="balance">Balance: $<span id="balance-amount">1000.00</span></div>
</div>

<div class="game-wrapper" id="lane-container">
    <div class="lane" id="lane-0"><div class="multiplier-badge">1.2x</div></div>
    <div class="lane" id="lane-1"><div class="multiplier-badge">1.5x</div></div>
    <div class="lane" id="lane-2"><div class="multiplier-badge">2.0x</div></div>
    <div class="lane" id="lane-3"><div class="multiplier-badge">3.0x</div></div>
    <div class="lane" id="lane-4"><div class="multiplier-badge">5.0x</div></div>
    <div id="chicken">🐔</div>
</div>

<div id="status-bar">Set bet, select difficulty, and press Start!</div>

<div class="controls-panel">
    <div class="control-row">
        <div class="input-group">
            <label>Bet ($):</label>
            <input type="number" id="bet-input" value="10" min="1">
        </div>
        <div class="difficulty-group">
            <span>Speed:</span>
            <button class="btn-diff active" onclick="setDifficulty('easy', this)">Easy</button>
            <button class="btn-diff" onclick="setDifficulty('medium', this)">Medium</button>
            <button class="btn-diff" onclick="setDifficulty('high', this)">High</button>
        </div>
    </div>
    <div class="action-group">
        <button class="action-btn btn-go" id="go-btn" onclick="handleMainButton()">START</button>
        <button class="action-btn btn-cash" id="cash-btn" onclick="cashOut()" disabled>Collect Cash</button>
    </div>
</div>

<script>
    let balance = 1000.00;
    let currentBet = 0;
    let currentStep = -1; // -1 means before start
    const maxSteps = 4; // Indices 0 to 4
    let gameActive = false;
    let difficulty = 'easy';
    let trafficInterval = null;
    let obstacles = [];
    const carTypes = ['car-red', 'car-blue', 'car-yellow'];
    const multipliers = [1.2, 1.5, 2.0, 3.0, 5.0];

    function updateDisplay() {
        document.getElementById('balance-amount').innerText = balance.toFixed(2);
    }

    function setDifficulty(level, btn) {
        if(gameActive) return;
        difficulty = level;
        document.querySelectorAll('.btn-diff').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function updateChickenPosition() {
        const chicken = document.getElementById('chicken');
        if (currentStep === -1) {
            chicken.style.left = `20px`;
        } else {
            const lane = document.getElementById(`lane-${currentStep}`);
            const laneRect = lane.getBoundingClientRect();
            const containerRect = document.getElementById('lane-container').getBoundingClientRect();
            const targetLeft = laneRect.left - containerRect.left + (laneRect.width / 2) - 25;
            chicken.style.left = `${targetLeft}px`;
        }
    }

    function handleMainButton() {
        if (!gameActive) {
            startFirstStep();
        } else {
            advanceChicken();
        }
    }

    function startFirstStep() {
        const betInput = parseFloat(document.getElementById('bet-input').value);
        if(isNaN(betInput) || betInput <= 0) { alert("Invalid bet!"); return; }
        if(betInput > balance) { alert("Insufficient balance!"); return; }

        currentBet = betInput;
        balance -= currentBet;
        updateDisplay();
        
        gameActive = true;
        currentStep = 0; // Move to first lane
        updateChickenPosition();
        document.getElementById('chicken').innerHTML = '🐔';

        document.getElementById('go-btn').innerText = "GO CHICKEN";
        document.getElementById('cash-btn').disabled = false;
        document.getElementById('bet-input').disabled = true;
        document.getElementById('status-bar').innerText = `Stage 1 (${multipliers[0]}x). Press Go Chicken!`;

        obstacles = [];
        const spawnRates = { easy: 1200, medium: 900, high: 600 };
        trafficInterval = setInterval(spawnLaneObstacle, spawnRates[difficulty]);
    }

    function spawnLaneObstacle() {
        if(!gameActive) return;
        // Spawn in random lanes
        for(let i=0; i<=maxSteps; i++) {
            if(Math.random() < 0.4) { // Chance per tick
                const lane = document.getElementById(`lane-${i}`);
                if(lane.querySelector('.obstacle')) continue;

                const obs = document.createElement('div');
                obs.className = `obstacle ${carTypes[Math.floor(Math.random()*carTypes.length)]}`;
                obs.innerHTML = '🚗';
                obs.style.top = '-60px';
                lane.appendChild(obs);
                obstacles.push({ el: obs, top: -60, laneIndex: i });
            }
        }
    }

    // Continuously move obstacles down
    setInterval(() => {
        if(!gameActive) return;
        const speeds = { easy: 5, blurring: 8, high: 12 };
        const speed = speeds[difficulty];

        for (let i = obstacles.length - 1; i >= 0; i--) {
            const obs = obstacles[i];
            obs.top += speed;
            obs.el.style.top = `${obs.top}px`;

            // Collision check with chicken if obstacle is in chicken's current lane
            if (obs.laneIndex === currentStep) {
                const chicken = document.getElementById('chicken').getBoundingClientRect();
                const obsRect = obs.el.getBoundingClientRect();
                
                if (!(chicken.right < obsRect.left || 
                      chicken.left > obsRect.right || 
                      chicken.bottom < obsRect.top || 
                      chicken.top > obsRect.bottom)) {
                    endGame(false, "Crash! Game Over.");
                    return;
                }
            }

            if(obs.top > 400) {
                obs.el.remove();
                obstacles.splice(i, 1);
            }
        }
    }, 30);

    function advanceChicken() {
        if (!gameActive) return;
        currentStep++;
        updateChickenPosition();

        if (currentStep >= multipliers.length) {
            endGame(true, `JACKPOT! Won $${(currentBet * multipliers[maxSteps]).toFixed(2)}`);
        } else {
            document.getElementById('status-bar').innerText = `Stage ${currentStep + 1} (${multipliers[currentStep]}x). Keep going!`;
        }
    }

    function cashOut() {
        if(!gameActive) return;
        const payout = currentBet * multipliers[currentStep];
        endGame(true, `Cashed out $${payout.toFixed(2)}!`);
        balance += payout;
        updateDisplay();
    }

    function endGame(win, message) {
        gameActive = false;
        clearInterval(trafficInterval);
        
        document.getElementById('status-bar').innerText = message;
        if(!win) document.getElementById('chicken').innerHTML = '💥';

        document.getElementById('go-btn').innerText = "START";
        document.getElementById('cash-btn').disabled = true;
        document.getElementById('bet-input').disabled = false;

        obstacles.forEach(obs => obs.el.remove());
        obstacles = [];
    }

    updateDisplay();
</script>
</body>
</html>
