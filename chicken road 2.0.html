<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chicken Road 2 - Fixed Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0c0f17; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 10px; }
        .header { width: 100%; max-width: 950px; display: flex; justify-content: space-between; align-items: center; background: #161b22; padding: 12px 20px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #30363d; }
        .balance { font-size: 1.5rem; font-weight: bold; color: #39ff14; text-shadow: 0 0 5px rgba(57,255,20,0.5); }
        
        .game-wrapper {
            position: relative;
            width: 100%;
            max-width: 950px;
            height: 450px;
            background: #0d1117;
            border: 4px solid #30363d;
            border-radius: 15px;
            overflow: hidden;
            display: flex;
        }
        .lane { flex: 1; height: 100%; border-right: 1px dashed rgba(255,255,255,0.05); position: relative; }
        .lane:last-child { border-right: none; }
        
        .road-line { position: absolute; top: 0; bottom: 0; width: 2px; background: rgba(255,255,255,0.1); left: 50%; transform: translateX(-50%); }

        #chicken {
            position: absolute;
            left: 25px;
            top: 50%;
            transform: translateY(-50%) scaleX(1);
            width: 50px;
            height: 50px;
            font-size: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: left 0.3s ease;
            z-index: 20;
        }

        .car {
            position: absolute;
            top: -60px;
            width: 70px;
            height: 40px;
            font-size: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .steps-container {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-around;
            padding: 0 30px;
            z-index: 5;
        }
        .step-node {
            background: #161b22;
            color: #d4af37;
            padding: 8px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            border: 2px solid #d4af37;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }

        .controls-panel {
            width: 100%;
            max-width: 950px;
            background: #161b22;
            padding: 20px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 15px;
            border: 1px solid #30363d;
        }
        .control-row { display: flex; justify-content: space-between; align-items: center; gap: 20px; }
        .input-group { display: flex; align-items: center; gap: 10px; font-size: 1.1rem; }
        input { padding: 10px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: #fff; width: 100px; text-align: center; font-weight: bold; font-size: 1.1rem; }
        .difficulty-group { display: flex; gap: 10px; align-items: center;}
        .btn-diff { padding: 10px 18px; background: #0d1117; color: #8b949e; border: 1px solid #30363d; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1rem; }
        .btn-diff.active { background: #d4af37; color: #000; border-color: #d4af37; }
        
        .action-group { display: flex; gap: 15px; width: 100%; }
        button.action-btn { flex: 1; padding: 18px; color: #fff; border: none; border-radius: 10px; font-size: 1.4rem; font-weight: bold; cursor: pointer; text-transform: uppercase; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .btn-go { background: linear-gradient(to bottom, #238636, #2ea043); }
        .btn-cash { background: linear-gradient(to bottom, #da3633, #b62324); }
        button:disabled { background: #21262d; color: #484f58; cursor: not-allowed; box-shadow: none; }

        #status-bar { text-align: center; font-size: 1.5rem; font-weight: bold; color: #d4af37; height: 40px; display: flex; align-items: center; justify-content: center; text-shadow: 0 0 10px rgba(212,175,55,0.3); }
    </style>
</head>
<body>

<div class="header">
    <h2>Chicken Road 2</h2>
    <div class="balance">Balance: $<span id="balance-amount">1000.00</span></div>
</div>

<div class="game-wrapper" id="lane-container">
    <div class="lane"><div class="road-line"></div></div>
    <div class="lane"><div class="road-line"></div></div>
    <div class="lane"><div class="road-line"></div></div>
    <div class="lane"><div class="road-line"></div></div>
    <div class="lane"><div class="road-line"></div></div>
    <div class="lane"><div class="road-line"></div></div>
    
    <div class="steps-container" id="steps-container"></div>
    <div id="chicken">🐔</div>
</div>

<div id="status-bar">Set bet, select difficulty, and Go Chicken!</div>

<div class="controls-panel">
    <div class="control-row">
        <div class="input-group">
            <label>Bet ($):</label>
            <input type="number" id="bet-input" value="10" min="1">
        </div>
        <div class="difficulty-group">
            <span style="font-weight:bold; color:#8b949e;">Speed:</span>
            <button class="btn-diff active" onclick="setDifficulty('easy', this)">Easy</button>
            <button class="btn-diff" onclick="setDifficulty('medium', this)">Medium</button>
            <button class="btn-diff" onclick="setDifficulty('high', this)">High</button>
        </div>
    </div>
    <div class="action-group">
        <button class="action-btn btn-go" id="go-btn" onclick="handleMainButton()">GO CHICKEN</button>
        <button class="action-btn btn-cash" id="cash-btn" onclick="cashOut()" disabled>Collect Cash</button>
    </div>
</div>

<script>
    let balance = 1000.00;
    let currentBet = 0;
    let currentStep = -1; 
    let gameActive = false;
    let difficulty = 'easy';
    let trafficInterval = null;
    let collisionInterval = null;
    let cars = [];
    
    const stepMultipliers = [1.2, 1.3, 1.4, 1.5, 1.65, 1.8, 2.0, 2.2, 2.4, 2.7, 3.0, 3.5, 4.0, 5.0];
    const carEmojis = ['🏎️', '🚗', '🚙', '🚕', '🛻'];

    function updateDisplay() {
        document.getElementById('balance-amount').innerText = Number.isFinite(balance) ? balance.toFixed(2) : "0.00";
    }

    function setDifficulty(level, btn) {
        if(gameActive) return;
        difficulty = level;
        document.querySelectorAll('.btn-diff').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function initStepsUI() {
        const container = document.getElementById('steps-container');
        container.innerHTML = '';
        stepMultipliers.forEach((mult, index) => {
            const div = document.createElement('div');
            div.className = 'step-node';
            div.id = `step-node-${index}`;
            div.innerText = `${mult}x`;
            container.appendChild(div);
        });
    }

    function updateChickenPosition() {
        const chicken = document.getElementById('chicken');
        if (currentStep === -1) {
            chicken.style.left = `25px`;
        } else {
            const containerWidth = document.getElementById('lane-container').offsetWidth;
            const laneWidth = containerWidth / 6;
            const targetLeft = (currentStep * laneWidth) + (laneWidth / 2) - 25;
            chicken.style.left = `${targetLeft}px`;
        }
    }

    function handleMainButton() {
        if (!gameActive) {
            startProcedure();
        } else {
            advanceChicken();
        }
    }

    function startProcedure() {
        const inputVal = document.getElementById('bet-input').value;
        const betInput = parseFloat(inputVal);
        
        if(isNaN(betInput) || betInput <= 0) { alert("Invalid bet!"); return; }
        if(betInput > balance) { alert("Insufficient balance!"); return; }

        currentBet = betInput;
        balance -= currentBet;
        updateDisplay();
        
        gameActive = true;
        currentStep = 0; 
        updateChickenPosition();
        document.getElementById('chicken').innerHTML = '🐔';

        document.getElementById('go-btn').innerText = "GO CHICKEN";
        document.getElementById('cash-btn').disabled = false;
        document.getElementById('bet-input').disabled = true;
        document.querySelectorAll('.btn-diff').forEach(b => b.style.pointerEvents = 'none');

        document.getElementById('status-bar').innerText = `Stage 1 (${stepMultipliers[0]}x). Keep moving!`;

        highlightCurrentStepUI();

        cars = [];
        const spawnRates = { easy: 1000, medium: 750, high: 500 };
        trafficInterval = setInterval(spawnCar, spawnRates[difficulty]);
    }

    function highlightCurrentStepUI() {
        document.querySelectorAll('.step-node').forEach((el, idx) => {
            if(idx === currentStep) {
                el.style.background = '#d4af37';
                el.style.color = '#000';
                el.style.transform = 'scale(1.1)';
                el.style.borderColor = '#fff';
            } else {
                el.style.background = '#161b22';
                el.style.color = '#d4af37';
                el.style.transform = 'scale(1)';
                el.style.borderColor = '#d4af37';
            }
        });
    }

    function spawnCar() {
        if(!gameActive) return;
        for(let i=0; i<6; i++) {
            if(Math.random() < 0.35) {
                const lane = document.querySelectorAll('.lane')[i];
                if(lane.querySelector('.car')) continue;

                const car = document.createElement('div');
                car.className = 'car';
                car.innerHTML = carEmojis[Math.floor(Math.random() * carEmojis.length)];
                car.style.top = '-50px';
                
                const laneRect = lane.getBoundingClientRect();
                const containerRect = document.getElementById('lane-container').getBoundingClientRect();
                const centerOffset = laneRect.left - containerRect.left + (laneRect.width / 2) - 35;
                car.style.left = `${centerOffset}px`;

                lane.appendChild(car);
                cars.push({ el: car, top: -50, laneIndex: i });
            }
        }
    }

    collisionInterval = setInterval(() => {
        if(!gameActive) return;
        const speeds = { easy: 4, medium: 7, high: 10 };
        const speed = speeds[difficulty];

        const chickenRect = document.getElementById('chicken').getBoundingClientRect();

        for (let i = cars.length - 1; i >= 0; i--) {
            const carObj = cars[i];
            carObj.top += speed;
            carObj.el.style.top = `${carObj.top}px`;

            if (carObj.laneIndex === currentStep) {
                const carRect = carObj.el.getBoundingClientRect();
                
                if (!(chickenRect.right < carRect.left || 
                      chickenRect.left > carRect.right || 
                      chickenRect.bottom < carRect.top || 
                      chickenRect.top > carRect.bottom)) {
                    endGame(false, "Traffic Crash! Game Over.");
                    return;
                }
            }

            if(carObj.top > 450) {
                carObj.el.remove();
                cars.splice(i, 1);
            }
        }
    }, 30);

    function advanceChicken() {
        if (!gameActive) return;
        currentStep++;

        if (currentStep >= stepMultipliers.length) {
            endGame(true, `SUCCESS! Crossed safely! Won $${(currentBet * stepMultipliers[stepMultipliers.length - 1]).toFixed(2)}`);
        } else {
            updateChickenPosition();
            highlightCurrentStepUI();
            const currentMult = stepMultipliers[currentStep];
            document.getElementById('status-bar').innerText = `Stage ${currentStep + 1} (${currentMult}x). Keep going!`;
        }
    }

    function cashOut() {
        if(!gameActive) return;
        const activeMult = stepMultipliers[currentStep] || 1.0;
        const payout = currentBet * activeMult;
        
        if (Number.isFinite(payout)) {
            balance += payout;
            endGame(true, `Cashed out $${payout.toFixed(2)}!`);
        } else {
            endGame(false, "Error calculating payout.");
        }
        updateDisplay();
    }

    function endGame(win, message) {
        gameActive = false;
        clearInterval(trafficInterval);
        clearInterval(collisionInterval);
        
        document.getElementById('status-bar').innerText = message;
        if(!win) {
            document.getElementById('chicken').innerHTML = '💥';
        }

        document.getElementById('go-btn').innerText = "GO CHICKEN";
        document.getElementById('cash-btn').disabled = true;
        const betInput = document.getElementById('bet-input');
        betInput.disabled = false;
        
        if (isNaN(parseFloat(betInput.value))) {
            betInput.value = "10";
        }

        document.querySelectorAll('.btn-diff').forEach(b => b.style.pointerEvents = 'auto');

        cars.forEach(c => c.el.remove());
        cars = [];
    }

    initStepsUI();
    updateDisplay();
    updateChickenPosition();
</script>
</body>
</html>
