<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chicken Road 2 Ultimate</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #070a13; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 10px; }
        .header { width: 100%; max-width: 1000px; display: flex; justify-content: space-between; align-items: center; background: #101625; padding: 12px 20px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #384b65; }
        .balance { font-size: 1.5rem; font-weight: bold; color: #10b981; text-shadow: 0 0 5px rgba(16,185,129,0.5); }
        
        .game-wrapper {
            position: relative;
            width: 100%;
            max-width: 1000px;
            height: 500px;
            background: #030712;
            border: 4px solid #1f2937;
            border-radius: 15px;
            overflow: hidden;
            display: flex;
        }
        .lane { flex: 1; height: 100%; border-right: 1px dashed rgba(255,255,255,0.05); position: relative; }
        .lane:last-child { border-right: none; }
        
        .road-line { position: absolute; top: 0; bottom: 0; width: 2px; background: rgba(255,255,255,0.05); left: 50%; transform: translateX(-50%); }

        #chicken {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%) scaleX(1); /* Facing right */
            width: 65px;
            height: 65px;
            font-size: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: left 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 20;
        }

        .car {
            position: absolute;
            top: -60px;
            width: 70px;
            height: 50px;
            font-size: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: rotate(180deg); /* Facing down */
            z-index: 10;
        }

        .breaker {
            position: absolute;
            width: 100%;
            height: 25px;
            background: repeating-linear-gradient(90deg, #f59e0b, #f59e0b 25px, #000 25px, #000 50px);
            border-top: 3px solid #fff;
            border-bottom: 3px solid #fff;
            z-index: 15;
            opacity: 0.9;
        }

        .steps-wrapper {
            position: absolute;
            bottom: 15px;
            left: 15px;
            right: 15px;
            overflow-x: auto;
            padding-bottom: 10px;
            z-index: 5;
        }
        .steps-container {
            display: inline-flex;
            gap: 12px;
            padding: 5px;
        }
        .step-node {
            background: #1f2937;
            color: #9ca3af;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1rem;
            border: 1px solid #374151;
            white-space: nowrap;
            transition: all 0.3s ease;
        }

        .controls-panel {
            width: 100%;
            max-width: 1000px;
            background: #101625;
            padding: 20px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 15px;
            border: 1px solid #384b65;
        }
        .control-row { display: flex; justify-content: space-between; align-items: center; gap: 20px; }
        .input-group { display: flex; align-items: center; gap: 10px; font-size: 1.1rem; }
        input { padding: 10px; border-radius: 8px; border: 1px solid #384b65; background: #070a13; color: #fff; width: 100px; text-align: center; font-weight: bold; font-size: 1.1rem; }
        .difficulty-group { display: flex; gap: 10px; align-items: center;}
        .btn-diff { padding: 10px 18px; background: #070a13; color: #9ca3af; border: 1px solid #384b65; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1rem; }
        .btn-diff.active { background: #3b82f6; color: #fff; border-color: #60a5fa; }
        
        .action-group { display: flex; gap: 15px; width: 100%; }
        button.action-btn { flex: 1; padding: 18px; color: #fff; border: none; border-radius: 10px; font-size: 1.4rem; font-weight: bold; cursor: pointer; text-transform: uppercase; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .btn-go { background: linear-gradient(to bottom, #10b981, #059669); }
        .btn-cash { background: linear-gradient(to bottom, #f59e0b, #d97706); }
        button:disabled { background: #374151; color: #9ca3af; cursor: not-allowed; box-shadow: none; }

        #status-bar { text-align: center; font-size: 1.5rem; font-weight: bold; color: #60a5fa; height: 40px; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div class="header">
    <h2>Chicken Road 2 Pro</h2>
    <div class="balance">Balance: $<span id="balance-amount">1000.00</span></div>
</div>

<div class="game-wrapper" id="lane-container">
    <div class="lane"><div class="road-line"></div></div>
    <div class="lane"><div class="road-line"></div></div>
    <div class="lane"><div class="road-line"></div></div>
    <div class="lane"><div class="road-line"></div></div>
    <div class="lane"><div class="road-line"></div></div>
    <div class="lane"><div class="road-line"></div></div>
    
    <div class="steps-wrapper">
        <div class="steps-container" id="steps-container"></div>
    </div>
    <div id="chicken">🐔</div>
</div>

<div id="status-bar">Set bet, select difficulty, and Go Chicken!</div>

<div class="controls-panel">
    <div class="control-row">
        <div class="input-group">
            <label>Bet ($):</label>
            <input type="number" id="bet-input" value="10" min="1">
        </div>
        <div class="difficulty-group">
            <span style="font-weight:bold; color:#9ca3af;">Speed:</span>
            <button class="btn-diff active" onclick="setDifficulty('easy', this)">Easy</button>
            <button class="btn-diff" onclick="setDifficulty('medium', this)">Medium</button>
            <button class="btn-diff" onclick="setDifficulty('high', this)">High</button>
        </div>
    </div>
    <div class="action-group">
        <button class="action-btn btn-go" id="go-btn" onclick="handleMainButton()">GO CHICKEN</button>
        <button class="action-btn btn-cash" id="cash-btn" onclick="cashOut()" disabled>Collect Cash</button>
    </div>
</div>

<script>
    let balance = 1000.00;
    let currentBet = 0;
    let currentStep = -1; 
    let gameActive = false;
    let difficulty = 'easy';
    let trafficInterval = null;
    let collisionInterval = null;
    let cars = [];
    let currentBreaker = null;
    
    // Exactly 30 precise multiplier steps leading up to 10.0x
    const stepMultipliers = [
        1.05, 1.10, 1.15, 1.25, 1.35, 1.45, 1.55, 1.65, 1.75, 1.85,
        2.00, 2.15, 2.30, 2.45, 2.60, 2.80, 3.00, 3.25, 3.50, 3.75,
        4.00, 4.30, 4.60, 5.00, 5.50, 6.00, 6.80, 7.60, 8.80, 10.00
    ];
    const carEmojis = ['🏎️', '🚗', '🚙', '🚕', '🛻', '🚜', '🚚'];

    function updateDisplay() {
        document.getElementById('balance-amount').innerText = Number.isFinite(balance) ? balance.toFixed(2) : "0.00";
    }

    function setDifficulty(level, btn) {
        if(gameActive) return;
        difficulty = level;
        document.querySelectorAll('.btn-diff').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function initStepsUI() {
        const container = document.getElementById('steps-container');
        container.innerHTML = '';
        stepMultipliers.forEach((mult, index) => {
            const div = document.createElement('div');
            div.className = 'step-node';
            div.id = `step-node-${index}`;
            div.innerText = `${mult.toFixed(2)}x`;
            container.appendChild(div);
        });
    }

    function updateChickenPosition() {
        const chicken = document.getElementById('chicken');
        if (currentStep === -1) {
            chicken.style.left = `15px`;
        } else {
            const containerWidth = document.getElementById('lane-container').offsetWidth;
            const laneWidth = containerWidth / 6;
            const targetLeft = (currentStep * laneWidth) + (laneWidth / 2) - 32;
            chicken.style.left = `${targetLeft}px`;
            
            const stepNode = document.getElementById(`step-node-${currentStep}`);
            if(stepNode) {
                stepNode.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
        }
    }

    function handleMainButton() {
        if (!gameActive) {
            startProcedure();
        } else {
            advanceChicken();
        }
    }

    function startProcedure() {
        const inputVal = document.getElementById('bet-input').value;
        const betInput = parseFloat(inputVal);
        
        if(isNaN(betInput) || betInput <= 0) { alert("Invalid bet!"); return; }
        if(betInput > balance) { alert("Insufficient balance!"); return; }

        currentBet = betInput;
        balance -= currentBet;
        updateDisplay();
        
        gameActive = true;
        currentStep = 0; 
        updateChickenPosition();
        const chicken = document.getElementById('chicken');
        chicken.innerHTML = '🐔';

        document.getElementById('go-btn').innerText = "GO CHICKEN";
        document.getElementById('cash-btn').disabled = false;
        document.getElementById('bet-input').disabled = true;
        document.querySelectorAll('.btn-diff').forEach(b => b.style.pointerEvents = 'none');

        document.getElementById('status-bar').innerText = `Stage 1 (${stepMultipliers[0].toFixed(2)}x). Move forward!`;

        highlightCurrentStepUI();
        updateSafetyBreakerPosition();

        cars = [];
        const spawnRates = { easy: 1100, medium: 800, high: 550 };
        trafficInterval = setInterval(spawnCar, spawnRates[difficulty]);
    }

    function highlightCurrentStepUI() {
        document.querySelectorAll('.step-node').forEach((el, idx) => {
            if(idx === currentStep) {
                el.style.background = '#3b82f6';
                el.style.color = '#fff';
                el.style.transform = 'scale(1.15)';
                el.style.borderColor = '#60a5fa';
                el.style.boxShadow = '0 0 12px rgba(59,130,246,0.7)';
            } else if (idx < currentStep) {
                el.style.background = '#059669';
                el.style.color = '#fff';
                el.style.transform = 'scale(1)';
                el.style.borderColor = '#10b981';
            } else {
                el.style.background = '#1f2937';
                el.style.color = '#9ca3af';
                el.style.transform = 'scale(1)';
                el.style.borderColor = '#374151';
                el.style.boxShadow = 'none';
            }
        });
    }

    function updateSafetyBreakerPosition() {
        if(currentBreaker) {
            currentBreaker.remove();
        }
        
        const container = document.getElementById('lane-container');
        const chicken = document.getElementById('chicken');
        const chickenRect = chicken.getBoundingClientRect();
        const containerRect = container.getBoundingClientRect();
        
        const breaker = document.createElement('div');
        breaker.className = 'breaker';
        
        const breakerTop = chickenRect.bottom - containerRect.top + 5;
        breaker.style.top = `${breakerTop}px`;
        container.appendChild(breaker);
        currentBreaker = breaker;
    }

    function spawnCar() {
        if(!gameActive) return;
        for(let i=0; i<6; i++) {
            if(Math.random() < 0.3) {
                const lane = document.querySelectorAll('.lane')[i];
                if(lane.querySelector('.car')) continue;

                const car = document.createElement('div');
                car.className = 'car';
                car.innerHTML = carEmojis[Math.floor(Math.random() * carEmojis.length)];
                car.style.top = '-60px';
                
                const laneRect = lane.getBoundingClientRect();
                const containerRect = document.getElementById('lane-container').getBoundingClientRect();
                const centerOffset = laneRect.left - containerRect.left + (laneRect.width / 2) - 35;
                car.style.left = `${centerOffset}px`;

                lane.appendChild(car);
                cars.push({ el: car, top: -60, laneIndex: i });
            }
        }
    }

    collisionInterval = setInterval(() => {
        if(!gameActive) return;
        const speeds = { easy: 4, medium: 7, high: 10 };
        const speed = speeds[difficulty];

        const chickenRect = document.getElementById('chicken').getBoundingClientRect();

        for (let i = cars.length - 1; i >= 0; i--) {
            const carObj = cars[i];
            
            let stoppedByBreaker = false;
            if(currentBreaker) {
                const bRect = currentBreaker.getBoundingClientRect();
                if (carObj.top + 50 >= bRect.top && carObj.top <= bRect.bottom) {
                    stoppedByBreaker = true;
                }
            }

            if(!stoppedByBreaker) {
                carObj.top += speed;
                carObj.el.style.top = `${carObj.top}px`;
            }

            if (carObj.laneIndex === currentStep) {
                const carRect = carObj.el.getBoundingClientRect();
                
                if (!(chickenRect.right < carRect.left || 
                      chickenRect.left > carRect.right || 
                      chickenRect.bottom < carRect.top || 
                      chickenRect.top > carRect.bottom)) {
                    endGame(false, "Crash! Game Over.");
                    return;
                }
            }

            if(carObj.top > 500) {
                carObj.el.remove();
                cars.splice(i, 1);
            }
        }
    }, 30);

    function advanceChicken() {
        if (!gameActive) return;
        currentStep++;

        if (currentStep >= stepMultipliers.length) {
            const finalPayout = currentBet * stepMultipliers[stepMultipliers.length - 1];
            balance += finalPayout;
            updateDisplay();
            endGame(true, `YOU WIN! Won $${finalPayout.toFixed(2)}`);
        } else {
            updateChickenPosition();
            highlightCurrentStepUI();
            const currentMult = stepMultipliers[currentStep];
            document.getElementById('status-bar').innerText = `Stage ${currentStep + 1} (${currentMult.toFixed(2)}x). Keep going!`;
            updateSafetyBreakerPosition();
        }
    }

    function cashOut() {
        if(!gameActive) return;
        const activeMult = stepMultipliers[currentStep] || 1.0;
        const payout = currentBet * activeMult;
        
        if (Number.isFinite(payout)) {
            balance += payout;
            endGame(true, `Cashed out $${payout.toFixed(2)}!`);
        } else {
            endGame(false, "Error calculating payout.");
        }
        updateDisplay();
    }

    function endGame(win, message) {
        gameActive = false;
        clearInterval(trafficInterval);
        clearInterval(collisionInterval);
        
        document.getElementById('status-bar').innerText = message;
        if(!win) {
            document.getElementById('chicken').innerHTML = '💥';
        }

        document.getElementById('go-btn').innerText = "GO CHICKEN";
        document.getElementById('cash-btn').disabled = true;
        const betInput = document.getElementById('bet-input');
        betInput.disabled = false;
        
        if (isNaN(parseFloat(betInput.value))) {
            betInput.value = "10";
        }

        document.querySelectorAll('.btn-diff').forEach(b => b.style.pointerEvents = 'auto');

        cars.forEach(c => c.el.remove());
        cars = [];
        if(currentBreaker) {
            currentBreaker.remove();
            currentBreaker = null;
        }
    }

    initStepsUI();
    updateDisplay();
    updateChickenPosition();
</script>
</body>
</html>
