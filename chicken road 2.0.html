<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chicken Road 2 Simulation</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0d1b2a;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }
        .header {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1b263b;
            padding: 10px 20px;
            border-radius: 10px;
            margin-bottom: 10px;
            border: 1px solid #415a77;
        }
        .balance { font-size: 1.3rem; font-weight: bold; color: #70e000; }
        
        .game-wrapper {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 450px;
            background: #343a40;
            border: 6px solid #495057;
            border-radius: 15px;
            overflow: hidden;
            display: flex;
        }
        /* Lanes */
        .lane {
            flex: 1;
            height: 100%;
            border-right: 2px dashed rgba(255,255,255,0.3);
            position: relative;
        }
        .lane:last-child { border-right: none; }
        
        /* Entities */
        #chicken {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 50px;
            font-size: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: left 0.1s ease, bottom 0.2s ease;
            z-index: 10;
        }
        . obstacle {
            position: absolute;
            top: -60px;
            width: 80%;
            left: 10%;
            height: 50px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }
        .car-red { background: #d90429; border: 2px solid #ef233c; }
        .car-blue { background: #0077b6; border: 2px solid #0096c7; }
        .car-yellow { background: #ffb703; border: 2px solid #fb8500; }
        .breaker { background: #6c757d; height: 30px; border-top: 4px dashed #fff; }

        .multiplier-node {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: #212529;
            color: #ffb703;
            padding: 8px 12px;
            border-radius: 20px;
            font-weight: bold;
            border: 1px solid #ffb703;
        }

        .controls-panel {
            width: 100%;
            max-width: 800px;
            background: #1b263b;
            padding: 15px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 10px;
            border: 1px solid #415a77;
        }
        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .input-group { display: flex; align-items: center; gap: 10px; }
        input {
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #415a77;
            background: #0d1b2a;
            color: #fff;
            width: 100px;
            text-align: center;
            font-weight: bold;
        }
        .difficulty-group { display: flex; gap: 5px; }
        .btn-diff {
            padding: 8px 12px;
            background: #0d1b2a;
            color: #fff;
            border: 1px solid #415a77;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-diff.active { background: #415a77; border-color: #fff; font-weight: bold; }
        
        .action-group { display: flex; gap: 10px; width: 100%; }
        button.action-btn {
            flex: 1;
            padding: 15px;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn-go { background: linear-gradient(to bottom, #70e000, #38b000); }
        .btn-cash { background: linear-gradient(to bottom, #ffb703, #fb8500); }
        button:disabled { background: #555; color: #888; cursor: not-allowed; }

        #status-bar {
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffb703;
            min-height: 28px;
        }
    </style>
</head>
<body>

<div class="header">
    <h2>Chicken Road 2</h2>
    <div class="balance">Balance: $<span id="balance-amount">1000.00</span></div>
</div>

<div class="game-wrapper" id="lane-container">
    <div class="lane" id="lane-0"><div class="multiplier-node">1.2x</div></div>
    <div class="lane" id="lane-1"><div class="multiplier-node">1.5x</div></div>
    <div class="lane" id="lane-2"><div class="multiplier-node">2.0x</div></div>
    <div class="lane" id="lane-3"><div class="multiplier-node">3.0x</div></div>
    <div class="lane" id="lane-4"><div class="multiplier-node">5.0x</div></div>
    <div id="chicken">🐔</div>
</div>

<div id="status-bar">Select difficulty, set bet, and press GO!</div>

<div class="controls-panel">
    <div class="control-row">
        <div class="input-group">
            <label>Bet ($):</label>
            <input type="number" id="bet-input" value="10" min="1">
        </div>
        <div class="difficulty-group">
            <span style="align-self: center; font-size: 0.9rem; color: #aaa;">Speed:</span>
            <button class="btn-diff active" onclick="setDifficulty('easy', this)">Easy</button>
            <button class="btn-diff" onclick="setDifficulty('medium', this)">Medium</button>
            <button class="btn-diff" onclick="setDifficulty('high', this)">High</button>
        </div>
    </div>
    <div class="action-group">
        <button class="action-btn btn-go" id="go-btn" onclick="startGame()">GO</button>
        <button class="action-btn btn-cash" id="cash-btn" onclick="cashOut()" disabled>Collect Cash</button>
    </div>
</div>

<script>
    let balance = 1000.00;
    let currentBet = 0;
    let currentLane = 2; // Middle lane
    let gameActive = false;
    let difficulty = 'easy';
    let gameLoop = null;
    let obstacles = [];
    const multipliers = [1.2, 1.5, 2.0, 3.0, 5.0];
    const carTypes = ['car-red', 'car-blue', 'car-yellow'];

    function updateDisplay() {
        document.getElementById('balance-amount').innerText = balance.toFixed(2);
    }

    function setDifficulty(level, btn) {
        if(gameActive) return;
        difficulty = level;
        document.querySelectorAll('.btn-diff').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    // Controls for moving chicken
    window.addEventListener('keydown', (e) => {
        if(!gameActive) return;
        if(e.key === 'ArrowLeft' && currentLane > 0) currentLane--;
        if(e.key === 'ArrowRight' && currentLane < 4) currentLane++;
        updateChickenPosition();
    });

    function updateChickenPosition() {
        const chicken = document.getElementById('chicken');
        const laneWidth = document.getElementById('lane-0').offsetWidth;
        const targetLeft = (currentLane * laneWidth) + (laneWidth / 2) - 25;
        chicken.style.left = `${targetLeft}px`;
    }

    function startGame() {
        if(gameActive) return;
        const betInput = parseFloat(document.getElementById('bet-input').value);
        if(isNaN(betInput) || betInput <= 0) { alert("Invalid bet!"); return; }
        if(betInput > balance) { alert("Insufficient balance!"); return; }

        currentBet = betInput;
        balance -= currentBet;
        updateDisplay();
        
        gameActive = true;
        currentLane = 2;
        updateChickenPosition();
        document.getElementById('chicken').innerHTML = '🐔';

        document.getElementById('go-btn').disabled = true;
        document.getElementById('cash-btn').disabled = false;
        document.getElementById('bet-input').disabled = true;
        document.getElementById('status-bar').innerText = "Game Started! Dodge traffic!";

        obstacles = [];
        const speedMap = { easy: 5, medium: 8, high: 12 };
        const spawnRate = speedMap[difficulty] * 10;

        gameLoop = setInterval(() => {
            spawnObstacles();
            moveObstacles();
            checkCollision();
        }, 50);
    }

    function spawnObstacles() {
        // Randomly spawn in lanes
        for(let i=0; i<5; i++) {
            if(Math.random() < 0.05) { // Spawn chance
                // Check if already has obstacle near top
                const lane = document.getElementById(`lane-${i}`);
                if(lane.querySelector('.obstacle')) continue;

                const obs = document.createElement('div');
                const isBreaker = Math.random() < 0.2;
                obs.className = `obstacle ${isBreaker ? 'breaker' : carTypes[Math.floor(Math.random()*carTypes.length)]}`;
                if(!isBreaker) obs.innerHTML = '🚗';
                obs.style.top = '-60px';
                lane.appendChild(obs);
                obstacles.push({ el: obs, lane: i, top: -60, isBreaker: isBreaker });
            }
        }
    }

    function moveObstacles() {
        const speedMap = { easy: 4, medium: 7, high: 10 };
        const speed = speedMap[difficulty];
        
        for (let i = obstacles.length - 1; i >= 0; i--) {
            const obs = obstacles[i];
            obs.top += speed;
            obs.el.style.top = `${obs.top}px`;

            // Remove if off screen
            if(obs.top > 450) {
                obs.el.remove();
                obstacles.splice(i, 1);
            }
        }
    }

    function checkCollision() {
        const chicken = document.getElementById('chicken');
        const chickenRect = chicken.getBoundingClientRect();

        obstacles.forEach(obs => {
            const obsRect = obs.el.getBoundingClientRect();
            
            // Simple overlap check
            if (!(chickenRect.right < obsRect.left || 
                  chickenRect.left > obsRect.right || 
                  chickenRect.bottom < obsRect.top || 
                  chickenRect.top > obsRect.bottom)) {
                
                endGame(false, "Crash! Game Over.");
            }
        });
    }

    function cashOut() {
        if(!gameActive) return;
        // Calculate payout based on time survived or fixed stage
        const payout = currentBet * multipliers[Math.floor(Math.random() * multipliers.length)];
        endGame(true, `Collected $${payout.toFixed(2)}!`);
        balance += payout;
        updateDisplay();
    }

    function endGame(win, message) {
        clearInterval(gameLoop);
        gameActive = false;
        document.getElementById('status-bar').innerText = message;
        if(!win) document.getElementById('chicken').innerHTML = '💥';

        document.getElementById('go-btn').disabled = false;
        document.getElementById('cash-btn').disabled = true;
        document.getElementById('bet-input').disabled = false;

        // Clear all obstacles
        obstacles.forEach(obs => obs.el.remove());
        obstacles = [];
    }

    updateDisplay();
</script>
</body>
</html>
