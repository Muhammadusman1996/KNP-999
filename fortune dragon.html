<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortune Dragon Game</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: #1a0033;
            color: white;
            font-family: Arial, sans-serif;
        }
        #game-container {
            border: 5px solid #ffcc00;
            border-radius: 15px;
            padding: 20px;
            background: #330066;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            width: 380px;
        }
        #reels {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            justify-content: center;
        }
        .reel {
            width: 90px;
            height: 130px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
            transition: transform 0.1s;
            overflow: hidden;
        }
        .reel img {
            width: 80%;
            height: 80%;
            object-fit: contain;
        }
        .controls {
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }
        .btn {
            padding: 10px 20px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background: #ff3300;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .bet-btn {
            background: #0088cc;
            padding: 8px 15px;
        }
        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 15px;
        }
        #spin-btn {
            background: #ffcc00;
            color: #330066;
            font-size: 22px;
            padding: 15px 30px;
            flex: 1;
        }
        #auto-spin-btn {
            background: #8800cc;
            font-size: 18px;
            padding: 15px 25px;
            flex: 1;
        }
        .info-display {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            background: rgba(0,0,0,0.3);
            padding: 5px;
            border-radius: 5px;
        }
        .multi-display {
            color: #ff3300;
            font-size: 22px;
        }
        @keyframes winPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); background: #ffea00; }
            100% { transform: scale(1); }
        }
        .winner {
            animation: winPulse 0.5s infinite;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="info-display">
        بیلنس: <span id="balance">1000</span> پوائنٹس
    </div>
    <div class="info-display" style="color: #00ffcc;">
        اس اسپن کی جیت: <span id="current-win">0</span>
    </div>
    <div class="info-display multi-display" id="multiplier-display">
        اگلا ملٹی پلائر: 1X
    </div>
    
    <div id="reels">
        <div class="reel" id="reel1"><img src="https://cdn-icons-png.flaticon.com/512/1998/1998592.png" alt="Dragon"></div>
        <div class="reel" id="reel2"><img src="https://cdn-icons-png.flaticon.com/512/1998/1998592.png" alt="Dragon"></div>
        <div class="reel" id="reel3"><img src="https://cdn-icons-png.flaticon.com/512/1998/1998592.png" alt="Dragon"></div>
    </div>
    
    <div class="controls">
        <button class="btn bet-btn" onclick="updateBet(-1)">-</button>
        <span class="info-display">بيت: <span id="bet-amount">10</span></span>
        <button class="btn bet-btn" onclick="updateBet(1)">+</button>
    </div>
    
    <div class="action-buttons">
        <button id="spin-btn" class="btn" onclick="spinReels()">SPIN</button>
        <button id="auto-spin-btn" class="btn" onclick="toggleAutoSpin()">آٹو اسپن: بند</button>
    </div>
</div>

<script>
    let balance = 1000;
    let bet = 10;
    let spinCount = 0;
    let currentMultiplier = 1;
    let autoSpinInterval = null;
    let isAutoSpinning = false;
    
    // Configured payouts based on user request (for base bet 10)
    // Payout rates relative to bet amount
    const symbols = [
        { id: 'cat', name: 'Cat', src: 'https://cdn-icons-png.flaticon.com/512/1998/1998592.png', payout2: 2, payout3: 20 },
        { id: 'clipboard', name: 'Clipboard', src: 'https://cdn-icons-png.flaticon.com/512/2619/2619637.png', payout2: 3, payout3: 30 },
        { id: 'bottle', name: 'Bottle', src: 'https://cdn-icons-png.flaticon.com/512/3067/3067417.png', payout2: 1, payout3: 10 },
        { id: 'mobile', name: 'Mobile', src: 'https://cdn-icons-png.flaticon.com/512/4155/4155778.png', payout2: 0.5, payout3: 5 },
        { id: 'pen', name: 'Pen', src: 'https://cdn-icons-png.flaticon.com/512/2723/2723330.png', payout2: 1.5, payout3: 15 }
    ];

    function updateBet(direction) {
        if (bet + (direction * 5) >= 5) {
            bet += direction * 5;
            document.getElementById('bet-amount').innerText = bet;
        }
    }

    function playSound(type) {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'spin') {
            osc.frequency.setValueAtTime(400, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.3, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.3);
            osc.start();
            osc.stop(ctx.currentTime + 0.3);
        } else if (type === 'win') {
            osc.frequency.setValueAtTime(587.33, ctx.currentTime);
            osc.frequency.setValueAtTime(880, ctx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.5, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.3);
            osc.start();
            osc.stop(ctx.currentTime + 0.3);
        }
    }

    function toggleAutoSpin() {
        const btn = document.getElementById('auto-spin-btn');
        if (isAutoSpinning) {
            clearInterval(autoSpinInterval);
            isAutoSpinning = false;
            btn.innerText = "آٹو اسپن: بند";
            btn.style.background = "#8800cc";
        } else {
            isAutoSpinning = true;
            btn.innerText = "آٹو اسپن: جاری";
            btn.style.background = "#00cc44";
            spinReels();
            autoSpinInterval = setInterval(spinReels, 1500);
        }
    }

    function spinReels() {
        if (balance < bet) {
            alert("ناکافی بیلنس!");
            if (isAutoSpinning) toggleAutoSpin();
            return;
        }

        spinCount++;
        balance -= bet;
        document.getElementById('balance').innerText = balance;
        document.getElementById('current-win').innerText = "0";
        playSound('spin');

        if (spinCount >= 15) {
            currentMultiplier = Math.floor(Math.random() * 4) + 2; // 2X to 5X
            spinCount = 0;
        } else {
            currentMultiplier = 1;
        }
        document.getElementById('multiplier-display').innerText = "اگلا ملٹی پلائر: " + currentMultiplier + "X";

        const reelElements = [
            document.getElementById('reel1'),
            document.getElementById('reel2'),
            document.getElementById('reel3')
        ];

        reelElements.forEach(reel => {
            reel.classList.remove('winner');
            reel.style.transform = 'translateY(-10px)';
        });

        setTimeout(() => {
            const selectedSymbols = [];
            for (let i = 0; i < reelElements.length; i++) {
                const randomSymbol = symbols[Math.floor(Math.random() * symbols.length)];
                selectedSymbols.push(randomSymbol);
                reelElements[i].innerHTML = `<img src="${randomSymbol.src}" alt="${randomSymbol.name}">`;
            }

            reelElements.forEach(reel => {
                reel.style.transform = 'translateY(0)';
            });

            let winMultiplier = 0;
            if (selectedSymbols[0].id === selectedSymbols[1].id && selectedSymbols[1].id === selectedSymbols[2].id) {
                winMultiplier = selectedSymbols[0].payout3;
            } else if (selectedSymbols[0].id === selectedSymbols[1].id || selectedSymbols[1].id === selectedSymbols[2].id) {
                winMultiplier = selectedSymbols[1].payout2;
            } else if (selectedSymbols[0].id === selectedSymbols[2].id) {
                winMultiplier = selectedSymbols[0].payout2;
            }

            if (winMultiplier > 0) {
                playSound('win');
                // Calculate win relative to current bet
                const baseWin = (bet / 10) * winMultiplier * 10;
                const totalWin = Math.round(baseWin * currentMultiplier);
                balance += totalWin;
                document.getElementById('balance').innerText = balance;
                document.getElementById('current-win').innerText = totalWin;
                reelElements.forEach(reel => reel.classList.add('winner'));
                alert("مبارک ہو! آپ نے " + totalWin + " پوائنٹس جیت لیے! (اسپن جیت: " + baseWin + " X ملٹی پلائر: " + currentMultiplier + "X)");
            }
        }, 300);
    }
</script>

</body>
</html>
