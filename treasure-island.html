<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Treasure Island - Slot Game</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: #1a0500;
      color: #ffd700;
      font-family: 'Arial', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
    }
    .slot-container {
      border: 15px solid #8b4513;
      border-radius: 30px;
      padding: 20px;
      background: #4a1500;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
      width: 90%;
      max-width: 900px;
    }
    .reel-window {
      background: #fff6d1;
      border: 5px solid #d4af37;
      border-radius: 15px;
      overflow: hidden;
      height: 300px;
      display: flex;
    }
    .reel {
      flex: 1;
      display: flex;
      flex-direction: column;
      transition: transform 3s cubic-bezier(0.1, 0.8, 0.3, 1);
    }
    .symbol {
      height: 100px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 3rem;
      border-bottom: 2px solid #ecd0a8;
    }
    .btn-spin {
      background: linear-gradient(180deg, #ff4500, #8b0000);
      border: 4px solid #ffd700;
      color: white;
      font-weight: bold;
      font-size: 1.5rem;
      border-radius: 50%;
      width: 120px;
      height: 120px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    }
    .btn-spin:active {
      transform: translateY(4px);
    }
    .jackpot-box {
      background: #000;
      border: 3px solid #ff0000;
      color: #ff0000;
      padding: 10px;
      border-radius: 10px;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="slot-container">
  <h1 class="text-center text-4xl font-black text-amber-500 mb-4" style="text-shadow: 2px 2px #000;">TREASURE ISLAND</h1>
  
  <div class="flex justify-between items-center mb-4">
    <div class="jackpot-box">باکس جیک پاٹ: $500,000</div>
    <div class="text-xl font-bold">بیلنس: <span id="balance">1000$</span></div>
  </div>

  <div class="reel-window mb-4">
    <div class="reel" id="reel1"></div>
    <div class="reel" id="reel2"></div>
    <div class="reel" id="reel3"></div>
    <div class="reel" id="reel4"></div>
    <div class="reel" id="reel5"></div>
  </div>

  <div class="flex justify-between items-center bg-black/40 p-4 rounded-xl">
    <div>بیٹ: <span id="bet">10$</span></div>
    <button class="btn-spin" onclick="spinReels()">SPIN</button>
  </div>
</div>

<script>
  const symbols = ['🏴‍☠️', '🦜', '🪙', '⚓', '🗡️', '💎'];
  
  function createReels() {
    for(let i=1; i<=5; i++) {
      const reel = document.getElementById(`reel${i}`);
      let html = '';
      for(let j=0; j<20; j++) {
        const randomSym = symbols[Math.floor(Math.random() * symbols.length)];
        html += `<div class="symbol">${randomSym}</div>`;
      }
      reel.innerHTML = html;
    }
  }

  function spinReels() {
    for(let i=1; i<=5; i++) {
      const reel = document.getElementById(`reel${i}`);
      const randomOffset = Math.floor(Math.random() * 15) * 100;
      reel.style.transition = `transform ${2 + i*0.5}s cubic-bezier(0.1, 0.8, 0.3, 1)`;
      reel.style.transform = `translateY(-${randomOffset}px)`;
    }
  }

  createReels();
</script>

</body>
</html>
