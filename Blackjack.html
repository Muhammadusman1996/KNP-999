<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Blackjack - Slot Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #090014;
      color: #ffd700;
      font-family: 'Arial Black', sans-serif;
      user-select: none;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .slot-machine-container {
      border: 8px solid #d4af37;
      box-shadow: 0 0 40px rgba(255, 215, 0, 0.4), inset 0 0 30px rgba(0,0,0,0.9);
      border-radius: 32px;
      background: #1a0033;
      width: 95vw;
      max-width: 960px;
      padding: 16px;
      max-height: 98vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .screen-gradient {
      background: radial-gradient(circle, #4a0088 0%, #0d001a 100%);
    }

    .reel-strip {
      transition: transform 3s cubic-bezier(0.1, 0.8, 0.3, 1);
    }

    .symbol {
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      border-bottom: 1px solid rgba(255, 215, 0, 0.15);
    }

    .clean-btn {
      background: linear-gradient(135deg, #ffd700 0%, #b38600 100%);
      border: 1px solid #fff;
      box-shadow: 0 3px 0 #806000;
      font-weight: 900;
      color: #000;
      cursor: pointer;
      transition: all 0.1s;
    }
    .clean-btn:active {
      transform: translateY(2px);
      box-shadow: 0 0 0 #806000;
    }

    .btn-spin {
      background: radial-gradient(circle, #ff3333 0%, #990000 100%);
      border: 4px solid #ffcc00;
      box-shadow: 0 6px 0 #4a0000, 0 10px 15px rgba(0,0,0,0.5);
      font-family: 'Arial Black', sans-serif;
      cursor: pointer;
    }
    .btn-spin:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #4a0000, 0 3px 6px rgba(0,0,0,0.5);
    }

    .side-badge {
      width: 42px;
      height: 42px;
      border: 2px solid #ffd700;
      border-radius: 50%;
      background: radial-gradient(circle, #3b0066 0%, #150026 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      box-shadow: inset 0 0 8px rgba(255,215,0,0.5);
    }

    @keyframes pulseGlow {
      0%, 100% { filter: drop-shadow(0 0 6px #ff00ea); }
      50% { filter: drop-shadow(0 0 15px #00ffcc); }
    }
    .jackpot-text {
      animation: pulseGlow 2s infinite;
    }
  </style>
</head>
<body>

  <div class="slot-machine-container relative">
    
    <!-- Top Header -->
    <div class="flex justify-between items-center px-4 bg-black/40 py-2 rounded-xl border border-yellow-500/30">
      <div class="flex items-center space-x-2">
        <div class="w-3 h-3 rounded-full bg-yellow-400 animate-ping"></div>
        <span class="text-xs tracking-widest uppercase font-bold text-yellow-200">ONLINE CASINO</span>
      </div>

      <div class="bg-gradient-to-r from-purple-900 via-red-900 to-purple-900 px-6 py-1 rounded-xl border border-yellow-400 text-center shadow-inner">
        <div class="text-[9px] text-yellow-300 font-bold tracking-widest uppercase">Total Win</div>
        <div id="win-display" class="jackpot-text text-xl font-black text-white">$0.00</div>
      </div>

      <div class="bg-black/80 px-4 py-1 rounded-xl border border-yellow-500/50 text-right">
        <div class="text-[8px] text-yellow-400 font-bold uppercase">Balance</div>
        <div id="balance-display" class="text-base font-bold text-white">$1,000.00</div>
      </div>
    </div>

    <!-- Main Screen Area -->
    <div class="screen-gradient rounded-2xl p-3 border-2 border-yellow-600/50 shadow-2xl relative my-2">
      
      <!-- Left Decorative Panel -->
      <div class="absolute left-3 top-1/2 -translate-y-1/2 hidden md:flex flex-col space-y-2 z-10">
        <div class="side-badge">🍒</div>
        <div class="side-badge">🔔</div>
        <div class="side-badge">77</div>
        <div class="side-badge">👑</div>
      </div>

      <!-- Reels Arena -->
      <div class="md:mx-14 grid grid-cols-5 gap-1.5 bg-black/90 p-2 rounded-xl border-2 border-yellow-500/80 shadow-inner h-[270px] overflow-hidden">
        <!-- Reel 1 -->
        <div class="bg-white rounded overflow-hidden relative border border-yellow-400">
          <div id="reel-1" class="reel-strip absolute w-full flex flex-col"></div>
        </div>
        <!-- Reel 2 -->
        <div class="bg-white rounded overflow-hidden relative border border-yellow-400">
          <div id="reel-2" class="reel-strip absolute w-full flex flex-col"></div>
        </div>
        <!-- Reel 3 -->
        <div class="bg-white rounded overflow-hidden relative border border-yellow-400">
          <div id="reel-3" class="reel-strip absolute w-full flex flex-col"></div>
        </div>
        <!-- Reel 4 -->
        <div class="bg-white rounded overflow-hidden relative border border-yellow-400">
          <div id="reel-4" class="reel-strip absolute w-full flex flex-col"></div>
        </div>
        <!-- Reel 5 -->
        <div class="bg-white rounded overflow-hidden relative border border-yellow-400">
          <div id="reel-5" class="reel-strip absolute w-full flex flex-col"></div>
        </div>
      </div>

      <!-- Right Decorative Panel -->
      <div class="absolute right-3 top-1/2 -translate-y-1/2 hidden md:flex flex-col space-y-2 z-10">
        <div class="side-badge">👑</div>
        <div class="side-badge">77</div>
        <div class="side-badge">🔔</div>
        <div class="side-badge">🍒</div>
      </div>

      <!-- Footer Bar -->
      <div class="mt-2 flex justify-center items-center space-x-6 bg-black/60 py-1 rounded-lg border border-yellow-500/30">
        <span class="text-[10px] text-yellow-300 font-bold tracking-wider">LINES: 20 FIXED</span>
        <div class="flex items-center space-x-1.5">
          <span class="text-[10px] text-slate-300">STURES</span>
          <div class="w-2.5 h-2.5 rounded-full bg-green-500 border border-white animate-pulse"></div>
          <span class="text-[10px] text-yellow-400 font-bold">20%</span>
        </div>
      </div>

    </div>

    <!-- Bottom Controls Deck -->
    <div class="flex items-center justify-between gap-2 bg-purple-950/90 p-3 rounded-xl border border-yellow-500/50">
      
      <!-- Side Navigation -->
      <div class="flex space-x-1.5">
        <button onclick="handleSideBtn('BET')" class="clean-btn px-3 py-1.5 rounded-lg text-[10px]">BET</button>
        <button onclick="handleSideBtn('PAY')" class="clean-btn px-3 py-1.5 rounded-lg text-[10px]">PAY</button>
        <button onclick="handleSideBtn('VIEW')" class="clean-btn px-3 py-1.5 rounded-lg text-[10px]">VIEW</button>
      </div>

      <!-- Bet Adjuster -->
      <div class="flex flex-col items-center bg-black/50 px-3 py-1 rounded-lg border border-yellow-500/30">
        <span class="text-[8px] text-yellow-400 font-bold uppercase mb-0.5">Total Wager</span>
        <div class="flex items-center space-x-2">
          <button onclick="adjustBet(-1)" class="w-7 h-7 rounded bg-red-800 text-white font-black text-base flex items-center justify-center border border-red-500 active:translate-y-0.5">-</button>
          <div class="text-center w-20">
            <span id="current-bet-display" class="text-base font-black text-white">$10.00</span>
          </div>
          <button onclick="adjustBet(1)" class="w-7 h-7 rounded bg-green-700 text-white font-black text-base flex items-center justify-center border border-green-500 active:translate-y-0.5">+</button>
        </div>
      </div>

      <!-- Spin Button -->
      <div>
        <button id="btn-spin" onclick="startSpin()" class="btn-spin w-20 h-20 rounded-full flex flex-col items-center justify-center text-center">
          <span class="text-[8px] tracking-widest uppercase font-bold text-yellow-200">TAP TO</span>
          <span class="text-lg font-black text-white tracking-wider">SPIN</span>
        </button>
      </div>

    </div>

  </div>

  <script>
    const SYMBOLS = [
      { name: '77', icon: '🎰', value: 100, color: 'text-red-600' },
      { name: 'Crown', icon: '👑', value: 50, color: 'text-purple-600' },
      { name: 'Bell', icon: '🔔', value: 20, color: 'text-yellow-600' },
      { name: 'Cherry', icon: '🍒', value: 10, color: 'text-rose-600' },
      { name: 'Chest', icon: '📦', value: 5, color: 'text-amber-600' }
    ];

    const ALLOWED_BETS = [10.00, 20.00, 30.00, 50.00, 100.00];
    let currentBetIndex = 0;
    let userBalance = 1000.00;
    let isSpinning = false;

    const REEL_CONFIG = [
      [0, 1, 2, 3, 4, 0, 2, 1, 3],
      [4, 3, 2, 1, 0, 3, 1, 4, 2],
      [2, 0, 4, 1, 3, 4, 0, 2, 1],
      [1, 2, 3, 4, 0, 2, 1, 3, 0],
      [3, 4, 1, 0, 2, 1, 4, 0, 3]
    ];

    window.onload = () => {
      initReels();
      updateDisplay();
    };

    function updateDisplay() {
      document.getElementById('balance-display').innerText = `$${userBalance.toFixed(2)}`;
      document.getElementById('current-bet-display').innerText = `$${ALLOWED_BETS[currentBetIndex].toFixed(2)}`;
    }

    function adjustBet(direction) {
      if (isSpinning) return;
      currentBetIndex = (currentBetIndex + direction + ALLOWED_BETS.length) % ALLOWED_BETS.length;
      updateDisplay();
    }

    function initReels() {
      for (let i = 1; i <= 5; i++) {
        const strip = document.getElementById(`reel-${i}`);
        strip.innerHTML = '';
        const sequence = [...REEL_CONFIG[i-1], ...REEL_CONFIG[i-1], ...REEL_CONFIG[i-1]];
        sequence.forEach(idx => {
          const sym = SYMBOLS[idx];
          const el = document.createElement('div');
          el.className = `symbol ${sym.color} font-black drop-shadow`;
          el.innerText = sym.icon;
          strip.appendChild(el);
        });
      }
    }

    function startSpin() {
      if (isSpinning) return;
      const bet = ALLOWED_BETS[currentBetIndex];
      if (userBalance < bet) {
        alert("Balance too low!");
        return;
      }

      isSpinning = true;
      userBalance -= bet;
      updateDisplay();
      document.getElementById('win-display').innerText = "$0.00";
      document.getElementById('btn-spin').style.opacity = "0.6";

      const stoppedIndices = [];
      const symbolHeight = 90;

      for (let i = 1; i <= 5; i++) {
        const strip = document.getElementById(`reel-${i}`);
        const randomIndex = Math.floor(Math.random() * REEL_CONFIG[i-1].length);
        stoppedIndices.push(REEL_CONFIG[i-1][randomIndex]);

        const totalSymbols = REEL_CONFIG[i-1].length;
        const offset = (totalSymbols * 2 + randomIndex) * symbolHeight;

        strip.style.transition = `transform ${2 + i * 0.4}s cubic-bezier(0.1, 0.8, 0.3, 1)`;
        strip.style.transform = `translateY(-${offset}px)`;
      }

      setTimeout(() => {
        checkWin(stoppedIndices, bet);
        isSpinning = false;
        document.getElementById('btn-spin').style.opacity = "1";
      }, 4000);
    }

    function checkWin(stoppedIndices, bet) {
      const first = stoppedIndices[0];
      const matches = stoppedIndices.filter(idx => idx === first).length;

      if (matches >= 3) {
        const win = bet * SYMBOLS[first].value * (matches * 0.1);
        userBalance += win;
        document.getElementById('win-display').innerText = `+$${win.toFixed(2)}`;
        updateDisplay();
      }
    }

    function handleSideBtn(action) {
      alert(`[${action}] Panel active.`);
    }
  </script>
</body>
</html>
