<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Roulette</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #050b14;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .header {
            width: 100%;
            max-width: 1000px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0d1b2a;
            padding: 15px 30px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #1b263b;
        }
        .balance {
            font-size: 1.5rem;
            font-weight: bold;
            color: #70e000;
        }
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            width: 100%;
            max-width: 900px;
        }
        .wheel-section {
            display: flex;
            justify-content: center;
            position: relative;
        }
        #wheel {
            width: 400px;
            height: 400px;
            border-radius: 50%;
            border: 12px solid #333;
            position: relative;
            transition: transform 4s cubic-bezier(0.15, 0.95, 0.15, 1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .ball {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            margin: -8px 0 0 -8px;
            z-index: 10;
            display: none;
            box-shadow: 0 0 8px #fff;
        }
        .betting-layout {
            background: #006622;
            padding: 25px;
            border-radius: 15px;
            border: 6px solid #d4af37;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.7);
            width: 100%;
            align-items: center;
        }
        .betting-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .betting-row {
            display: flex;
            gap: 10px;
        }
        .cell {
            width: 60px;
            height: 80px;
            border: 2px solid #fff;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .cell:hover {
            transform: translateY(-3px);
            filter: brightness(1.1);
        }
        .cell.selected {
            outline: 5px solid #00b4d8;
            transform: scale(1.05);
            z-index: 5;
        }
        .red { background-color: #d90429; }
        .black { background-color: #111; }
        .green { background-color: #2b9348; }
        .zero-section {
            width: 100%;
            height: 60px;
            font-size: 24px;
        }
        .controls-section {
            display: flex;
            width: 100%;
            justify-content: space-around;
            align-items: center;
            background: #0d1b2a;
            padding: 20px;
            border-radius: 15px;
            border: 1px solid #415a77;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        label { font-weight: bold; color: #aaa; }
        input {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #415a77;
            background: #1b263b;
            color: #fff;
            font-size: 18px;
            width: 150px;
            text-align: center;
        }
        .btn-spin {
            padding: 15px 40px;
            background: linear-gradient(to bottom, #70e000, #38b000);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(56, 176, 0, 0.4);
            transition: transform 0.1s, background 0.2s;
        }
        .btn-spin:hover { background: linear-gradient(to bottom, #9ef01a, #38b000); }
        .btn-spin:active { transform: scale(0.95); }
        .btn-spin:disabled { background: #6c757d; cursor: not-allowed; box-shadow: none; }
        #status-display {
            font-size: 1.4rem;
            font-weight: bold;
            color: #ffb703;
            text-align: center;
            min-height: 40px;
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body>

<div class="header">
    <h2>Professional Roulette</h2>
    <div class="balance">Balance: $<span id="balance-amount">1000.00</span></div>
</div>

<div class="game-container">
    <div class="wheel-section">
        <div id="wheel"></div>
        <div class="ball" id="ball"></div>
    </div>

    <div class="betting-layout">
        <div class="cell green zero-section" onclick="selectCell(0, 'green', this)">0</div>
        <div class="betting-grid" id="grid-container"></div>
    </div>

    <div class="controls-section">
        <div class="input-group">
            <label>Bet Amount ($)</label>
            <input type="number" id="bet-input" value="10" min="1">
        </div>
        <div id="status-display">Select a number to bet!</div>
        <button class="btn-spin" id="spin-btn" onclick="spinRoulette()">Spin</button>
    </div>
</div>

<script>
    let balance = 1000.00;
    let selectedNumber = null;
    let selectedColor = null;
    let isSpinning = false;

    const wheelNumbers = [
        0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10,
        5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26
    ];

    const redNumbers = [1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36];

    function initBoard() {
        const container = document.getElementById('grid-container');
        container.innerHTML = '';
        
        for (let row = 0; row < 12; row++) {
            const rowDiv = document.createElement('div');
            rowDiv.className = 'betting-row';
            for (let col = 0; col < 3; col++) {
                const num = 36 - (row * 3) - (2 - col);
                const color = redNumbers.includes(num) ? 'red' : 'black';
                const cell = document.createElement('div');
                cell.className = `cell ${color}`;
                cell.innerText = num;
                cell.onclick = () => selectCell(num, color, cell);
                rowDiv.appendChild(cell);
            }
            container.appendChild(rowDiv);
        }

        const wheel = document.getElementById('wheel');
        const segmentDegree = 360 / 37;
        let conicGradient = 'conic-gradient(';
        wheelNumbers.forEach((num, index) => {
            const color = num === 0 ? '#2b9348' : (redNumbers.includes(num) ? '#d90429' : '#111');
            const start = index * segmentDegree;
            const end = (index + 1) * segmentDegree;
            conicGradient += `${color} ${start}deg ${end}deg${index === wheelNumbers.length - 1 ? ')' : ', '}`;
        });
        wheel.style.background = conicGradient;
    }

    function selectCell(num, color, element) {
        if(isSpinning) return;
        document.querySelectorAll('.cell').forEach(c => c.classList.remove('selected'));
        if(element) element.classList.add('selected');
        
        selectedNumber = num;
        selectedColor = color;
        document.getElementById('status-display').innerText = `Selected: ${num} (${color.toUpperCase()})`;
    }

    function spinRoulette() {
        if (selectedNumber === null) {
            alert("Please select a number on the board first!");
            return;
        }
        const betAmount = parseFloat(document.getElementById('bet-input').value);
        if (isNaN(betAmount) || betAmount <= 0 || betAmount > balance) {
            alert("Invalid Bet Amount!");
            return;
        }

        isSpinning = true;
        balance -= betAmount;
        document.getElementById('balance-amount').innerText = balance.toFixed(2);
        
        const statusDisplay = document.getElementById('status-display');
        statusDisplay.innerText = "Spinning...";
        document.getElementById('spin-btn').disabled = true;
        
        const ball = document.getElementById('ball');
        ball.style.display = 'block';
        ball.style.animation = 'none';

        const winningNum = Math.floor(Math.random() * 37);
        const winningIndex = wheelNumbers.indexOf(winningNum);
        const degreePerNum = 360 / 37;
        const targetDegree = winningIndex * degreePerNum;
        const totalSpin = 360 * 6 + (360 - targetDegree);

        const wheel = document.getElementById('wheel');
        wheel.style.transition = 'transform 4s cubic-bezier(0.15, 0.95, 0.15, 1)';
        wheel.style.transform = `rotate(${totalSpin}deg)`;

        setTimeout(() => {
            wheel.style.transition = 'none';
            wheel.style.transform = `rotate(${totalSpin % 360}deg)`;
            
            isSpinning = false;
            document.getElementById('spin-btn').disabled = false;
            
            const winColor = winningNum === 0 ? 'green' : (redNumbers.includes(winningNum) ? 'red' : 'black');
            statusDisplay.innerText = `Winning Number: ${winningNum} (${winColor.toUpperCase()})`;

            if (selectedNumber === winningNum) {
                const payout = betAmount * 36;
                balance += payout;
                statusDisplay.innerText = `JACKPOT! Won $${payout}!`;
                document.getElementById('balance-amount').innerText = balance.toFixed(2);
            }
        }, 4000);
    }

    initBoard();
</script>

</body>
</html>
