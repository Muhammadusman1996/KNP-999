<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Bet Roulette Pro</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #050b14;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .header {
            width: 100%;
            max-width: 1000px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0d1b2a;
            padding: 15px 30px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #1b263b;
        }
        .balance {
            font-size: 1.5rem;
            font-weight: bold;
            color: #70e000;
        }
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            width: 100%;
            max-width: 900px;
        }
        .wheel-section {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .wheel-wrapper {
            position: relative;
            width: 380px;
            height: 380px;
            border-radius: 50%;
            border: 10px solid #d4af37;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        #wheel-canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            transition: transform 4s cubic-bezier(0.15, 0.95, 0.15, 1);
        }
        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 24px solid #ffd700;
            z-index: 20;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }
        .betting-layout {
            background: #006622;
            padding: 20px;
            border-radius: 15px;
            border: 5px solid #d4af37;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.7);
            width: 100%;
            align-items: center;
        }
        .betting-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .betting-row {
            display: flex;
            gap: 8px;
        }
        .cell {
            width: 55px;
            height: 70px;
            border: 2px solid #fff;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            box-shadow: inset 0 0 8px rgba(0,0,0,0.5);
            position: relative;
        }
        .cell:hover {
            transform: translateY(-2px);
            filter: brightness(1.15);
        }
        .cell.selected {
            outline: 4px solid #00b4d8;
            transform: scale(1.04);
            z-index: 5;
        }
        .cell.selected::after {
            content: '✓';
            position: absolute;
            top: 2px;
            right: 4px;
            font-size: 12px;
            color: #00b4d8;
        }
        .red { background-color: #d90429; }
        .black { background-color: #111; }
        .green { background-color: #2b9348; }
        .zero-section {
            width: 100%;
            height: 50px;
            font-size: 22px;
        }
        .controls-section {
            display: flex;
            width: 100%;
            justify-content: space-between;
            align-items: center;
            background: #0d1b2a;
            padding: 15px 25px;
            border-radius: 15px;
            border: 1px solid #415a77;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        label { font-weight: bold; color: #aaa; font-size: 14px; }
        input {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #415a77;
            background: #1b263b;
            color: #fff;
            font-size: 16px;
            width: 130px;
            text-align: center;
        }
        .btn-spin, .btn-clear {
            padding: 12px 25px;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: transform 0.1s, background 0.2s;
        }
        .btn-spin {
            background: linear-gradient(to bottom, #70e000, #38b000);
            box-shadow: 0 4px 15px rgba(56, 176, 0, 0.4);
        }
        .btn-spin:hover { background: linear-gradient(to bottom, #9ef01a, #38b000); }
        .btn-spin:active { transform: scale(0.95); }
        .btn-spin:disabled { background: #6c757d; cursor: not-allowed; box-shadow: none; }
        .btn-clear {
            background: #d90429;
            box-shadow: 0 4px 15px rgba(217, 4, 41, 0.4);
        }
        .btn-clear:hover { background: #ef233c; }
        #status-display {
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffb703;
            text-align: center;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            max-width: 350px;
        }
        .bet-info {
            font-size: 0.9rem;
            color: #8d99ae;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="header">
    <h2>Multi-Bet Roulette (Up to 20 Numbers)</h2>
    <div class="balance">Balance: $<span id="balance-amount">1000.00</span></div>
</div>

<div class="game-container">
    <div class="wheel-section">
        <div class="pointer"></div>
        <div class="wheel-wrapper">
            <canvas id="wheel-canvas" width="400" height="400"></canvas>
        </div>
    </div>

    <div class="betting-layout">
        <div class="cell green zero-section" onclick="toggleCell(0, this)">0</div>
        <div class="betting-grid" id="grid-container"></div>
    </div>

    <div class="controls-section">
        <div class="input-group">
            <label>Bet Per Number ($)</label>
            <input type="number" id="bet-input" value="10" min="1">
            <div class="bet-info">Selected: <span id="selected-count">0</span>/20</div>
        </div>
        <div id="status-display">Select up to 20 numbers to bet!</div>
        <button class="btn-clear" onclick="clearSelection()">Clear Bets</button>
        <button class="btn-spin" id="spin-btn" onclick="spinRoulette()">Spin</button>
    </div>
</div>

<script>
    let balance = 1000.00;
    let selectedNumbers = [];
    let isSpinning = false;
    let currentRotation = 0;

    const wheelNumbers = [
        0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10,
        5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26
    ];

    const redNumbers = [1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36];

    function drawWheel() {
        const canvas = document.getElementById('wheel-canvas');
        const ctx = canvas.getContext('2d');
        const numSegments = wheelNumbers.length;
        const radius = canvas.width / 2;
        const anglePerSegment = (2 * Math.PI) / numSegments;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        wheelNumbers.forEach((num, i) => {
            const startAngle = i * anglePerSegment - Math.PI / 2;
            const endAngle = startAngle + anglePerSegment;

            ctx.beginPath();
            ctx.moveTo(radius, radius);
            ctx.arc(radius, radius, radius, startAngle, endAngle);
            ctx.closePath();

            if (num === 0) {
                ctx.fillStyle = '#2b9348';
            } else if (redNumbers.includes(num)) {
                ctx.fillStyle = '#d90429';
            } else {
                ctx.fillStyle = '#111111';
            }
            ctx.fill();
            ctx.lineWidth = 1;
            ctx.strokeStyle = '#d4af37';
            ctx.stroke();

            ctx.save();
            ctx.translate(radius, radius);
            ctx.rotate(startAngle + anglePerSegment / 2 + Math.PI / 2);
            ctx.textAlign = 'center';
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 13px Segoe UI, sans-serif';
            ctx.fillText(num.toString(), 0, -radius + 24);
            ctx.restore();
        });

        ctx.beginPath();
        ctx.arc(radius, radius, 40, 0, 2 * Math.PI);
        ctx.fillStyle = '#0d1b2a';
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#d4af37';
        ctx.stroke();
    }

    function initBoard() {
        const container = document.getElementById('grid-container');
        container.innerHTML = '';

        for (let row = 0; row < 12; row++) {
            const rowDiv = document.createElement('div');
            rowDiv.className = 'betting-row';
            for (let col = 0; col < 3; col++) {
                const num = 36 - (row * 3) - (2 - col);
                const color = redNumbers.includes(num) ? 'red' : 'black';
                const cell = document.createElement('div');
                cell.className = `cell ${color}`;
                cell.innerText = num;
                cell.onclick = () => toggleCell(num, cell);
                rowDiv.appendChild(cell);
            }
            container.appendChild(rowDiv);
        }
        drawWheel();
    }

    function toggleCell(num, element) {
        if (isSpinning) return;

        const index = selectedNumbers.indexOf(num);
        if (index > -1) {
            selectedNumbers.splice(index, 1);
            element.classList.remove('selected');
        } else {
            if (selectedNumbers.length >= 20) {
                alert("You can select a maximum of 20 numbers!");
                return;
            }
            selectedNumbers.push(num);
            element.classList.add('selected');
        }

        document.getElementById('selected-count').innerText = selectedNumbers.length;
        updateStatus();
    }

    function clearSelection() {
        if (isSpinning) return;
        selectedNumbers = [];
        document.querySelectorAll('.cell').forEach(c => c.classList.remove('selected'));
        document.getElementById('selected-count').innerText = '0';
        updateStatus();
    }

    function updateStatus() {
        const status = document.getElementById('status-display');
        if (selectedNumbers.length === 0) {
            status.innerText = "Select up to 20 numbers to bet!";
        } else {
            status.innerText = `Selected (${selectedNumbers.length}): ${selectedNumbers.sort((a,b)=>a-b).join(', ')}`;
        }
    }

    function spinRoulette() {
        if (selectedNumbers.length === 0) {
            alert("Please select at least 1 number to place a bet!");
            return;
        }

        const betPerNum = parseFloat(document.getElementById('bet-input').value);
        if (isNaN(betPerNum) || betPerNum <= 0) {
            alert("Invalid bet amount!");
            return;
        }

        const totalBet = betPerNum * selectedNumbers.length;
        if (totalBet > balance) {
            alert(`Insufficient balance! Total bet is $${totalBet.toFixed(2)}.`);
            return;
        }

        isSpinning = true;
        balance -= totalBet;
        document.getElementById('balance-amount').innerText = balance.toFixed(2);

        const statusDisplay = document.getElementById('status-display');
        statusDisplay.innerText = "Spinning...";
        document.getElementById('spin-btn').disabled = true;

        const winningNum = Math.floor(Math.random() * 37);
        const winningIndex = wheelNumbers.indexOf(winningNum);

        const numSegments = 37;
        const anglePerSegment = 360 / numSegments;
        const targetSegmentAngle = winningIndex * anglePerSegment;

        const extraRounds = 360 * 6;
        const targetRotation = currentRotation + extraRounds + (360 - (currentRotation % 360)) - targetSegmentAngle;
        currentRotation = targetRotation;

        const canvas = document.getElementById('wheel-canvas');
        canvas.style.transition = 'transform 4s cubic-bezier(0.15, 0.95, 0.15, 1)';
        canvas.style.transform = `rotate(${targetRotation}deg)`;

        setTimeout(() => {
            isSpinning = false;
            document.getElementById('spin-btn').disabled = false;

            const winColor = winningNum === 0 ? 'GREEN' : (redNumbers.includes(winningNum) ? 'RED' : 'BLACK');
            
            if (selectedNumbers.includes(winningNum)) {
                const payout = betPerNum * 36;
                balance += payout;
                const netProfit = payout - totalBet;
                statusDisplay.innerText = `Winning Number: ${winningNum} (${winColor})! Won $${payout.toFixed(2)} (Profit: +$${netProfit.toFixed(2)})!`;
            } else {
                statusDisplay.innerText = `Winning Number: ${winningNum} (${winColor}). No match (Lost $${totalBet.toFixed(2)}).`;
            }

            document.getElementById('balance-amount').innerText = balance.toFixed(2);
        }, 4000);
    }

    initBoard();
</script>

</body>
</html>
