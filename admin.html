<!doctype html><html lang="ur"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KNP-999 Admin</title><style>body{font-family:Arial;background:#0b1020;color:#fff;padding:20px;max-width:900px;margin:auto}input,button{padding:10px;margin:5px;border-radius:8px;border:1px solid #555}button{cursor:pointer}section{padding:14px;margin:12px 0;background:#151e32;border-radius:12px}pre{white-space:pre-wrap;background:#151e32;padding:15px;border-radius:10px}</style></head><body><h1>KNP-999 Admin</h1><p>صرف Username اور Balance دکھایا جاتا ہے۔ پاس ورڈ کبھی plaintext میں محفوظ یا دکھایا نہیں جاتا؛ ضرورت پر reset کریں۔</p><input id="key" type="password" placeholder="ADMIN_KEY"><button id="customers">Customers</button><button id="requests">Pending Add Balance</button><button id="load">Games settings</button><section><h2>گیم Stake / Bet Amounts</h2><p>یہ رقمیں کسٹمر کو ہر گیم میں دستیاب ہوں گی۔</p><div id="stakeList"></div><input id="newStake" type="number" min="1" max="100000" placeholder="نئی رقم"><button id="addStake">رقم شامل کریں</button><button id="saveStakes">Stake محفوظ کریں</button></section><div id="games"></div><div id="customersView"></div><div id="requestsView"></div><pre id="out">سرور سے رابطہ کریں۔</pre><script>
const out=document.querySelector('#out'),key=()=>document.querySelector('#key').value,headers=()=>({'content-type':'application/json','x-admin-key':key()});
document.querySelector('#customers').onclick=async()=>{const r=await fetch('/api/admin/users',{headers:headers()}),d=await r.json();if(!r.ok){out.textContent=JSON.stringify(d);return;}document.querySelector('#customersView').innerHTML=d.map(u=>`<section><b>${u.username||'—'}</b><p>Balance: ${u.coins} coins</p><input id="credit-${u.id}" type="number" min="1" placeholder="Coins add"><button data-credit="${u.id}">Add coins</button><input id="pw-${u.id}" type="password" placeholder="New password (8+)"><button data-reset="${u.id}">Reset password</button></section>`).join('');document.querySelectorAll('[data-credit]').forEach(b=>b.onclick=async()=>{const id=b.dataset.credit,amount=Number(document.querySelector('#credit-'+id).value),x=await fetch('/api/admin/users/'+id+'/coins',{method:'POST',headers:headers(),body:JSON.stringify({amount})});out.textContent=JSON.stringify(await x.json());});document.querySelectorAll('[data-reset]').forEach(b=>b.onclick=async()=>{const id=b.dataset.reset,password=document.querySelector('#pw-'+id).value,x=await fetch('/api/admin/users/'+id+'/reset-password',{method:'POST',headers:headers(),body:JSON.stringify({password})});out.textContent=JSON.stringify(await x.json());});out.textContent='Customers loaded';};
document.querySelector('#requests').onclick=async()=>{const r=await fetch('/api/admin/balance-requests',{headers:headers()}),d=await r.json();if(!r.ok){out.textContent=JSON.stringify(d);return;}document.querySelector('#requestsView').innerHTML=d.map(x=>`<section><b>${x.username}</b><p>${x.amount} coins · ${x.note||'No payment note'} · ${x.created_at}</p><button data-approve="${x.id}">Approve and credit</button></section>`).join('')||'کوئی Pending درخواست نہیں';document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=async()=>{const x=await fetch('/api/admin/balance-requests/'+b.dataset.approve+'/approve',{method:'POST',headers:headers()}),j=await x.json();out.textContent=JSON.stringify(j);document.querySelector('#requests').click();});out.textContent='Pending requests loaded';};
async function loadStakes(){const r=await fetch('/api/admin/stakes',{headers:headers()}),d=await r.json();if(!r.ok){out.textContent=JSON.stringify(d);return;}document.querySelector('#stakeList').innerHTML=d.stakes.map(x=>`<label style="display:inline-flex;align-items:center;background:#25324a;padding:8px;border-radius:8px;margin:4px"><input type="checkbox" class="stake-check" value="${x.amount}" ${x.enabled?'checked':''}> ${x.amount.toLocaleString()}</label>`).join('');}
document.querySelector('#addStake').onclick=()=>{const n=Number(document.querySelector('#newStake').value);if(!Number.isInteger(n)||n<1||n>100000){out.textContent='1 سے 100,000 تک درست رقم درج کریں';return;}const box=document.createElement('label');box.style='display:inline-flex;align-items:center;background:#25324a;padding:8px;border-radius:8px;margin:4px';box.innerHTML=`<input type="checkbox" class="stake-check" value="${n}" checked> ${n.toLocaleString()}`;document.querySelector('#stakeList').append(box);document.querySelector('#newStake').value='';};
document.querySelector('#saveStakes').onclick=async()=>{const stakes=[...document.querySelectorAll('.stake-check:checked')].map(x=>Number(x.value));const r=await fetch('/api/admin/stakes',{method:'PUT',headers:headers(),body:JSON.stringify({stakes})});out.textContent=JSON.stringify(await r.json());await loadStakes();};
loadStakes();
document.querySelector('#load').onclick=async()=>{const r=await fetch('/api/admin/games',{headers:headers()}),d=await r.json();if(!r.ok){out.textContent=JSON.stringify(d);return;}document.querySelector('#games').innerHTML=d.map(g=>`<section><b>${g.name}</b> #${g.id} <label><input type="checkbox" data-enabled="${g.id}" ${g.settings.enabled?'checked':''}> فعال</label><label><input type="checkbox" data-bonus="${g.id}" ${g.settings.bonusEnabled?'checked':''}> بونس</label><button data-save="${g.id}">محفوظ کریں</button></section>`).join('');document.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{const id=b.dataset.save,payload={enabled:document.querySelector('[data-enabled="'+id+'"]').checked,bonusEnabled:document.querySelector('[data-bonus="'+id+'"]').checked},x=await fetch('/api/admin/games/'+id,{method:'PATCH',headers:headers(),body:JSON.stringify(payload)});out.textContent=JSON.stringify(await x.json());});out.textContent='140 گیمز کی سیٹنگز لوڈ ہوگئیں۔';};
</script></body></html>
