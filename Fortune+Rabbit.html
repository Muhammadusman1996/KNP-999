.game-container{
    width:100%;
    max-width:420px;
    padding:16px;
    text-align:center;
    background:linear-gradient(180deg,rgba(27,0,48,.97),rgba(12,0,25,.98));
    backdrop-filter:blur(7px);
    border:5px solid #FFD700;
    border-radius:22px;
    box-shadow:0 0 30px #FFD70055;
}

h1{color:#FFD34D;font-size:29px;margin:10px 0 8px;text-shadow:0 2px 0 #8d2600,0 0 14px #ffb300;letter-spacing:1px;}

.subtitle{
    color:#e7c5ff;
    font-size:12px;
    margin-bottom:15px;
}

.reels-window{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    padding:15px 7px;
    background:#050008;
    border-radius:12px;
    position:relative;
    overflow:hidden;
    margin:15px 0 20px;
}

.reel{
    width:105px;
    height:180px;
    background:linear-gradient(#fff8e8,#f0d5ae);
    border:3px solid #FFD700;
    border-radius:9px;
    overflow:hidden;
    position:relative;
    flex:1;
}

.reel.middle{
    background:linear-gradient(#FFE135,#FF8C00);
}

.reel-strip{
    width:100%;
    display:flex;
    flex-direction:column;
    transform:translateY(0);
}

.symbol{
    height:60px;
    min-height:60px;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    border-bottom:1px solid #d6b77e;
}

.symbol svg,.symbol .animal-art{
    width:88px;
    height:58px;
    max-width:96%;
    object-fit:contain;
    display:block;
    border-radius:8px;
    filter:drop-shadow(0 4px 5px #0007);
}
.symbol .animal-art{mix-blend-mode:multiply}
.reel{border:3px solid #ffc928;box-shadow:inset 0 0 16px #9b4b08aa,0 0 13px #ffbf3988}
.reel.middle{background:linear-gradient(#ffe95c,#ff9c00);box-shadow:inset 0 0 20px #ffef8c,0 0 18px #ffb900aa}
.reels-window{border:1px solid #b64cff;background:linear-gradient(135deg,#10001e,#210039);padding:15px 7px}


.payline{
    position:absolute;
    top:50%;
    left:7px;
    right:7px;
    height:2px;
    background:#ff1616;
    box-shadow:0 0 7px red;
    z-index:5;
    pointer-events:none;
}

.dashboard{
    display:flex;
    justify-content:space-around;
    gap:8px;
    background:#0008;
    padding:13px 5px;
    border-radius:12px;
}

.stat-value{
    color:#FFD700;
    font-weight:bold;
    margin-top:7px;
    font-size:17px;
}

.controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:15px;
    margin-top:20px;
}

.btn{
    width:45px;
    height:45px;
    border-radius:50%;
    border:2px solid #FFD700;
    background:#444;
    color:white;
    font-size:25px;
    cursor:pointer;
}

.spin-btn{
    padding:15px 30px;
    border:3px solid white;
    border-radius:40px;
    background:linear-gradient(135deg,#00FF88,#00aa55);
    color:#003311;
    font-size:22px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 5px 15px #00ff8855;
}

button:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.message-box{
    margin-top:18px;
    min-height:30px;
    font-size:18px;
    color:#00FFCC;
    font-weight:bold;
}

.payout-info{
    margin-top:17px;
    padding:12px;
    border-radius:10px;
    background:#0006;
    color:#eee;
    font-size:13px;
    line-height:2;
}

.payout-title{
    color:#FFD700;
    font-weight:bold;
}

.reset-btn{
    margin-top:15px;
    background:transparent;
    border:1px solid #FFD700;
    color:#FFD700;
    padding:9px 15px;
    border-radius:8px;
    cursor:pointer;
}

@media(max-width:350px){
    .reel{height:150px}
    .symbol{height:50px;min-height:50px}
    .controls{gap:8px}
    .spin-btn{padding:12px 20px}
}

/* Reel symbol animation: motion blur, depth, and individual animal movement */
.reels-window.spinning .reel{perspective:500px;box-shadow:inset 0 0 22px #ffcf5b66,0 0 18px #ff8c00aa}
.reels-window.spinning .reel-strip{filter:blur(1.35px) saturate(1.35);will-change:transform}
.reels-window.spinning .symbol{background:linear-gradient(110deg,#fff8e8,#ffe5b8 45%,#fffaf0);transform:scale(.97);animation:reelFlash .22s linear infinite alternate}
.reels-window.spinning .symbol svg,.reels-window.spinning .symbol .animal-art{filter:drop-shadow(0 5px 4px #0006) saturate(1.2)}
@keyframes reelFlash{from{opacity:.82}to{opacity:1}}
.reels-window.spinning .animal-rabbit svg,.reels-window.spinning .animal-rabbit .animal-art{animation:rabbitSpinBounce .32s ease-in-out infinite alternate}
.reels-window.spinning .animal-rabbit svg ellipse:nth-of-type(1){transform-box:fill-box;transform-origin:50% 100%;animation:earFlop .24s ease-in-out infinite alternate}
.reels-window.spinning .animal-rabbit svg ellipse:nth-of-type(2){transform-box:fill-box;transform-origin:50% 100%;animation:earFlop .24s ease-in-out infinite alternate-reverse}
.reels-window.spinning .animal-swan svg,.reels-window.spinning .animal-swan .animal-art{animation:swanGlide .42s ease-in-out infinite alternate}
.reels-window.spinning .animal-swan svg path:nth-of-type(1){transform-box:fill-box;transform-origin:50% 50%;animation:wingFlutter .28s ease-in-out infinite alternate}
.reels-window.spinning .animal-cuckoo svg,.reels-window.spinning .animal-cuckoo .animal-art{animation:birdHop .3s ease-in-out infinite alternate}
.reels-window.spinning .animal-cuckoo svg path:nth-of-type(2){transform-box:fill-box;transform-origin:20% 50%;animation:wingFlutter .2s ease-in-out infinite alternate}
@keyframes rabbitSpinBounce{to{transform:translateY(-5px) rotate(3deg) scale(1.04)}}
@keyframes earFlop{to{rotate:10deg}}
@keyframes swanGlide{to{transform:translateY(-4px) rotate(-3deg)}}
@keyframes wingFlutter{to{transform:rotate(-9deg) scale(1.05)}}
@keyframes birdHop{to{transform:translateY(-4px) rotate(2deg)}}
.reel .symbol.landed{position:relative;z-index:2;animation:landPop .48s cubic-bezier(.2,1.5,.4,1) both}
.reel .symbol.landed svg,.reel .symbol.landed .animal-art{filter:drop-shadow(0 0 8px #ffd700) drop-shadow(0 4px 4px #0005)}
@keyframes landPop{0%{transform:scale(.72) rotate(-7deg);opacity:.65}65%{transform:scale(1.13) rotate(3deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.reels-window.winning .payline{height:4px;box-shadow:0 0 12px #fff,0 0 24px #ffdf44;animation:paylineGlow .35s ease-in-out infinite alternate}
@keyframes paylineGlow{to{opacity:.55;filter:brightness(1.8)}}

/* Premium animated Fortune Rabbit presentation */
.game-container{position:relative;overflow:hidden;isolation:isolate}
.game-container:before{content:"";position:absolute;inset:-50%;z-index:-2;background:conic-gradient(from 0deg,transparent,#ffd70018,transparent,#e98aff18,transparent);animation:ambientRotate 18s linear infinite}
@keyframes ambientRotate{to{transform:rotate(360deg)}}
.top-lights{height:9px;display:flex;justify-content:space-around;margin:-7px 0 8px}
.top-lights i{width:7px;height:7px;border-radius:50%;background:#ffe98a;box-shadow:0 0 12px #ffda46;animation:bulb 1.2s ease-in-out infinite alternate}
.top-lights i:nth-child(2n){animation-delay:.35s;background:#ff91d5;box-shadow:0 0 12px #ff91d5}
@keyframes bulb{from{opacity:.35;transform:scale(.7)}to{opacity:1;transform:scale(1.25)}}
.mascot-scene{height:150px;position:relative;margin:-2px auto 6px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:0;background:radial-gradient(ellipse at 50% 75%,#a34be633,transparent 66%)}
.mascot-scene:after{content:"";position:absolute;bottom:15px;width:150px;height:12px;border-radius:50%;background:#ffcf4933;filter:blur(8px)}
.halo{position:absolute;width:145px;height:145px;border:2px solid #ffdc6a88;border-radius:50%;box-shadow:0 0 24px #ffcf5a55,inset 0 0 24px #ffcf5a33;animation:haloPulse 3s ease-in-out infinite}
@keyframes haloPulse{50%{transform:scale(1.08);opacity:.55}}
.hero-rabbit{position:relative;z-index:2;width:190px;height:145px;object-fit:contain;filter:drop-shadow(0 7px 9px #0008);animation:rabbitFloat 1.35s ease-in-out infinite}
@keyframes rabbitFloat{0%,100%{transform:translateY(7px) rotate(-2deg) scale(.98)}50%{transform:translateY(-13px) rotate(2deg) scale(1.04)}}
.spark{position:absolute;color:#ffe58a;font-size:22px;text-shadow:0 0 12px #ffd34c;animation:sparkle 2.2s ease-in-out infinite}
.spark-a{left:15%;top:25%}.spark-b{right:17%;top:32%;animation-delay:.7s}.spark-c{right:25%;bottom:17%;animation-delay:1.2s}
@keyframes sparkle{0%,100%{opacity:.2;transform:scale(.65) rotate(0)}50%{opacity:1;transform:scale(1.25) rotate(35deg)}}
.mascot-caption{position:absolute;bottom:7px;z-index:3;color:#ffe59a;font-size:9px;letter-spacing:2px;font-weight:bold;text-shadow:0 0 8px #ffbd39}
.reels-window{box-shadow:inset 0 0 18px #ffcb3630,0 0 16px #a94aff2a}
.reel{box-shadow:inset 0 0 12px #7c4b1944}
.reel-strip{will-change:transform}
.symbol svg{transition:filter .2s}
.message-box.win-glow{color:#fff2a3;text-shadow:0 0 8px #ffd700,0 0 20px #ff8c00;animation:winPulse .65s ease-in-out infinite alternate}
@keyframes winPulse{to{transform:scale(1.07);filter:brightness(1.35)}}
.payout-info{border:1px solid #ffd70033}
@media(prefers-reduced-motion:reduce){.game-container:before,.top-lights i,.halo,.hero-rabbit,.spark,.message-box.win-glow{animation:none!important}}
</style>
</head>

const symbolsList = ["rabbit","swan","cuckoo"];

// Winning-spin payout distribution for this local demo:
 // 85% normal winning tier (1.10x–3.00x), 15% high tier (3.01x–50.00x).
 // These percentages apply only after a winning combination is selected.
const WIN_TIERS = { normalChance:0.85, normalMin:1.10, normalMax:3.00,
                    highMin:3.01, highMax:50.00 };

// =====================================
// GAME VARIABLES
// =====================================

let balance = CONFIG.startingBalance;
let currentBet = 10;
let isSpinning = false;

const strips = [
    document.getElementById("strip1"),
    document.getElementById("strip2"),
    document.getElementById("strip3")
];

const balanceDisplay = document.getElementById("balanceDisplay");
const betDisplay = document.getElementById("betDisplay");
const messageBox = document.getElementById("messageBox");
const spinBtn = document.getElementById("spinBtn");
const reelsWindow = document.getElementById("reelsWindow");

const minusBtn = document.getElementById("minusBtn");
const plusBtn = document.getElementById("plusBtn");
const resetBtn = document.getElementById("resetBtn");

// =====================================
// SYMBOL DISPLAY
// =====================================

function symbolMarkup(symbol) {
    return animalSVG[symbol];
}

function addSymbol(strip,symbol) {

    const div = document.createElement("div");

    div.className = "symbol animal-" + symbol;
    div.innerHTML = symbolMarkup(symbol);

    strip.appendChild(div);
}

// =====================================
// DISPLAY UPDATE
// =====================================

function updateDisplay() {

    balanceDisplay.textContent =
        "Rs " + balance.toFixed(2);

    betDisplay.textContent =
        "Rs " + currentBet.toFixed(2);

}

// =====================================
// INITIAL REELS
// =====================================

function showInitialReels() {

    strips.forEach(strip => {

        strip.innerHTML = "";

        for(let i=0;i<3;i++) {

            const symbol =
                symbolsList[Math.floor(Math.random()*symbolsList.length)];

            addSymbol(strip,symbol);
        }

    });

}

// =====================================
// BET SYSTEM
// =====================================

function changeBet(amount) {

    if(isSpinning) return;

    const newBet = currentBet + amount;

    if(
        newBet >= CONFIG.minimumBet &&
        newBet <= CONFIG.maximumBet
    ) {

        currentBet = newBet;
        updateDisplay();

    }

}

minusBtn.addEventListener("click",()=>{
    changeBet(-CONFIG.betStep);
});

plusBtn.addEventListener("click",()=>{
    changeBet(CONFIG.betStep);
});

// =====================================
// RANDOM ANIMAL
// =====================================

function randomSymbol() {

    return symbolsList[
        Math.floor(Math.random()*symbolsList.length)
    ];

}

// =====================================
// REEL ANIMATION
// =====================================

function createAnimatedStrip(strip,finalSymbol,duration) {

    return new Promise(resolve => {

        strip.style.transition = "none";
        strip.style.transform = "translateY(0px)";
        strip.innerHTML = "";

        const finalIndex = 8;

        // Create scrolling symbols
        for(let i=0;i<12;i++) {

            const symbol = i === finalIndex
                ? finalSymbol
                : randomSymbol();

            addSymbol(strip,symbol);
        }

        // Prepare animation
        void strip.offsetHeight;

        // Center final symbol on payline
        const targetPosition = (finalIndex * 60) - 60;

        requestAnimationFrame(()=>{

            strip.style.transition =
                `transform ${duration}ms cubic-bezier(.12,.75,.2,1)`;

            strip.style.transform =
                `translateY(-${targetPosition}px)`;

        });

        setTimeout(resolve,duration + 100);

    });

}

// =====================================
// WINNING SYSTEM
// =====================================

function calculateWin(results,bet) {
    const [a,b,c] = results;
    if(a !== b || b !== c) return 0;

    const roll=Math.random();
    const multiplier = roll < WIN_TIERS.normalChance
      ? WIN_TIERS.normalMin + Math.random()*(WIN_TIERS.normalMax-WIN_TIERS.normalMin)
      : WIN_TIERS.highMin + Math.random()*(WIN_TIERS.highMax-WIN_TIERS.highMin);
    return Number((bet*multiplier).toFixed(2));
}

// =====================================
// LOCAL RESULT
// =====================================

function generateLocalResult() {

    return [
        randomSymbol(),
        randomSymbol(),
        randomSymbol()
    ];

}

// =====================================
// SERVER API ADAPTER
// =====================================

async function getServerResult(bet) {

    const response = await fetch(CONFIG.API_URL,{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            method:"spin",
            bet:bet
        })

    });

    if(!response.ok) {
        throw new Error("Server connection failed");
    }

    const data = await response.json();

    if(
        !Array.isArray(data.reels) ||
        data.reels.length !== 3 ||
        !data.reels.every(s=>symbolsList.includes(s)) ||
        !Number.isFinite(data.payout) ||
        !Number.isFinite(data.balance) ||
        data.payout < 0 ||
        data.balance < 0
    ) {
        throw new Error("Invalid server response");
    }

    return data;

}

// =====================================
// SPIN GAME
// =====================================

async function playSpin() {

    if(isSpinning) return;

    if(!CONFIG.USE_SERVER_API && balance < currentBet) {

        messageBox.textContent = "Insufficient Balance!";
        return;

    }

    isSpinning = true;

    spinBtn.disabled = true;
    plusBtn.disabled = true;
    minusBtn.disabled = true;
    resetBtn.disabled = true;

    const bet = currentBet;

    messageBox.classList.remove("win-glow");
    reelsWindow.classList.remove("winning");
    reelsWindow.classList.add("spinning");
    messageBox.textContent = "🎰 Spinning...";

    let localBetDeducted = false;

    try {

        let results;
        let winAmount;

        if(CONFIG.USE_SERVER_API) {

            const serverData = await getServerResult(bet);

            results = serverData.reels;
            winAmount = serverData.payout;
            balance = serverData.balance;

        } else {

            balance -= bet;
            localBetDeducted = true;

            updateDisplay();

            results = generateLocalResult();

            winAmount = calculateWin(results,bet);

        }

        await Promise.all([

            createAnimatedStrip(strips[0],results[0],1300),

            createAnimatedStrip(strips[1],results[1],1700),

            createAnimatedStrip(strips[2],results[2],2100)

        ]);

        reelsWindow.classList.remove("spinning");
        // Highlight and pop the three pictures that have landed on the payline.
        strips.forEach(strip=>{
            const centerSymbol=strip.children[9];
            if(centerSymbol) centerSymbol.classList.add("landed");
        });
        if(winAmount > 0) reelsWindow.classList.add("winning");
        setTimeout(()=>{
            strips.forEach(strip=>{
                Array.from(strip.children).forEach(el=>el.classList.remove("landed"));
            });
            reelsWindow.classList.remove("winning");
        },1250);

        if(!CONFIG.USE_SERVER_API && winAmount > 0) {
            balance += winAmount;
        }

        updateDisplay();

        messageBox.classList.remove("win-glow");
        if(winAmount > 0) {
            const winMult=(winAmount/bet).toFixed(2);
            messageBox.textContent = "🎉 WIN " + winMult + "x! Rs " + winAmount.toFixed(2) + " 🎉";
            messageBox.classList.add("win-glow");
        } else {
            messageBox.textContent = "No Win! Try Again.";
        }

    } catch(error) {

        reelsWindow.classList.remove("spinning","winning");
        console.error(error);

        if(localBetDeducted) {
            balance += bet;
            updateDisplay();
        }

        messageBox.textContent =
            "Game Error: " + error.message;

    } finally {

        isSpinning = false;

        spinBtn.disabled = false;
        plusBtn.disabled = false;
        minusBtn.disabled = false;
        resetBtn.disabled = false;

    }

}

// =====================================
// RESET DEMO BALANCE
// =====================================

resetBtn.addEventListener("click",()=>{

    if(isSpinning) return;

    if(CONFIG.USE_SERVER_API) {

        messageBox.textContent =
            "Reset balance through server.";

        return;

    }

    balance = CONFIG.startingBalance;
    currentBet = 10;

    updateDisplay();

    messageBox.textContent = "Demo Balance Reset!";

});

// =====================================
// EVENTS
// =====================================

spinBtn.addEventListener("click",playSpin);

// =====================================
// START GAME
// =====================================

showInitialReels();
updateDisplay();

</script>

</body>
</html>
