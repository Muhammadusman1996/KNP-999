
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#120024">
<title>Fortune Rabbit - KNP 999</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:12px;
    font-family:Arial,sans-serif;
    color:white;
    background:radial-gradient(circle,#3A006D,#0A0012);
}

.game-container{
    width:100%;
    max-width:420px;
    padding:16px;
    text-align:center;
    background:#120024;
    border:5px solid #FFD700;
    border-radius:22px;
    box-shadow:0 0 30px #FFD70055;
}

h1{
    color:#FFD700;
    font-size:27px;
    margin:10px 0 20px;
}

.subtitle{
    color:#e7c5ff;
    font-size:12px;
    margin-bottom:15px;
}

.reels-window{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    padding:15px 7px;
    background:#050008;
    border-radius:12px;
    position:relative;
    overflow:hidden;
    margin:15px 0 20px;
}

.reel{
    width:105px;
    height:180px;
    background:linear-gradient(#fff8e8,#f0d5ae);
    border:3px solid #FFD700;
    border-radius:9px;
    overflow:hidden;
    position:relative;
    flex:1;
}

.reel.middle{
    background:linear-gradient(#FFE135,#FF8C00);
}

.reel-strip{
    width:100%;
    display:flex;
    flex-direction:column;
    transform:translateY(0);
}

.symbol{
    height:60px;
    min-height:60px;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    border-bottom:1px solid #d6b77e;
}

.symbol svg{
    width:53px;
    height:53px;
    display:block;
    filter:drop-shadow(0 3px 3px #0004);
}

.payline{
    position:absolute;
    top:50%;
    left:7px;
    right:7px;
    height:2px;
    background:#ff1616;
    box-shadow:0 0 7px red;
    z-index:5;
    pointer-events:none;
}

.dashboard{
    display:flex;
    justify-content:space-around;
    gap:8px;
    background:#0008;
    padding:13px 5px;
    border-radius:12px;
}

.stat-value{
    color:#FFD700;
    font-weight:bold;
    margin-top:7px;
    font-size:17px;
}

.controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:15px;
    margin-top:20px;
}

.btn{
    width:45px;
    height:45px;
    border-radius:50%;
    border:2px solid #FFD700;
    background:#444;
    color:white;
    font-size:25px;
    cursor:pointer;
}

.spin-btn{
    padding:15px 30px;
    border:3px solid white;
    border-radius:40px;
    background:linear-gradient(135deg,#00FF88,#00aa55);
    color:#003311;
    font-size:22px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 5px 15px #00ff8855;
}

button:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.message-box{
    margin-top:18px;
    min-height:30px;
    font-size:18px;
    color:#00FFCC;
    font-weight:bold;
}

.payout-info{
    margin-top:17px;
    padding:12px;
    border-radius:10px;
    background:#0006;
    color:#eee;
    font-size:13px;
    line-height:2;
}

.payout-title{
    color:#FFD700;
    font-weight:bold;
}

.reset-btn{
    margin-top:15px;
    background:transparent;
    border:1px solid #FFD700;
    color:#FFD700;
    padding:9px 15px;
    border-radius:8px;
    cursor:pointer;
}

@media(max-width:350px){
    .reel{height:150px}
    .symbol{height:50px;min-height:50px}
    .controls{gap:8px}
    .spin-btn{padding:12px 20px}
}
</style>
</head>

<body>

<div class="game-container">

<h1>🐰 FORTUNE RABBIT 🐰</h1>
<div class="subtitle">RABBIT • SWAN • CUCKOO</div>

<div class="reels-window">

    <div class="reel">
        <div class="reel-strip" id="strip1"></div>
    </div>

    <div class="reel middle">
        <div class="reel-strip" id="strip2"></div>
    </div>

    <div class="reel">
        <div class="reel-strip" id="strip3"></div>
    </div>

    <div class="payline"></div>

</div>

<div class="dashboard">

    <div>
        <div>Balance</div>
        <div class="stat-value" id="balanceDisplay">Rs 1000.00</div>
    </div>

    <div>
        <div>Current Bet</div>
        <div class="stat-value" id="betDisplay">Rs 10.00</div>
    </div>

</div>

<div class="controls">

    <button class="btn" id="minusBtn">-</button>

    <button class="spin-btn" id="spinBtn">SPIN</button>

    <button class="btn" id="plusBtn">+</button>

</div>

<div class="message-box" id="messageBox">
    Tap Spin to Play!
</div>

<div class="payout-info">
    <div class="payout-title">WINNING PAYOUTS</div>
    🐰 Rabbit — 10x<br>
    🦢 Swan — 5x<br>
    🐦 Cuckoo — 3x<br>
    <small>Three matching animals on the center line win.</small>
</div>

<button class="reset-btn" id="resetBtn">
    Reset Demo Balance
</button>

</div>

<script>

// =====================================
// GAME CONFIGURATION
// =====================================

const CONFIG = {
    startingBalance:1000,
    minimumBet:5,
    maximumBet:100,
    betStep:5,

    // Demo mode. Real API requires server integration.
    USE_SERVER_API:false,
    API_URL:"YOUR_SERVER_API_URL"
};

// =====================================
// ANIMAL SVG IMAGES
// =====================================

const animalSVG = {

rabbit: `
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="rabbitColor" x2="0" y2="1">
<stop stop-color="#fff9ec"/>
<stop offset="1" stop-color="#d9bba0"/>
</linearGradient>
</defs>
<ellipse cx="38" cy="28" rx="11" ry="28" fill="#eac9bb" transform="rotate(-12 38 28)"/>
<ellipse cx="62" cy="28" rx="11" ry="28" fill="#eac9bb" transform="rotate(12 62 28)"/>
<ellipse cx="38" cy="28" rx="5" ry="19" fill="#ed9cae"/>
<ellipse cx="62" cy="28" rx="5" ry="19" fill="#ed9cae"/>
<circle cx="50" cy="59" r="33" fill="url(#rabbitColor)"/>
<circle cx="39" cy="54" r="4" fill="#24152b"/>
<circle cx="61" cy="54" r="4" fill="#24152b"/>
<ellipse cx="50" cy="66" rx="6" ry="4" fill="#f28b9b"/>
<path d="M44 74 Q50 82 56 74" fill="none" stroke="#673d42" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="27" cy="67" r="6" fill="#f6b4b9" opacity=".6"/>
<circle cx="73" cy="67" r="6" fill="#f6b4b9" opacity=".6"/>
</svg>`,

swan: `
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="swanColor" x2="0" y2="1">
<stop stop-color="#ffffff"/>
<stop offset="1" stop-color="#c9dcf4"/>
</linearGradient>
</defs>
<path d="M12 76 Q29 43 62 63 Q78 73 92 65 Q79 96 39 87Z" fill="url(#swanColor)" stroke="#b9cbe2" stroke-width="2"/>
<path d="M45 72 Q24 48 44 30 Q62 16 51 9 Q75 16 64 40 Q56 54 73 65" fill="none" stroke="url(#swanColor)" stroke-width="15" stroke-linecap="round"/>
<circle cx="58" cy="16" r="3.5" fill="#222"/>
<path d="M64 20 L88 25 L65 30Z" fill="#ff9e19"/>
<path d="M28 77 Q48 65 75 79" fill="none" stroke="#a6b9d3" stroke-width="2"/>
<path d="M36 86 L31 94 M61 87 L66 94" stroke="#e7a32e" stroke-width="3"/>
</svg>`,

cuckoo: `
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="birdColor" x2="0" y2="1">
<stop stop-color="#bd916b"/>
<stop offset="1" stop-color="#71432f"/>
</linearGradient>
</defs>
<ellipse cx="51" cy="61" rx="30" ry="27" fill="url(#birdColor)"/>
<circle cx="50" cy="33" r="22" fill="#bd916b"/>
<path d="M34 18 L39 5 L49 20 L59 5 L67 22" fill="#80523b"/>
<circle cx="42" cy="32" r="5" fill="white"/>
<circle cx="59" cy="32" r="5" fill="white"/>
<circle cx="42" cy="32" r="2.5" fill="#222"/>
<circle cx="59" cy="32" r="2.5" fill="#222"/>
<path d="M45 41 L56 41 L51 49Z" fill="#ffae24"/>
<path d="M25 57 Q7 37 13 31 Q37 36 44 58" fill="#e5b783"/>
<path d="M60 57 Q78 38 87 43 Q84 65 65 72" fill="#a77b53"/>
<path d="M38 83 L35 94 M62 83 L66 94" stroke="#ffae24" stroke-width="4"/>
</svg>`

};

const symbolsList = ["rabbit","swan","cuckoo"];

const payouts = {
    rabbit:10,
    swan:5,
    cuckoo:3
};

// =====================================
// GAME VARIABLES
// =====================================

let balance = CONFIG.startingBalance;
let currentBet = 10;
let isSpinning = false;

const strips = [
    document.getElementById("strip1"),
    document.getElementById("strip2"),
    document.getElementById("strip3")
];

const balanceDisplay = document.getElementById("balanceDisplay");
const betDisplay = document.getElementById("betDisplay");
const messageBox = document.getElementById("messageBox");
const spinBtn = document.getElementById("spinBtn");

const minusBtn = document.getElementById("minusBtn");
const plusBtn = document.getElementById("plusBtn");
const resetBtn = document.getElementById("resetBtn");

// =====================================
// SYMBOL DISPLAY
// =====================================

function symbolMarkup(symbol) {
    return animalSVG[symbol];
}

function addSymbol(strip,symbol) {

    const div = document.createElement("div");

    div.className = "symbol";
    div.innerHTML = symbolMarkup(symbol);

    strip.appendChild(div);
}

// =====================================
// DISPLAY UPDATE
// =====================================

function updateDisplay() {

    balanceDisplay.textContent =
        "Rs " + balance.toFixed(2);

    betDisplay.textContent =
        "Rs " + currentBet.toFixed(2);

}

// =====================================
// INITIAL REELS
// =====================================

function showInitialReels() {

    strips.forEach(strip => {

        strip.innerHTML = "";

        for(let i=0;i<3;i++) {

            const symbol =
                symbolsList[Math.floor(Math.random()*symbolsList.length)];

            addSymbol(strip,symbol);
        }

    });

}

// =====================================
// BET SYSTEM
// =====================================

function changeBet(amount) {

    if(isSpinning) return;

    const newBet = currentBet + amount;

    if(
        newBet >= CONFIG.minimumBet &&
        newBet <= CONFIG.maximumBet
    ) {

        currentBet = newBet;
        updateDisplay();

    }

}

minusBtn.addEventListener("click",()=>{
    changeBet(-CONFIG.betStep);
});

plusBtn.addEventListener("click",()=>{
    changeBet(CONFIG.betStep);
});

// =====================================
// RANDOM ANIMAL
// =====================================

function randomSymbol() {

    return symbolsList[
        Math.floor(Math.random()*symbolsList.length)
    ];

}

// =====================================
// REEL ANIMATION
// =====================================

function createAnimatedStrip(strip,finalSymbol,duration) {

    return new Promise(resolve => {

        strip.style.transition = "none";
        strip.style.transform = "translateY(0px)";
        strip.innerHTML = "";

        const finalIndex = 8;

        // Create scrolling symbols
        for(let i=0;i<12;i++) {

            const symbol = i === finalIndex
                ? finalSymbol
                : randomSymbol();

            addSymbol(strip,symbol);
        }

        // Prepare animation
        void strip.offsetHeight;

        // Center final symbol on payline
        const targetPosition = (finalIndex * 60) - 60;

        requestAnimationFrame(()=>{

            strip.style.transition =
                `transform ${duration}ms cubic-bezier(.12,.75,.2,1)`;

            strip.style.transform =
                `translateY(-${targetPosition}px)`;

        });

        setTimeout(resolve,duration + 100);

    });

}

// =====================================
// WINNING SYSTEM
// =====================================

function calculateWin(results,bet) {

    const [a,b,c] = results;

    if(a === b && b === c) {

        return bet * payouts[a];

    }

    return 0;

}

// =====================================
// LOCAL RESULT
// =====================================

function generateLocalResult() {

    return [
        randomSymbol(),
        randomSymbol(),
        randomSymbol()
    ];

}

// =====================================
// SERVER API ADAPTER
// =====================================

async function getServerResult(bet) {

    const response = await fetch(CONFIG.API_URL,{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            method:"spin",
            bet:bet
        })

    });

    if(!response.ok) {
        throw new Error("Server connection failed");
    }

    const data = await response.json();

    if(
        !Array.isArray(data.reels) ||
        data.reels.length !== 3 ||
        !data.reels.every(s=>symbolsList.includes(s)) ||
        !Number.isFinite(data.payout) ||
        !Number.isFinite(data.balance) ||
        data.payout < 0 ||
        data.balance < 0
    ) {
        throw new Error("Invalid server response");
    }

    return data;

}

// =====================================
// SPIN GAME
// =====================================

async function playSpin() {

    if(isSpinning) return;

    if(!CONFIG.USE_SERVER_API && balance < currentBet) {

        messageBox.textContent = "Insufficient Balance!";
        return;

    }

    isSpinning = true;

    spinBtn.disabled = true;
    plusBtn.disabled = true;
    minusBtn.disabled = true;
    resetBtn.disabled = true;

    const bet = currentBet;

    messageBox.textContent = "🎰 Spinning...";

    let localBetDeducted = false;

    try {

        let results;
        let winAmount;

        if(CONFIG.USE_SERVER_API) {

            const serverData = await getServerResult(bet);

            results = serverData.reels;
            winAmount = serverData.payout;
            balance = serverData.balance;

        } else {

            balance -= bet;
            localBetDeducted = true;

            updateDisplay();

            results = generateLocalResult();

            winAmount = calculateWin(results,bet);

        }

        await Promise.all([

            createAnimatedStrip(strips[0],results[0],1300),

            createAnimatedStrip(strips[1],results[1],1700),

            createAnimatedStrip(strips[2],results[2],2100)

        ]);

        if(!CONFIG.USE_SERVER_API && winAmount > 0) {

            balance += winAmount;

        }

        updateDisplay();

        if(winAmount > 0) {

            messageBox.textContent =
                "🎉 WIN! Rs " + winAmount.toFixed(2) + " 🎉";

        } else {

            messageBox.textContent =
                "No Win! Try Again.";

        }

    } catch(error) {

        console.error(error);

        if(localBetDeducted) {
            balance += bet;
            updateDisplay();
        }

        messageBox.textContent =
            "Game Error: " + error.message;

    } finally {

        isSpinning = false;

        spinBtn.disabled = false;
        plusBtn.disabled = false;
        minusBtn.disabled = false;
        resetBtn.disabled = false;

    }

}

// =====================================
// RESET DEMO BALANCE
// =====================================

resetBtn.addEventListener("click",()=>{

    if(isSpinning) return;

    if(CONFIG.USE_SERVER_API) {

        messageBox.textContent =
            "Reset balance through server.";

        return;

    }

    balance = CONFIG.startingBalance;
    currentBet = 10;

    updateDisplay();

    messageBox.textContent = "Demo Balance Reset!";

});

// =====================================
// EVENTS
// =====================================

spinBtn.addEventListener("click",playSpin);

// =====================================
// START GAME
// =====================================

showInitialReels();
updateDisplay();

</script>

</body>
</html>
