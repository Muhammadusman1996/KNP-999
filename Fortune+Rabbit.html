
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fortune Rabbit Enhanced</title>

<style>
:root {
    --gold: #FFD700;
}

* {
    box-sizing: border-box;
}

body {
    background: radial-gradient(circle, #3A006D, #0A0012);
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 12px;
}

.game-container {
    width: 100%;
    max-width: 400px;
    background: #120024;
    border: 5px solid var(--gold);
    border-radius: 20px;
    padding: 15px;
    text-align: center;
    box-shadow: 0 0 30px rgba(255,215,0,.4);
}

h1 {
    color: var(--gold);
    font-size: 25px;
}

.reels-window {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    background: #000;
    padding: 15px 8px;
    border-radius: 10px;
    margin: 20px 0;
    position: relative;
    overflow: hidden;
}

.reel {
    width: 100px;
    height: 180px;
    background: white;
    border-radius: 7px;
    overflow: hidden;
    position: relative;
    flex-shrink: 1;
}

.middle-reel {
    background: linear-gradient(#FFE135, #FF8C00);
}

.reel-strip {
    display: flex;
    flex-direction: column;
    width: 100%;
    transform: translateY(0);
}

.symbol {
    height: 60px;
    min-height: 60px;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 32px;
    color: #600000;
    border-bottom: 1px solid #ddd;
}

.middle-reel .symbol {
    font-size: 25px;
    font-weight: bold;
}

.payline {
    position: absolute;
    top: 50%;
    left: 5px;
    right: 5px;
    border-top: 2px solid rgba(255,215,0,.9);
    pointer-events: none;
    z-index: 2;
}

.dashboard {
    display: flex;
    justify-content: space-around;
    gap: 8px;
    background: rgba(0,0,0,.5);
    padding: 12px 5px;
    border-radius: 10px;
    margin-bottom: 18px;
}

.stat-value {
    font-weight: bold;
    color: var(--gold);
    margin-top: 5px;
}

.controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
}

.btn {
    background: #444;
    color: white;
    border: 2px solid var(--gold);
    width: 45px;
    height: 45px;
    border-radius: 50%;
    font-size: 25px;
    cursor: pointer;
}

.spin-btn {
    background: linear-gradient(135deg,#00FF88,#00aa55);
    color: #003311;
    border: 3px solid white;
    padding: 15px 30px;
    font-size: 22px;
    font-weight: bold;
    border-radius: 40px;
    cursor: pointer;
}

button:disabled {
    opacity: .45;
    cursor: not-allowed;
}

.message-box {
    margin-top: 18px;
    font-size: 18px;
    color: #00FFCC;
    min-height: 28px;
}

.payout-info {
    font-size: 12px;
    color: #ddd;
    line-height: 1.8;
    margin-top: 18px;
}

.reset-btn {
    margin-top: 12px;
    background: transparent;
    color: var(--gold);
    border: 1px solid var(--gold);
    padding: 8px 15px;
    border-radius: 8px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="game-container">

    <h1>🐰 FORTUNE RABBIT 🐰</h1>

    <div class="reels-window">

        <div class="reel outer-reel">
            <div class="reel-strip" id="strip1"></div>
        </div>

        <div class="reel middle-reel">
            <div class="reel-strip" id="strip2"></div>
        </div>

        <div class="reel outer-reel">
            <div class="reel-strip" id="strip3"></div>
        </div>

        <div class="payline"></div>

    </div>

    <div class="dashboard">

        <div>
            <div>Balance</div>
            <div class="stat-value" id="balanceDisplay">
                Rs 1000.00
            </div>
        </div>

        <div>
            <div>Current Bet</div>
            <div class="stat-value" id="betDisplay">
                Rs 10.00
            </div>
        </div>

    </div>

    <div class="controls">

        <button class="btn" id="minusBtn">-</button>

        <button class="spin-btn" id="spinBtn">
            SPIN
        </button>

        <button class="btn" id="plusBtn">+</button>

    </div>

    <div class="message-box" id="messageBox">
        Tap Spin to Play!
    </div>

    <div class="payout-info">
        🐰 Rabbit: 10x<br>
        🪙 Coin: 5x<br>
        🧧 Envelope: 4x<br>
        🥕 Carrot: 3x<br>
        💰 Money: 2x<br>
        🌟 Star: 2x<br>
        <br>
        Matching symbols must appear on the center line.
    </div>

    <button class="reset-btn" id="resetBtn">
        Reset Demo Balance
    </button>

</div>

<script>

// ==================================
// GAME CONFIGURATION
// ==================================

const CONFIG = {
    startingBalance: 1000,
    minimumBet: 5,
    maximumBet: 100,
    betStep: 5,

    // Set true after connecting your real server API.
    USE_SERVER_API: false,

    API_URL: "YOUR_SERVER_API_URL"
};

// ==================================
// SYMBOLS
// ==================================

const symbolsList = [
    '🐰',
    '🪙',
    '🧧',
    '🥕',
    '💰',
    '🌟'
];

// Payout multipliers

const payouts = {
    '🐰': 10,
    '🪙': 5,
    '🧧': 4,
    '🥕': 3,
    '💰': 2,
    '🌟': 2
};

// ==================================
// GAME VARIABLES
// ==================================

let balance = CONFIG.startingBalance;
let currentBet = 10;
let isSpinning = false;

// ==================================
// ELEMENTS
// ==================================

const balanceDisplay =
    document.getElementById("balanceDisplay");

const betDisplay =
    document.getElementById("betDisplay");

const messageBox =
    document.getElementById("messageBox");

const spinBtn =
    document.getElementById("spinBtn");

const strips = [
    document.getElementById("strip1"),
    document.getElementById("strip2"),
    document.getElementById("strip3")
];

// ==================================
// DISPLAY UPDATE
// ==================================

function updateDisplay() {

    balanceDisplay.textContent =
        "Rs " + balance.toFixed(2);

    betDisplay.textContent =
        "Rs " + currentBet.toFixed(2);

}

// ==================================
// INITIAL REELS
// ==================================

function showInitialReels() {

    strips.forEach((strip) => {

        strip.innerHTML = "";

        for (let i = 0; i < 3; i++) {

            const symbol =
                symbolsList[
                    Math.floor(Math.random() * symbolsList.length)
                ];

            const div = document.createElement("div");

            div.className = "symbol";
            div.textContent = symbol;

            strip.appendChild(div);
        }

    });

}

// ==================================
// BET CONTROL
// ==================================

function changeBet(amount) {

    if (isSpinning) return;

    const newBet = currentBet + amount;

    if (
        newBet >= CONFIG.minimumBet &&
        newBet <= CONFIG.maximumBet
    ) {

        currentBet = newBet;
        updateDisplay();

    }

}

document.getElementById("minusBtn")
    .addEventListener("click", () => changeBet(-CONFIG.betStep));

document.getElementById("plusBtn")
    .addEventListener("click", () => changeBet(CONFIG.betStep));

// ==================================
// RANDOM SYMBOL
// ==================================

function randomSymbol() {

    return symbolsList[
        Math.floor(Math.random() * symbolsList.length)
    ];

}

// ==================================
// CREATE REEL STRIP
// ==================================

function createAnimatedStrip(strip, finalSymbol, duration) {

    return new Promise((resolve) => {

        strip.style.transition = "none";
        strip.style.transform = "translateY(0px)";

        strip.innerHTML = "";

        // Create scrolling symbols

        const symbols = [];

        for (let i = 0; i < 12; i++) {
            symbols.push(randomSymbol());
        }

        // Fixed final position

        const finalIndex = 8;

        symbols[finalIndex] = finalSymbol;

        // Add symbols to reel

        symbols.forEach((symbol) => {

            const div = document.createElement("div");

            div.className = "symbol";
            div.textContent = symbol;

            strip.appendChild(div);

        });

        // Force browser layout update

        void strip.offsetHeight;

        // Start animation

        strip.style.transition =
            `transform ${duration}ms cubic-bezier(.15,.75,.25,1)`;

        strip.style.transform =
            `translateY(-${finalIndex * 60}px)`;

        setTimeout(resolve, duration + 50);

    });

}

// ==================================
// WINNING LOGIC
// ==================================

function calculateWin(results, bet) {

    const [symbol1, symbol2, symbol3] = results;

    // All three symbols must match

    if (
        symbol1 === symbol2 &&
        symbol2 === symbol3
    ) {

        return bet * payouts[symbol1];

    }

    // No winning combination

    return 0;

}

// ==================================
// LOCAL GAME RESULT
// ==================================

function generateLocalResult() {

    return [
        randomSymbol(),
        randomSymbol(),
        randomSymbol()
    ];

}

// ==================================
// SERVER API ADAPTER
// ==================================

async function getServerResult(bet) {

    const response = await fetch(CONFIG.API_URL, {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            method: "spin",
            bet: bet
        })

    });

    if (!response.ok) {
        throw new Error("Server connection failed");
    }

    const data = await response.json();

    // Expected server response:
    // {
    //   "reels": ["🐰", "🐰", "🐰"],
    //   "payout": 100,
    //   "balance": 1090
    // }

    if (
        !Array.isArray(data.reels) ||
        data.reels.length !== 3 ||
        !data.reels.every(s => symbolsList.includes(s)) ||
        !Number.isFinite(data.payout) ||
        !Number.isFinite(data.balance) ||
        data.payout < 0 ||
        data.balance < 0
    ) {
        throw new Error("Invalid server response");
    }

    return data;

}

// ==================================
// SPIN GAME
// ==================================

async function playSpin() {

    if (isSpinning) return;

    if (!CONFIG.USE_SERVER_API && balance < currentBet) {

        messageBox.textContent =
            "Insufficient Balance!";

        return;

    }

    isSpinning = true;

    spinBtn.disabled = true;

    document.getElementById("plusBtn").disabled = true;
    document.getElementById("minusBtn").disabled = true;

    const bet = currentBet;

    messageBox.textContent = "🎰 Spinning...";

    try {

        let results;
        let winAmount;

        if (CONFIG.USE_SERVER_API) {

            // Server controls balance and outcome.

            const serverData = await getServerResult(bet);

            results = serverData.reels;
            winAmount = serverData.payout;

            if (serverData.balance < 0) {
                throw new Error("Invalid balance");
            }

            balance = serverData.balance;

        } else {

            // Local demo mode.

            balance -= bet;

            updateDisplay();

            results = generateLocalResult();

            winAmount = calculateWin(results, bet);

        }

        // Animate all reels

        await Promise.all([

            createAnimatedStrip(strips[0], results[0], 1100),

            createAnimatedStrip(strips[1], results[1], 1400),

            createAnimatedStrip(strips[2], results[2], 1700)

        ]);

        // Apply local winnings

        if (!CONFIG.USE_SERVER_API && winAmount > 0) {

            balance += winAmount;

        }

        updateDisplay();

        // Show result

        if (winAmount > 0) {

            messageBox.textContent =
                "🎉 WIN! Rs " + winAmount.toFixed(2) + " 🎉";

        } else {

            messageBox.textContent =
                "No Win! Try Again.";

        }

    } catch (error) {

        console.error(error);

        messageBox.textContent =
            "Game Error: " + error.message;

    } finally {

        isSpinning = false;

        spinBtn.disabled = false;

        document.getElementById("plusBtn").disabled = false;
        document.getElementById("minusBtn").disabled = false;

    }

}

// ==================================
// RESET DEMO BALANCE
// ==================================

document.getElementById("resetBtn")
    .addEventListener("click", () => {

        if (isSpinning) return;

        if (CONFIG.USE_SERVER_API) {

            messageBox.textContent =
                "Balance reset must be handled by the server.";

            return;

        }

        balance = CONFIG.startingBalance;
        currentBet = 10;

        updateDisplay();

        messageBox.textContent =
            "Demo Balance Reset!";

    });

// ==================================
// BUTTON EVENTS
// ==================================

spinBtn.addEventListener("click", playSpin);

// ==================================
// START GAME
// ==================================

showInitialReels();
updateDisplay();

</script>

</body>
</html>
