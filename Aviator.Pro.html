<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KNP-999 | Aviator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #050b14;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background-color: #0f172a;
            padding: 1rem;
            text-align: center;
            border-bottom: 1px solid #334155;
        }
        header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #38bdf8;
        }
        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .game-wrapper {
            width: 100%;
            max-width: 800px;
            background-color: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .balance {
            font-size: 1.1rem;
            font-weight: 600;
        }
        .balance span {
            color: #22c55e;
        }
        #aviatorCanvas {
            background: linear-gradient(to bottom, #0284c7, #0f172a);
            width: 100%;
            height: 350px;
            border-radius: 8px;
            display: block;
        }
        .controls {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }
        .bet-box {
            flex: 1;
            background-color: #0f172a;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .input-group {
            display: flex;
            gap: 5px;
        }
        input[type="number"] {
            flex: 1;
            background: #1e293b;
            border: 1px solid #475569;
            color: white;
            padding: 8px;
            border-radius: 4px;
            text-align: center;
        }
        .btn-ctrl {
            background: #334155;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-bet {
            background: #0284c7;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-cashout {
            background: #eab308;
            color: black;
            border: none;
            padding: 12px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<header>
    <h1>AVIATOR PRO</h1>
</header>

<div class="main-container">
    <div class="game-wrapper">
        <div class="game-header">
            <h2>Aviator Flight</h2>
            <div class="balance">Balance: $<span id="userBalance">1000.00</span></div>
        </div>

        <canvas id="aviatorCanvas" width="800" height="350"></canvas>

        <div class="controls">
            <!-- Bet Panel 1 -->
            <div class="bet-box">
                <label>Bet ($)</label>
                <div class="input-group">
                    <button class="btn-ctrl" onclick="adjustBet(1, -10)">-10</button>
                    <input type="number" id="betInput1" value="10" readonly>
                    <button class="btn-ctrl" onclick="adjustBet(1, 10)">+10</button>
                </div>
                <button id="betBtn1" class="btn-bet" onclick="handleBet(1)">Place Bet</button>
            </div>
            <!-- Bet Panel 2 -->
            <div class="bet-box">
                <label>Bet ($)</label>
                <div class="input-group">
                    <button class="btn-ctrl" onclick="adjustBet(2, -10)">-10</button>
                    <input type="number" id="betInput2" value="10" readonly>
                    <button class="btn-ctrl" onclick="adjustBet(2, 10)">+10</button>
                </div>
                <button id="betBtn2" class="btn-bet" onclick="handleBet(2)">Place Bet</button>
            </div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('aviatorCanvas');
    const ctx = canvas.getContext('2d');
    
    let balance = 1000.00;
    let multiplier = 1.00;
    let isFlying = false;
    let crashPoint = 1.00;
    let startTime;
    let animationId;
    
    let bets = {
        1: { amount: 10, active: false, cashed: false },
        2: { amount: 10, active: false, cashed: false }
    };

    function updateUI() {
        document.getElementById('userBalance').innerText = balance.toFixed(2);
    }

    function adjustBet(panel, amount) {
        if (isFlying) return;
        let input = document.getElementById(`betInput${panel}`);
        let current = parseInt(input.value);
        let updated = current + amount;
        if (updated >= 10) {
            input.value = updated;
            bets[panel].amount = updated;
        }
    }

    function handleBet(panel) {
        let btn = document.getElementById(`betBtn${panel}`);
        if (!isFlying) {
            // Placing Bet
            if (balance < bets[panel].amount) {
                alert("Not enough balance!");
                return;
            }
            balance -= bets[panel].amount;
            updateUI();
            bets[panel].active = true;
            bets[panel].cashed = false;
            btn.innerText = "Cash Out";
            btn.className = "btn-cashout";
            
            if (!isFlying && (!bets[1].active || !bets[2].active)) {
                // Check if we should start flight
                 startFlight();
            }
        } else {
            // Cashing Out
            if (bets[panel].active && !bets[panel].cashed) {
                let payout = bets[panel].amount * multiplier;
                balance += payout;
                updateUI();
                bets[panel].cashed = true;
                btn.innerText = "Cashed Out";
                btn.disabled = true;
            }
        }
    }

    function startFlight() {
        isFlying = true;
        multiplier = 1.00;
        startTime = Date.now();
        // Generate random crash point between 1.2 and 5.0
        crashPoint = parseFloat((Math.random() * (5.0 - 1.2) + 1.2).toFixed(2));
        animatePlane();
    }

    function animatePlane() {
        if (!isFlying) return;
        
        let elapsed = (Date.now() - startTime) / 1000;
        multiplier = 1 + elapsed * 0.8; // Speed of multiplier growth

        if (multiplier >= crashPoint) {
            multiplier = crashPoint;
            endFlight(true);
            return;
        }

        drawGame();
        animationId = requestAnimationFrame(animatePlane);
    }

    function drawGame() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw Background Elements (Clouds/Stars)
        ctx.fillStyle = "rgba(255, 255, 255, 0.1)";
        ctx.beginPath();
        ctx.arc(100, 100, 40, 0, Math.PI * 2);
        ctx.arc(300, 80, 60, 0, Math.PI * 2);
        ctx.arc(600, 150, 50, 0, Math.PI * 2);
        ctx.fill();

        // Draw Multiplier Text
        ctx.fillStyle = "white";
        ctx.font = "bold 60px Poppins, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(multiplier.toFixed(2) + "x", canvas.width / 2, canvas.height / 2 + 20);

        // Draw Plane (Red triangle moving up)
        let progress = (multiplier - 1) / (crashPoint - 1 || 1);
        if (progress > 1) progress = 1;
        
        let planeX = 50 + progress * 600;
        let planeY = 300 - progress * 200;

        ctx.save();
        ctx.translate(planeX, planeY);
        ctx.rotate(-Math.PI / 6); // Angle upwards
        
        // Plane body
        ctx.fillStyle = "#ef4444";
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(-30, 10);
        ctx.lineTo(-20, 0);
        ctx.lineTo(-30, -10);
        ctx.fill();
        
        ctx.restore();
    }

    function endFlight(isCrash) {
        isFlying = false;
        cancelAnimationFrame(animationId);
        drawGame();

        ctx.fillStyle = isCrash ? "#ef4444" : "#22c55e";
        ctx.font = "bold 40px Poppins, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(isCrash ? "CRASHED" : "ENDED", canvas.width / 2, canvas.height / 2 - 40);

        // Handle uncashed bets on crash
        for (let p of [1, 2]) {
            if (bets[p].active && !bets[p].cashed) {
                document.getElementById(`betBtn${p}`).innerText = "Lost";
                document.getElementById(`betBtn${p}`).className = "btn-ctrl";
            }
        }

        setTimeout(() => {
            resetGame();
        }, 3000);
    }

    function resetGame() {
        multiplier = 1.00;
        for (let p of [1, 2]) {
            bets[p].active = false;
            bets[p].cashed = false;
            let btn = document.getElementById(`betBtn${p}`);
            btn.innerText = "Place Bet";
            btn.className = "btn-bet";
            btn.disabled = false;
        }
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "white";
        ctx.font = "bold 60px Poppins, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("1.00x", canvas.width / 2, canvas.height / 2 + 20);
    }

    updateUI();
</script>

</body>
</html>
