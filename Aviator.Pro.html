<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KNP-999 | Aviator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #050b14;
            color: #fff;
            user-select: none;
            min-height: 100vh;
        }

        .cinzel-font {
            font-family: 'Cinzel', serif;
        }

        .aviator-body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .game-wrapper {
            width: 100%;
            max-width: 800px;
            background-color: #0d1b2a;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }
        .aviator-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        .balance-aviator {
            color: #70e000;
            font-weight: bold;
        }
        #canvas {
            background: linear-gradient(to top, #001219, #005f73);
            width: 100%;
            height: 350px;
            border-radius: 10px;
            display: block;
        }
        .controls {
            display: flex;
            gap: 20px;
            margin-top: 15px;
        }
        .bet-panel {
            flex: 1;
            background-color: #1b263b;
            padding: 15px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .aviator-input, .aviator-btn {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: none;
        }
        .aviator-input {
            background: #0d1b2a;
            color: #fff;
            text-align: center;
        }
        .btn-row {
            display: flex;
            gap: 5px;
        }
        .btn-row button {
            flex: 1;
            background: #415a77;
            color: white;
            cursor: pointer;
        }
        .btn-bet {
            background: #00b4d8;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-cashout {
            background: #ffb703;
            color: #000;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">
<header class="w-full bg-slate-900 border-b border-amber-500/30 px-4 py-3 text-center shadow-lg">
    <h1 class="cinzel-font font-black text-xl text-amber-400">AVIATOR</h1>
</header>

<div id="game-aviator" class="flex-1 aviator-body">
    <div class="game-wrapper">
        <div class="aviator-header">
            <h2>PIA Aviator Pro</h2>
            <div>Balance: $<span id="balance" class="balance-aviator">1000.00</span></div>
        </div>

        <canvas id="canvas" width="800" height="350"></canvas>

        <div class="controls">
            <div class="bet-panel">
                <label>Bet Amount ($)</label>
                <div class="btn-row">
                    <button onclick="changeBet(1, -10)">-10</button>
                    <input type="number" id="input-1" class="aviator-input" value="10">
                    <button onclick="changeBet(1, 10)">+10</button>
                </div>
                <button id="btn-1" class="aviator-btn btn-bet" onclick="toggleBet(1)">Place Bet</button>
            </div>
            <div class="bet-panel">
                <label>Bet Amount ($)</label>
                <div class="btn-row">
                    <button onclick="changeBet(2, -10)">-10</button>
                    <input type="number" id="input-2" class="aviator-input" value="10">
                    <button onclick="changeBet(2, 10)">+10</button>
                </div>
                <button id="btn-2" class="aviator-btn btn-bet" onclick="toggleBet(2)">Place Bet</button>
            </div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let balance = 1000.00;
    let multiplier = 1.00;
    let gameRunning = false;
    let aviatorBets = { 1: { active: false, amount: 0 }, 2: { active: false, amount: 0 } };
    let animationId;
    let startTime;
    let cityOffset = 0;

    function updateAviatorUI() {
        document.getElementById('balance').innerText = balance.toFixed(2);
    }

    function changeBet(panel, amount) {
        if (gameRunning) return;
        const input = document.getElementById(`input-${panel}`);
        let val = parseInt(input.value) + amount;
        if (val < 10) val = 10;
        input.value = val;
    }

    function toggleBet(panel) {
        const btn = document.getElementById(`btn-${panel}`);
        const input = document.getElementById(`input-${panel}`);
        
        if (!gameRunning) {
            if (!aviatorBets[panel].active) {
                let amount = parseFloat(input.value);
                if (amount > balance || amount <= 0) return;
                balance -= amount;
                aviatorBets[panel].amount = amount;
                aviatorBets[panel].active = true;
                updateAviatorUI();
                btn.innerText = "Cancel";
                btn.className = "aviator-btn btn-cashout";
                startGame();
            } else {
                balance += aviatorBets[panel].amount;
                aviatorBets[panel].active = false;
                updateAviatorUI();
                btn.innerText = "Place Bet";
                btn.className = "aviator-btn btn-bet";
            }
        } else {
            if (aviatorBets[panel].active) {
                let payout = aviatorBets[panel].amount * multiplier;
                balance += payout;
                aviatorBets[panel].active = false;
                updateAviatorUI();
                btn.innerText = "Cashed Out";
                btn.disabled = true;
            }
        }
    }

    function startGame() {
        if (gameRunning) return;
        gameRunning = true;
        multiplier = 1.00;
        startTime = Date.now();
        document.querySelectorAll('.aviator-input').forEach(i => i.disabled = true);
        animateAviator();
    }

    function animateAviator() {
        const elapsed = (Date.now() - startTime) / 1000;
        multiplier = 1.00 + (elapsed * 0.5);
        cityOffset = (cityOffset - 2) % 100;
        
        if (multiplier > 3.0 && Math.random() < 0.03) {
            endAviatorGame(true);
            return;
        }

        drawAviator();
        animationId = requestAnimationFrame(animateAviator);
    }

    function drawAviator() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = "#0d1b2a";
        for (let i = 0; i < canvas.width; i += 40) {
            let x = (i + cityOffset) % canvas.width;
            ctx.fillRect(x, 250, 30, 100);
        }

        ctx.fillStyle = "white";
        ctx.font = "bold 50px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(multiplier.toFixed(2) + "x", canvas.width/2, canvas.height/2 - 20);

        let x = 100 + (multiplier * 40);
        let y = 280 - (multiplier * 25);
        
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(Math.PI / 4);
        ctx.fillStyle = "#01411C";
        ctx.fillRect(-15, -15, 30, 30);
        ctx.restore();
    }

    function endAviatorGame(crashed) {
        gameRunning = false;
        cancelAnimationFrame(animationId);
        
        ctx.fillStyle = crashed ? "red" : "orange";
        ctx.font = "bold 30px sans-serif";
        ctx.fillText(crashed ? "CRASHED" : "ENDED", canvas.width/2, canvas.height/2 + 30);

        setTimeout(() => {
            resetAviatorGame();
        }, 3000);
    }

    function resetAviatorGame() {
        multiplier = 1.00;
        document.querySelectorAll('.aviator-input').forEach(i => i.disabled = false);
        for (let p of [1, 2]) {
            aviatorBets[p].active = false;
            const btn = document.getElementById(`btn-${p}`);
            btn.innerText = "Place Bet";
            btn.className = "aviator-btn btn-bet";
            btn.disabled = false;
        }
        drawAviator();
    }

    drawAviator();
</script>
</body>
</html>
