<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator Pro - Complete</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0d1117; color: white; min-height: 100vh; display: flex; flex-direction: column; }
        header { background-color: #161b22; padding: 10px 20px; text-align: center; border-bottom: 1px solid #30363d; font-weight: bold; }
        .balance-bar { display: flex; justify-content: space-between; padding: 10px 20px; background: #21262d; border-bottom: 1px solid #30363d; }
        .app-container { display: flex; flex: 1; position: relative; }
        .history-sidebar { width: 250px; background: #161b22; padding: 10px; border-right: 1px solid #30363d; overflow-y: auto; }
        .history-item { padding: 5px 10px; border-radius: 4px; font-weight: bold; text-align: center; margin-bottom: 5px; }
        .mult-high { background: #1f6feb; color: white; }
        .mult-mid { background: #8957e5; color: white; }
        .mult-low { background: #30363d; color: #8b949e; }
        .game-main { flex: 1; display: flex; flex-direction: column; position: relative; }
        .stage-wrapper { position: relative; background: radial-gradient(circle, #21262d, #0d1117); flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        #aviatorCanvas { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        .multiplier-display { position: absolute; font-size: 4rem; font-weight: 900; color: white; text-shadow: 0 0 10px rgba(0,0,0,0.5); z-index: 10; display: none; }
        .status-msg { position: absolute; font-size: 2.5rem; font-weight: bold; text-shadow: 0 0 10px rgba(0,0,0,0.5); z-index: 10; display: none; }
        .controls-wrapper { display: flex; gap: 10px; padding: 15px; background: #161b22; border-top: 1px solid #30363d; z-index: 20; }
        .bet-panel { flex: 1; background: #0d1117; padding: 15px; border-radius: 8px; border: 1px solid #30363d; display: flex; flex-direction: column; gap: 10px; }
        .input-group { display: flex; align-items: center; gap: 5px; }
        input[type="number"] { background: #161b22; border: 1px solid #30363d; color: white; padding: 10px; border-radius: 4px; width: 100px; text-align: center; font-weight: bold; }
        .btn-control { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-control:hover { background: #30363d; }
        .btn-bet { background: #238636; color: white; border: none; padding: 12px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .btn-bet:hover { background: #2ea043; }
        .btn-cashed { background: #9e6a03; color: white; border: none; padding: 12px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .btn-lost { background: #da3633; color: white; border: none; padding: 12px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        #live-bets-sidebar { width: 220px; background: #161b22; padding: 10px; border-left: 1px solid #30363d; overflow-y: auto; font-size: 0.9rem; }
        .live-bet-item { padding: 6px 10px; border-bottom: 1px solid #21262d; display: flex; justify-content: space-between; align-items: center; }
        .live-bet-item.cashed { color: #3fb950; font-weight: bold; }
    </style>
</head>
<body>

<header>AVIATOR PRO - LIVE</header>

<div class="balance-bar">
    <div>Status: <span id="gameStatusText" style="color: #58a6ff; font-weight: bold;">Waiting for bet</span></div>
    <div>Balance: $<span id="userBalance" style="color: #3fb950; font-weight: bold;">1000.00</span></div>
</div>

<div class="app-container">
    <!-- Round History Sidebar -->
    <div class="history-sidebar">
        <div style="font-weight: bold; border-bottom: 1px solid #30363d; padding-bottom: 5px; margin-bottom: 10px;">Round History</div>
        <div id="historyList"></div>
    </div>

    <!-- Main Game Area -->
    <div class="game-main">
        <div class="stage-wrapper">
            <div id="multiplierDisplay" class="multiplier-display">1.00x</div>
            <div id="statusMsg" class="status-msg">FLY AWAY!</div>
            <canvas id="aviatorCanvas" width="800" height="400"></canvas>
        </div>

        <div class="controls-wrapper">
            <!-- Panel 1 -->
            <div class="bet-panel">
                <div class="input-group">
                    <button class="btn-control" onclick="adjustBet(1, -10)">-10</button>
                    <input type="number" id="betInput1" value="10" min="10">
                    <button class="btn-control" onclick="adjustBet(1, 10)">+10</button>
                </div>
                <button id="betBtn1" class="btn-bet" onclick="handleBet(1)">BET</button>
            </div>

            <!-- Panel 2 -->
            <div class="bet-panel">
                <div class="input-group">
                    <button class="btn-control" onclick="adjustBet(2, -10)">-10</button>
                    <input type="number" id="betInput2" value="10" min="10">
                    <button class="btn-control" onclick="adjustBet(2, 10)">+10</button>
                </div>
                <button id="betBtn2" class="btn-bet" onclick="handleBet(2)">BET</button>
            </div>
        </div>
    </div>

    <!-- Live Bets Sidebar -->
    <div id="live-bets-sidebar">
        <div style="font-weight: bold; border-bottom: 1px solid #30363d; padding-bottom: 5px; margin-bottom: 10px;">Live Bets</div>
        <div id="liveBetsList"></div>
    </div>
</div>

<script>
    const canvas = document.getElementById('aviatorCanvas');
    const ctx = canvas.getContext('2d');

    let balance = 1000.00;
    let gamePhase = 'WAITING'; // WAITING, FLYING, ENDED
    let multiplier = 1.00;
    let crashPoint = 1.00;
    let startTime = 0;
    let animationId;

    let bets = {
        1: { amount: 10, state: 'NONE' }, // NONE, BETPLACED, CASHED, LOST
        2: { amount: 10, state: 'NONE' }
    };

    const roundHistory = [];

    // Bot Configuration
    const botNames = ["Ali", "Sara", "Khan", "Zain", "Fatima", "Bilal", "Aisha", "Umar", "Noor", "Tariq"];
    let bots = [];

    function initBots() {
        bots = botNames.map(name => ({
            name: name,
            bet: Math.floor(Math.random() * 90) + 10,
            cashedOut: false,
            cashOutMult: (Math.random() * 4 + 1.1).toFixed(2)
        }));
    }

    function updateLiveBetsDisplay() {
        const container = document.getElementById('liveBetsList');
        container.innerHTML = '';
        bots.forEach(bot => {
            const div = document.createElement('div');
            div.className = 'live-bet-item';
            if (bot.cashedOut) {
                div.className += ' cashed';
                div.innerHTML = `<span>${bot.name}</span><span>${bot.cashOutMult}x</span>`;
            } else if (gamePhase === 'FLYING') {
                div.innerHTML = `<span>${bot.name}</span><span>In flight</span>`;
            } else {
                div.innerHTML = `<span>${bot.name}</span><span>$${bot.bet}</span>`;
            }
            container.appendChild(div);
        });
    }

 Here is the exact code block for the updateUI, handleBet, and drawGame functions to replace your existing ones:
function updateUI() {
    document.getElementById('userBalance').innerText = balance.toFixed(2);
    const statusText = document.getElementById('gameStatusText');
    
    for (let p of [1, 2]) {
        let btn = document.getElementById(`betBtn${p}`);
        let input = document.getElementById(`betInput${p}`);
        
        if (gamePhase === 'WAITING') {
            statusText.innerText = "Waiting for bet";
            if (bets[p].state === 'NONE') {
                btn.innerText = "BET";
                btn.className = "btn-bet";
                input.disabled = false;
            } else if (bets[p].state === 'BETPLACED') {
                btn.innerText = "CASH OUT";
                btn.className = "btn-control";
                input.disabled = true;
            }
        } else if (gamePhase === 'FLYING') {
            statusText.innerText = "Multiplier: " + multiplier.toFixed(2) + "x";
            input.disabled = true;
            if (bets[p].state === 'BETPLACED') {
                btn.innerText = "CASH OUT";
                btn.className = "btn-bet";
            } else if (bets[p].state === 'CASHED') {
                btn.innerText = "CASHED";
                btn.className = "btn-cashed";
            }
        }
    }
}

function handleBet(panel) {
    if (gamePhase === 'WAITING') {
        if (bets[panel].state === 'NONE') {
            let amount = parseInt(document.getElementById(`betInput${panel}`).value);
            balance -= amount;
            bets[panel].amount = amount;
            bets[panel].state = 'BETPLACED';
        } else if (bets[panel].state === 'BETPLACED') {
            balance += bets[panel].amount;
            bets[panel].state = 'NONE';
        }
    } else if (gamePhase === 'FLYING') {
        if (bets[panel].state === 'BETPLACED') {
            balance += bets[panel].amount * multiplier;
            bets[panel].state = 'CASHED';
        }
    }
    updateUI();
}

function drawGame() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let progress = (multiplier - 1) / (crashPoint > 10 ? 10 : crashPoint);
    if (progress > 1) progress = 1;
    let curX = progress * (canvas.width - 50);
    let curY = canvas.height - (progress * (canvas.height - 50));

    ctx.strokeStyle = '#388bfd';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(0, canvas.height);
    ctx.quadraticCurveTo(curX * 0.5, canvas.height, curX, curY);
    ctx.stroke();

    ctx.fillStyle = '#ff7b72';
    ctx.beginPath();
    ctx.arc(curX, curY, 10, 0, Math.PI * 2);
    ctx.fill();
}

    function endRound(isCrash = true) {
        gamePhase = 'ENDED';
        cancelAnimationFrame(animationId);
        document.getElementById('multiplierDisplay').style.display = 'none';
        
        const statusMsg = document.getElementById('statusMsg');
        statusMsg.style.display = 'block';
        statusMsg.innerText = "FLEW AWAY!";
        statusMsg.style.color = "#ff7b72";

        drawGame();

        roundHistory.unshift(parseFloat(multiplier.toFixed(2)));
        if (roundHistory.length > 10) roundHistory.pop();
        updateHistorySidebar();

        for (let p of [1, 2]) {
            if (bets[p].state === 'BETPLACED') {
                bets[p].state = 'LOST';
            }
        }
        updateUI();

        setTimeout(() => {
            resetRound();
        }, 3000);
    }

    function resetRound() {
        gamePhase = 'WAITING';
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        statusMsg.style.display = 'none';
        for (let p of [1, 2]) {
            bets[p].state = 'NONE';
        }
        updateUI();
    }

    function updateHistorySidebar() {
        const sidebar = document.getElementById('historyList');
        sidebar.innerHTML = '';
        roundHistory.forEach(mult => {
            let className = 'mult-low';
            if (mult >= 10.0) className = 'mult-high';
            else if (mult >= 2.0) className = 'mult-mid';
            sidebar.innerHTML += `<div class="history-item ${className}">${mult}x</div>`;
        });
    }

    updateUI();
</script>
</body>
</html>
