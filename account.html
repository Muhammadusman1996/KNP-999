<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<title>KNP-999 Customer Account</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 min-height:100vh;
 padding:16px;
 background:radial-gradient(circle at top,#25365e,#080d1b 65%);
 color:white;
 font:16px Arial
}
.wrap{
 width:min(100%,430px);
 margin:30px auto;
 background:#17233d;
 border:1px solid #53617e;
 border-radius:17px;
 padding:20px;
 box-shadow:0 14px 35px #0008
}
h1{
 text-align:center;
 color:#f6d778;
 margin:5px 0 18px
}
.tabs{
 display:flex;
 gap:8px;
 margin-bottom:15px
}
.tabs button{
 flex:1;
 background:#263653;
 color:white;
 border:1px solid #64748b
}
.tabs button.active{
 background:#c99a35;
 color:#111
}
input,button{
 width:100%;
 padding:13px;
 margin:7px 0;
 border-radius:8px;
 border:1px solid #64748b;
 font-size:16px
}
input{
 background:#e8efff;
 color:#111
}
button{
 background:#c99a35;
 color:#111;
 font-weight:bold;
 cursor:pointer
}
button:disabled{
 opacity:.6;
 cursor:not-allowed
}
.note{
 font-size:13px;
 color:#bac6dc;
 line-height:1.5
}
#msg{
 color:#f6d778;
 line-height:1.5;
 min-height:22px;
 overflow-wrap:anywhere
}
a{color:#f6d778}
</style>
</head>

<body>

<div class="wrap">

<h1>KNP-999 CUSTOMER ACCOUNT</h1>

<div class="tabs">
<button id="loginTab" class="active" type="button">LOGIN</button>
<button id="createTab" type="button">CREATE ACCOUNT</button>
</div>

<p class="note" id="hint">
Login using your mobile number and password.
</p>

<div id="nameWrap" style="display:none">
<input
 id="name"
 placeholder="User name"
 autocomplete="name">
</div>

<input
 id="phone"
 placeholder="Mobile number (03XXXXXXXXX)"
 inputmode="tel"
 autocomplete="tel">

<input
 id="password"
 type="password"
 placeholder="Password"
 autocomplete="current-password">

<button id="submit" type="button">LOGIN</button>

<p id="msg" role="status" aria-live="polite"></p>

<p><a href="./index.html">Back to games</a></p>

</div>

<script src="./firebase-config.js?v=20261115-fix5"></script>

<script type="module">

import {
 initializeApp
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';

import {
 getAuth,
 createUserWithEmailAndPassword,
 signInWithEmailAndPassword,
 updateProfile
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

import {
 getFunctions,
 httpsCallable
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js';

const $ = id => document.getElementById(id);

const btn = $('submit');

let mode = 'login';
let auth = null;
let createPlayerProfile = null;

const cfg = window.KNP_FIREBASE_CONFIG;

function showMessage(message){
 $('msg').textContent = message;
}

function setMode(next){

 mode = next;

 $('loginTab').classList.toggle(
  'active',
  mode === 'login'
 );

 $('createTab').classList.toggle(
  'active',
  mode === 'create'
 );

 $('nameWrap').style.display =
  mode === 'create' ? 'block' : 'none';

 btn.textContent =
  mode === 'create' ? 'CREATE ACCOUNT' : 'LOGIN';

 $('hint').textContent = mode === 'create'
  ? 'Create your account with your user name, mobile number and password.'
  : 'Login using your registered mobile number and password.';

 $('password').autocomplete =
  mode === 'create' ? 'new-password' : 'current-password';

 showMessage('');
}

$('loginTab').onclick = () => setMode('login');
$('createTab').onclick = () => setMode('create');


/* Pakistan mobile number normalization */

function normalizePhone(value){

 let digits = value.replace(/\D/g,'');

 if(digits.startsWith('0092')){
  digits = digits.slice(4);
 }
 else if(digits.startsWith('92')){
  digits = digits.slice(2);
 }

 if(digits.length === 10 && digits.startsWith('3')){
  digits = '0' + digits;
 }

 if(!/^03\d{9}$/.test(digits)){
  throw new Error(
   'Enter a valid Pakistan mobile number, e.g. 03001234567.'
  );
 }

 return digits;
}


/* Firebase Auth alias */

function authAlias(phone){
 return 'u' + phone + '@knp999-login.com';
}


/* Firebase error messages */

function readableError(error){

 const code = error?.code || '';

 if(
  code === 'auth/invalid-credential' ||
  code === 'auth/wrong-password' ||
  code === 'auth/user-not-found'
 ){
  return 'Mobile number or password is incorrect.';
 }

 if(code === 'auth/email-already-in-use'){
  return 'Mobile number already registered. Please login.';
 }

 if(code === 'auth/weak-password'){
  return 'Password must be at least 6 characters.';
 }

 if(code === 'auth/too-many-requests'){
  return 'Too many attempts. Please try again later.';
 }

 if(code === 'functions/unauthenticated'){
  return 'Please login again.';
 }

 if(code === 'functions/not-found'){
  return 'Profile service not found. Deploy Firebase Functions.';
 }

 if(code === 'functions/already-exists'){
  return 'Account profile already exists.';
 }

 return error?.message || 'Something went wrong. Please try again.';
}


/* Initialize Firebase */

if(!cfg || !cfg.apiKey || cfg.apiKey.startsWith('PASTE_')){

 showMessage(
  'Firebase setup required. Check firebase-config.js.'
 );

 btn.disabled = true;

}else{

 try{

  const app = initializeApp(cfg);

  auth = getAuth(app);

  createPlayerProfile = httpsCallable(
   getFunctions(app),
   'createPlayerProfile'
  );

 }catch(error){

  showMessage(
   'Firebase setup error: ' + readableError(error)
  );

  btn.disabled = true;
 }
}


/* Main account action */

btn.onclick = async () => {

 if(btn.disabled) return;

 btn.disabled = true;

 try{

  if(!auth || !createPlayerProfile){
   throw new Error(
    'Firebase is not configured correctly.'
   );
  }

  const phone = normalizePhone(
   $('phone').value
  );

  const password = $('password').value;

  if(password.length < 6){
   throw new Error(
    'Password must be at least 6 characters.'
   );
  }

  const alias = authAlias(phone);

  showMessage('Please wait...');


  /* CREATE ACCOUNT */

  if(mode === 'create'){

   const name = $('name').value.trim();

   if(name.length < 2){
    throw new Error(
     'Enter your user name with at least 2 characters.'
    );
   }

   let user;

   try{

    const credential =
     await createUserWithEmailAndPassword(
      auth,
      alias,
      password
     );

    user = credential.user;

    await updateProfile(user,{
     displayName:name
    });

   }catch(error){

    /*
     * If Auth account already exists,
     * login with the same mobile and password.
     */

    if(error.code !== 'auth/email-already-in-use'){
     throw error;
    }

    const credential =
     await signInWithEmailAndPassword(
      auth,
      alias,
      password
     );

    user = credential.user;

    if(!user.displayName){
     await updateProfile(user,{
      displayName:name
     });
    }
   }

   /*
    * Create player profile.
    * Server must grant welcome coins only once.
    */

   try{

    await createPlayerProfile({
     name:name,
     phone:phone
    });

   }catch(error){

    /*
     * Existing profile is not a new registration.
     * Do not grant another welcome bonus.
     */

    if(error.code !== 'functions/already-exists'){
     throw error;
    }
   }

   showMessage(
    'Account ready. Opening KNP-999...'
   );

   window.location.replace('./index.html');
   return;
  }


  /* LOGIN */

  await signInWithEmailAndPassword(
   auth,
   alias,
   password
  );

  /*
   * IMPORTANT:
   * Do not read Firestore profile here.
   * Successful Firebase Authentication is enough
   * to redirect the player to the game hub.
   */

  showMessage(
   'Login successful. Opening games...'
  );

  window.location.replace('./index.html');
  return;


 }catch(error){

  console.error(
   'KNP-999 account error:',
   error
  );

  showMessage(
   readableError(error)
  );

 }finally{

  btn.disabled = false;

 }

};

</script>

</body>
</html>
