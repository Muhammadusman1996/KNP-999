
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<title>KNP-999 Customer Account</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;padding:16px;
 background:radial-gradient(circle at top,#25365e,#080d1b 65%);
 color:white;font:16px Arial
}
.wrap{
 width:min(100%,430px);margin:30px auto;
 background:#17233d;border:1px solid #53617e;
 border-radius:17px;padding:20px;
 box-shadow:0 14px 35px #0008
}
h1{text-align:center;color:#f6d778;margin:5px 0 18px}
.tabs{display:flex;gap:8px;margin-bottom:15px}
.tabs button{flex:1;background:#263653;color:white;border:1px solid #64748b}
.tabs button.active{background:#c99a35;color:#111}
input,button{
 width:100%;padding:13px;margin:7px 0;
 border-radius:8px;border:1px solid #64748b;font-size:16px
}
input{background:#e8efff;color:#111}
button{background:#c99a35;color:#111;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}
.note{font-size:13px;color:#bac6dc;line-height:1.5}
#msg{color:#f6d778;line-height:1.5;min-height:22px}
a{color:#f6d778}
</style>
</head>

<body>
<div class="wrap">

<h1>KNP-999 CUSTOMER ACCOUNT</h1>

<div class="tabs">
<button id="loginTab" class="active" type="button">LOGIN</button>
<button id="createTab" type="button">CREATE ACCOUNT</button>
</div>

<p class="note" id="hint">Login using your mobile number and password.</p>

<div id="nameWrap" style="display:none">
<input id="name" placeholder="User name" autocomplete="name">
</div>

<input id="phone" placeholder="Mobile number (03XXXXXXXXX)" inputmode="tel">
<input id="password" type="password" placeholder="Password">

<button id="submit" type="button">LOGIN</button>

<p id="msg"></p>
<p><a href="./index.html">Back to games</a></p>

</div>

<script src="./firebase-config.js?v=20261115-fix3"></script>

<script type="module">
import {initializeApp}
from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';

import {
 getAuth,
 createUserWithEmailAndPassword,
 signInWithEmailAndPassword,
 updateProfile
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

import {
 getFirestore,doc,getDoc
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

import {
 getFunctions,httpsCallable
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js';

const $=id=>document.getElementById(id);
const msg=$('msg');

let mode='login';
let auth=null;
let db=null;
let createPlayerProfile=null;

const cfg=window.KNP_FIREBASE_CONFIG;

function setMode(next){
 mode=next;
 $('loginTab').classList.toggle('active',mode==='login');
 $('createTab').classList.toggle('active',mode==='create');
 $('nameWrap').style.display=mode==='create'?'block':'none';
 $('submit').textContent=mode==='create'?'CREATE ACCOUNT':'LOGIN';
 $('hint').textContent=mode==='create'
 ?'Create your account with your user name, mobile number and password.'
 :'Login using your registered mobile number and password.';
 $('password').autocomplete=mode==='create'?'new-password':'current-password';
 msg.textContent='';
}

$('loginTab').onclick=()=>setMode('login');
$('createTab').onclick=()=>setMode('create');

function cleanPhone(v){
 return v.replace(/[\s\-()+]/g,'');
}

function authAlias(phone){
 return 'u'+phone.replace(/\D/g,'')+'@knp999-login.com';
}

if(!cfg||!cfg.apiKey||cfg.apiKey.startsWith('PASTE_')){
 msg.textContent='Firebase setup required. Check firebase-config.js.';
}else{
 try{
  const app=initializeApp(cfg);
  auth=getAuth(app);
  db=getFirestore(app);
  createPlayerProfile=httpsCallable(
   getFunctions(app),
   'createPlayerProfile'
  );
 }catch(e){
  msg.textContent='Firebase error: '+e.message;
 }
}

$('submit').onclick=async()=>{
 const btn=$('submit');

 try{
  if(!auth||!db) throw Error('Firebase is not configured.');

  const phone=cleanPhone($('phone').value);
  const password=$('password').value;

  if(!/^(\+?92|0)?3\d{9}$/.test(phone)){
   throw Error('Enter a valid Pakistan mobile number.');
  }

  if(password.length<6){
   throw Error('Password must be at least 6 characters.');
  }

  const alias=authAlias(phone);

  btn.disabled=true;
  msg.textContent='Please wait...';

  if(mode==='create'){
   const name=$('name').value.trim();

   if(name.length<2) throw Error('Enter your user name.');

   const cred=await createUserWithEmailAndPassword(
    auth,alias,password
   );

   await updateProfile(cred.user,{displayName:name});

   await createPlayerProfile({name,phone});

   msg.textContent='Account created. 50 Welcome Coins added.';
   window.location.replace('./index.html');
   return;
  }

  const cred=await signInWithEmailAndPassword(
   auth,alias,password
  );

  const profile=await getDoc(
   doc(db,'users',cred.user.uid)
  );

  if(!profile.exists()){
   throw Error('Account profile not found. Contact admin.');
  }

  msg.textContent='Login successful. Opening games...';
  window.location.replace('./index.html');
  return;

 }catch(e){
  if(e.code==='auth/email-already-in-use'){
   msg.textContent='Mobile number already registered. Please login.';
  }else if(e.code==='auth/invalid-credential'){
   msg.textContent='Mobile number or password is incorrect.';
  }else{
   msg.textContent=e.message||'Something went wrong.';
  }
 }finally{
  btn.disabled=false;
 }
};
</script>
</body>
</html>
