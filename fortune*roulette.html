<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortune Roulette</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0b1d13;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            min-height: 100vh;
            margin: 0;
        }
        h1 { color: #ffd700; text-shadow: 0 0 5px #000; margin: 0 0 5px 0; font-size: 1.4rem; }
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            background: #143322;
            padding: 10px;
            border-radius: 12px;
            border: 2px solid #2e6945;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 460px;
        }
        .dashboard {
            display: flex;
            justify-content: space-around;
            width: 100%;
            font-size: 0.95rem;
            background: #09170e;
            padding: 6px 0;
            border-radius: 8px;
            border: 1px solid #1f472e;
        }
        .stat span { color: #ffd700; font-weight: bold; }
        
        .wheel-container {
            position: relative;
            width: 150px;
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .pointer {
            position: absolute;
            top: -4px;
            z-index: 10;
            width: 0;
            height: 0;
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-top: 14px solid #ff0000;
            filter: drop-shadow(0 2px 3px #000);
        }
        canvas#wheel {
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0,0,0,0.8);
            transition: transform 4s cubic-bezier(0.15, 0.9, 0.15, 1);
        }

        /* Roulette Table Board Layout */
        .table-board {
            display: flex;
            background: #0f4026;
            padding: 6px;
            border-radius: 8px;
            border: 2px solid #ffd700;
            width: 100%;
            gap: 3px;
        }

        /* Outside bets grid (Left side) */
        .outside-bets-col {
            display: flex;
            flex-direction: column;
            gap: 3px;
            width: 32%;
        }
        .outside-row {
            display: flex;
            gap: 3px;
            flex: 1;
        }

        /* Numbers grid (Right side) */
        .numbers-board {
            display: flex;
            flex-direction: column;
            gap: 3px;
            width: 68%;
        }
        
        .cell-zero {
            width: 100%;
            height: 32px;
            background: #008000;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            position: relative;
            font-size: 1rem;
            border: 1px solid #ffd700;
        }

        .numbers-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 3px;
        }

        .column-bets {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 3px;
        }

        .cell {
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
            border-radius: 3px;
            position: relative;
            user-select: none;
            transition: transform 0.1s;
            font-size: 0.85rem;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.15);
        }
        .cell:active { transform: scale(0.95); }
        .cell.red { background: #b22222; }
        .cell.black { background: #1a1a1a; }
        .cell.green { background: #008000; }
        .cell.side-bet { 
            background: #175232; 
            font-size: 0.75rem; 
            text-align: center;
        }
        .cell.red-diamond { background: #b22222; color: transparent; }
        .cell.black-diamond { background: #1a1a1a; color: transparent; }
        .cell.red-diamond::after { content: "◆"; color: #ff4d4d; font-size: 1rem; }
        .cell.black-diamond::after { content: "◆"; color: #aaa; font-size: 1rem; }

        .multiplier-badge {
            position: absolute;
            top: 1px;
            right: 1px;
            background: #ffcc00;
            color: #000;
            font-size: 0.55rem;
            font-weight: 900;
            padding: 0 2px;
            border-radius: 2px;
            border: 1px solid #fff;
            animation: pulse 1s infinite alternate;
        }
        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.15); }
        }

        .chip {
            position: absolute;
            bottom: 1px;
            left: 1px;
            width: 14px;
            height: 14px;
            background: gold;
            color: black;
            border-radius: 50%;
            font-size: 0.55rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border: 1px solid #000;
        }

        .controls {
            display: flex;
            gap: 5px;
            align-items: center;
            width: 100%;
        }
        input[type="number"] {
            width: 60px;
            padding: 6px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 0.9rem;
            text-align: center;
        }
        button.action-btn {
            padding: 6px 10px;
            font-size: 0.85rem;
            font-weight: bold;
            color: #fff;
            background: #28a745;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            flex: 1;
        }
        button.clear-btn { background: #dc3545; }
        button.repeat-btn { background: #17a2b8; }
        button:disabled { background: #555; cursor: not-allowed; }

        #status-log {
            font-size: 0.85rem;
            color: #e0e0e0;
            min-height: 30px;
            text-align: center;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .win-text { color: #adff2f !important; }
        .loss-text { color: #ff6b6b !important; }
    </style>
</head>
<body>

<h1>Fortune Roulette</h1>

<div class="game-container">
    <div class="dashboard">
        <div class="stat">بیلنس: <span id="balance">1000</span></div>
        <div class="stat">کل بیٹ: <span id="total-bet">0</span></div>
    </div>

    <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheel" width="150" height="150"></canvas>
    </div>

    <!-- MAIN ROULETTE TABLE BOARD -->
    <div class="table-board">
        <!-- Outside / Side Bets Left Column -->
        <div class="outside-bets-col">
            <div class="outside-row" style="flex: 1;">
                <div class="cell side-bet" data-type="range" data-val="1-18">1-18</div>
                <div class="cell side-bet" data-type="dozen" data-val="1">1st 12</div>
            </div>
            <div class="outside-row" style="flex: 1;">
                <div class="cell side-bet" data-type="evenodd" data-val="EVEN">EVEN</div>
                <div class="cell side-bet red-diamond" data-type="color" data-val="RED"></div>
            </div>
            <div class="outside-row" style="flex: 1;">
                <div class="cell side-bet black-diamond" data-type="color" data-val="BLACK"></div>
                <div class="cell side-bet" data-type="dozen" data-val="2">2nd 12</div>
            </div>
            <div class="outside-row" style="flex: 1;">
                <div class="cell side-bet" data-type="evenodd" data-val="ODD">ODD</div>
                <div class="cell side-bet" data-type="range" data-val="19-36">19-36</div>
            </div>
            <div class="outside-row" style="flex: 1;">
                <div class="cell side-bet" data-type="dozen" data-val="3" style="width: 100%;">3rd 12</div>
            </div>
        </div>

        <!-- Numbers Grid & 0 (Right Main Column) -->
        <div class="numbers-board">
            <div class="cell-zero" data-num="0">0</div>
            <div class="numbers-grid" id="grid"></div>
            <div class="column-bets">
                <div class="cell side-bet" data-type="col" data-val="1">2:1</div>
                <div class="cell side-bet" data-type="col" data-val="2">2:1</div>
                <div class="cell side-bet" data-type="col" data-val="3">2:1</div>
            </div>
        </div>
    </div>

    <div class="controls">
        <input type="number" id="bet-amount" value="10" min="1" step="5">
        <button class="action-btn" id="spin-btn">SPIN</button>
        <button class="action-btn repeat-btn" id="repeat-btn">REPEAT</button>
        <button class="action-btn clear-btn" id="clear-btn">CLEAR</button>
    </div>

    <div id="status-log"><span>اپنی بیٹ لگائیں اور گھمائیں!</span></div>
</div>

<script>
    const numbersOrder = [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3];
    const redNumbers = new Set([1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36]);
    
    let balance = 1000;
    let bets = {}; 
    let lastBets = {};
    let activeMultipliers = {}; 
    let isSpinning = false;
    let currentRotation = 0;
    let spinCount = 0;
    let multiplierInterval = Math.floor(Math.random() * 3) + 4;

    const balanceEl = document.getElementById('balance');
    const totalBetEl = document.getElementById('total-bet');
    const gridEl = document.getElementById('grid');
    const zeroEl = document.querySelector('.cell-zero');
    const spinBtn = document.getElementById('spin-btn');
    const clearBtn = document.getElementById('clear-btn');
    const repeatBtn = document.getElementById('repeat-btn');
    const statusLog = document.getElementById('status-log');
    const betInput = document.getElementById('bet-amount');
    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');

    function drawWheel() {
        const numPockets = numbersOrder.length;
        const arcSize = (2 * Math.PI) / numPockets;
        const radius = canvas.width / 2;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (let i = 0; i < numPockets; i++) {
            const angle = i * arcSize;
            const num = numbersOrder[i];

            if (num === 0) ctx.fillStyle = '#008000';
            else if (redNumbers.has(num)) ctx.fillStyle = '#b22222';
            else ctx.fillStyle = '#111111';

            ctx.beginPath();
            ctx.arc(radius, radius, radius - 2, angle, angle + arcSize);
            ctx.lineTo(radius, radius);
            ctx.fill();
            ctx.strokeStyle = '#ffd700';
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.save();
            ctx.translate(radius, radius);
            ctx.rotate(angle + arcSize / 2);
            ctx.textAlign = 'right';
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 9px Arial';
            ctx.fillText(num, radius - 6, 3);
            ctx.restore();
        }
    }

    function createGrid() {
        gridEl.innerHTML = '';
        for (let i = 1; i <= 36; i++) {
            const cell = document.createElement('div');
            cell.classList.add('cell');
            cell.classList.add(redNumbers.has(i) ? 'red' : 'black');
            cell.dataset.num = i;
            cell.innerText = i;
            cell.addEventListener('click', () => handleCellClick('num_' + i, cell));
            gridEl.appendChild(cell);
        }
        zeroEl.addEventListener('click', () => handleCellClick('num_0', zeroEl));

        document.querySelectorAll('.cell.side-bet').forEach(cell => {
            const type = cell.dataset.type;
            const val = cell.dataset.val;
            const key = `side_${type}_${val}`;
            cell.addEventListener('click', () => handleCellClick(key, cell));
        });
    }

    function handleCellClick(betKey, element) {
        if (isSpinning) return;
        const betVal = parseInt(betInput.value, 10);
        if (isNaN(betVal) || betVal <= 0) return;

        if (balance < betVal) {
            statusLog.innerHTML = '<span class="loss-text">ناکافی بیلنس!</span>';
            return;
        }

        balance -= betVal;
        bets[betKey] = (bets[betKey] || 0) + betVal;
        updateUI();
    }

    function getTotalBet() {
        return Object.values(bets).reduce((a, b) => a + b, 0);
    }

    function updateUI() {
        balanceEl.innerText = balance;
        totalBetEl.innerText = getTotalBet();

        // Clear chips & badges
        document.querySelectorAll('.chip, .multiplier-badge').forEach(el => el.remove());

        // Place chips on Number Cells
        document.querySelectorAll('.cell[data-num], .cell-zero').forEach(el => {
            const num = el.dataset.num;
            const key = 'num_' + num;

            if (bets[key]) {
                const chip = document.createElement('div');
                chip.className = 'chip';
                chip.innerText = bets[key];
                el.appendChild(chip);
            }

            if (activeMultipliers[num]) {
                const mult = document.createElement('div');
                mult.className = 'multiplier-badge';
                mult.innerText = activeMultipliers[num] + 'x';
                el.appendChild(mult);
            }
        });

        // Place chips on Side Bets
        document.querySelectorAll('.cell.side-bet').forEach(el => {
            const type = el.dataset.type;
            const val = el.dataset.val;
            const key = `side_${type}_${val}`;

            if (bets[key]) {
                const chip = document.createElement('div');
                chip.className = 'chip';
                chip.innerText = bets[key];
                el.appendChild(chip);
            }
        });
    }

    function generateMultipliers() {
        activeMultipliers = {};
        spinCount++;

        if (spinCount >= multiplierInterval) {
            spinCount = 0;
            multiplierInterval = Math.floor(Math.random() * 3) + 4;
            
            const possibleMultipliers = [10, 20, 50, 100];
            const selectedNums = new Set();

            while (selectedNums.size < 3) {
                const randomNum = numbersOrder[Math.floor(Math.random() * numbersOrder.length)];
                selectedNums.add(randomNum);
            }

            selectedNums.forEach(num => {
                const randMult = possibleMultipliers[Math.floor(Math.random() * possibleMultipliers.length)];
                activeMultipliers[num] = randMult;
            });
        }
    }

    spinBtn.addEventListener('click', () => {
        const totalBet = getTotalBet();
        if (totalBet === 0) {
            statusLog.innerHTML = 'گھمانے سے پہلے بیٹ لگائیں!';
            return;
        }

        lastBets = { ...bets };
        isSpinning = true;
        setControlsEnabled(false);

        generateMultipliers();
        updateUI();

        const winIndex = Math.floor(Math.random() * numbersOrder.length);
        const winningNum = numbersOrder[winIndex];

        const numPockets = numbersOrder.length;
        const pocketDegrees = 360 / numPockets;
        
        const targetAngle = 360 - (winIndex * pocketDegrees) - (pocketDegrees / 2) - 90;
        const extraRounds = 360 * 5; 
        currentRotation += extraRounds + (targetAngle - (currentRotation % 360));
        
        canvas.style.transform = `rotate(${currentRotation}deg)`;
        statusLog.innerText = 'گھوم رہا ہے...';

        setTimeout(() => {
            resolveSpin(winningNum, totalBet);
        }, 4000);
    });

    repeatBtn.addEventListener('click', () => {
        if (isSpinning) return;
        const totalLastBet = Object.values(lastBets).reduce((a, b) => a + b, 0);
        
        if (totalLastBet === 0) {
            statusLog.innerText = 'کوئی پچھلی بیٹ موجود نہیں۔';
            return;
        }

        if (balance < totalLastBet) {
            statusLog.innerHTML = '<span class="loss-text">پچھلی بیٹ دہرانے کے لیے ناکافی بیلنس!</span>';
            return;
        }

        balance -= totalLastBet;
        bets = { ...lastBets };
        updateUI();
        statusLog.innerText = 'پچھلی بیٹ لگا دی گئی۔';
    });

    function resolveSpin(winningNum, totalBet) {
        let payout = 0;

        // Straight-up single number bet payout
        const directBet = bets['num_' + winningNum] || 0;
        if (directBet > 0) {
            const multiplier = activeMultipliers[winningNum] || 36;
            payout += directBet * multiplier;
        }

        // Side bets payout checks
        if (winningNum !== 0) {
            const isRed = redNumbers.has(winningNum);
            const isEven = winningNum % 2 === 0;

            // Color bets (1:1 payout + original bet returned = 2x)
            if (isRed && bets['side_color_RED']) payout += bets['side_color_RED'] * 2;
            if (!isRed && bets['side_color_BLACK']) payout += bets['side_color_BLACK'] * 2;

            // Even / Odd (2x payout)
            if (isEven && bets['side_evenodd_EVEN']) payout += bets['side_evenodd_EVEN'] * 2;
            if (!isEven && bets['side_evenodd_ODD']) payout += bets['side_evenodd_ODD'] * 2;

            // Range 1-18 / 19-36 (2x payout)
            if (winningNum >= 1 && winningNum <= 18 && bets['side_range_1-18']) payout += bets['side_range_1-18'] * 2;
            if (winningNum >= 19 && winningNum <= 36 && bets['side_range_19-36']) payout += bets['side_range_19-36'] * 2;

            // Dozens (3x payout)
            if (winningNum >= 1 && winningNum <= 12 && bets['side_dozen_1']) payout += bets['side_dozen_1'] * 3;
            if (winningNum >= 13 && winningNum <= 24 && bets['side_dozen_2']) payout += bets['side_dozen_2'] * 3;
            if (winningNum >= 25 && winningNum <= 36 && bets['side_dozen_3']) payout += bets['side_dozen_3'] * 3;

            // Columns (3x payout)
            const colIndex = ((winningNum - 1) % 3) + 1;
            if (bets[`side_col_${colIndex}`]) payout += bets[`side_col_${colIndex}`] * 3;
        }

        balance += payout;

        let message = `نمبر ${winningNum} پر رکا!<br>`;
        if (payout > 0) {
            message += `<span class="win-text">آپ نے کل $${payout} جیتے۔</span>`;
        } else {
            message += `<span class="loss-text">اس راؤنڈ میں $${totalBet} ہار گئے۔</span>`;
        }
        
        statusLog.innerHTML = message;

        bets = {};
        isSpinning = false;
        setControlsEnabled(true);
        updateUI();
    }

    function setControlsEnabled(enabled) {
        spinBtn.disabled = !enabled;
        clearBtn.disabled = !enabled;
        repeatBtn.disabled = !enabled;
    }

    clearBtn.addEventListener('click', () => {
        if (isSpinning) return;
        balance += getTotalBet();
        bets = {};
        updateUI();
        statusLog.innerText = 'بیٹس ہٹا دی گئیں۔';
    });

    drawWheel();
    createGrid();
</script>
</body>
</html>
