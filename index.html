<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIA Aviator Pro</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }
        body {
            background-color: #050b14;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .game-wrapper {
            width: 90%;
            max-width: 800px;
            background-color: #0d1b2a;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }
        .header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        .balance {
            color: #70e000;
            font-weight: bold;
        }
        canvas {
            background: linear-gradient(to top, #001219, #005f73);
            width: 100%;
            height: 350px;
            border-radius: 10px;
            display: block;
        }
        .controls {
            display: flex;
            gap: 20px;
            margin-top: 15px;
        }
        .bet-panel {
            flex: 1;
            background-color: #1b263b;
            padding: 15px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        input, button {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: none;
        }
        input {
            background: #0d1b2a;
            color: #fff;
            text-align: center;
        }
        .btn-row {
            display: flex;
            gap: 5px;
        }
        .btn-row button {
            flex: 1;
            background: #415a77;
            color: white;
            cursor: pointer;
        }
        .btn-bet {
            background: #00b4d8;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-cashout {
            background: #ffb703;
            color: #000;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <div class="header">
        <h2>PIA Aviator Pro</h2>
        <div>Balance: $<span id="balance" class="balance">1000.00</span></div>
    </div>

    <canvas id="canvas" width="800" height="350"></canvas>

    <div class="controls">
        <div class="bet-panel">
            <label>Bet Amount ($)</label>
            <div class="btn-row">
                <button onclick="changeBet(1, -10)">-10</button>
                <input type="number" id="input-1" value="10">
                <button onclick="changeBet(1, 10)">+10</button>
            </div>
            <button id="btn-1" class="btn-bet" onclick="toggleBet(1)">Place Bet</button>
        </div>
        <div class="bet-panel">
            <label>Bet Amount ($)</label>
            <div class="btn-row">
                <button onclick="changeBet(2, -10)">-10</button>
                <input type="number" id="input-2" value="10">
                <button onclick="changeBet(2, 10)">+10</button>
            </div>
            <button id="btn-2" class="btn-bet" onclick="toggleBet(2)">Place Bet</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let balance = 1000.00;
    let multiplayer = 1.00;
    let gameRunning = false;
    let bets = { 1: { active: false, amount: 0 }, 2: { active: false, amount: 0 } };
    let animationId;
    let startTime;

    function updateUI() {
        document.getElementById('balance').innerText = balance.toFixed(2);
    }

    function changeBet(panel, amount) {
        if (gameRunning) return;
        const input = document.getElementById(`input-${panel}`);
        let val = parseInt(input.value) + amount;
        if (val < 10) val = 10;
        input.value = val;
    }

    function toggleBet(panel) {
        const btn = document.getElementById(`btn-${panel}`);
        const input = document.getElementById(`input-${panel}`);
        
        if (!gameRunning) {
            if (!bets[panel].active) {
                let amount = parseFloat(input.value);
                if (amount > balance || amount <= 0) return;
                balance -= amount;
                bets[panel].amount = amount;
                bets[panel].active = true;
                updateUI();
                btn.innerText = "Cancel";
                btn.className = "btn-cashout";
                
                if (!bets[1].active && !bets[2].active == false) {
                   startGame();
                } else if (bets[1].active && !bets[2].active) {
                    startGame();
                } else if (!bets[1].active && bets[2].active) {
                    startGame();
                }
            } else {
                balance += bets[panel].amount;
                bets[panel].active = false;
                updateUI();
                btn.innerText = "Place Bet";
                btn.className = "btn-bet";
            }
        } else {
            if (bets[panel].active) {
                let payout = bets[panel].amount * multiplayer;
                balance += payout;
                bets[panel].active = false;
                updateUI();
                btn.innerText = "Cashed Out";
                btn.disabled = true;
            }
        }
    }

    function startGame() {
        gameRunning = true;
        multiplayer = 1.00;
        startTime = Date.now();
        document.querySelectorAll('input').forEach(i => i.disabled = true);
        animate();
    }

    function animate() {
        const elapsed = (Date.now() - startTime) / 1000;
        multiplayer = 1.00 + (elapsed * 0.5); // Slow steady growth
        
        // Random crash between 1.5x and 10x
        if (multiplayer > 3.5 && Math.random() < 0.05) {
            endGame(false);
            return;
        }

        draw();
        animationId = requestAnimationFrame(animate);
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Draw text
        ctx.fillStyle = "white";
        ctx.font = "bold 50px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(multiplayer.toFixed(2) + "x", canvas.width/2, canvas.height/2);

        // Simple plane representation
        let x = 100 + (multiplayer * 50);
        let y = 300 - (multiplayer * 30);
        ctx.fillStyle = "#01411C"; // PIA Green
        ctx.fillRect(x, y, 40, 20);
    }

    function endGame(crashed) {
        gameRunning = false;
        cancelAnimationFrame(animationId);
        
        ctx.fillStyle = crashed ? "red" : "orange";
        ctx.fillText(crashed ? "CRASHED" : "ENDED", canvas.width/2, canvas.height/2 + 60);

        setTimeout(() => {
            resetGame();
        }, 3000);
    }

    function resetGame() {
        multiplayer = 1.00;
        document.querySelectorAll('input').forEach(i => i.disabled = false);
        for (let p of [1, 2]) {
            bets[p].active = false;
            const btn = document.getElementById(`btn-${p}`);
            btn.innerText = "Place Bet";
            btn.className = "btn-bet";
            btn.disabled = false;
        }
        draw();
    }

    draw();
</script>

</body>
</html>
