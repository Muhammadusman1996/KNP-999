<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <title>Aviator Clone</title>
    <style>
        body { text-align: center; background: #222; color: white; font-family: sans-serif; }
        canvas { background: #000; display: block; margin: 20px auto; border: 2px solid #555; }
        button { padding: 15px 30px; font-size: 20px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Aviator Game</h1>
    <canvas id="gameCanvas" width="600" height="400"></canvas>
    <div>
        <button id="betBtn">Bet</button>
        <button id="cashoutBtn" disabled>Cash Out</button>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const betBtn = document.getElementById('betBtn');
        const cashoutBtn = document.getElementById('cashoutBtn');

        let multiplier = 1.0;
        let isFlying = false;
        let crashPoint = 1;
        let animationId;
        let planeX = 0;
        let planeY = 300;

        betBtn.addEventListener('click', () => {
            isFlying = false;
            multiplier = 1.0;
            planeX = 0;
            planeY = 300;
            crashPoint = (Math.random() * 5 + 1.1).toFixed(2);
            isFlying = true;
            betBtn.disabled = true;
            cashoutBtn.disabled = false;
            animate();
        });

        cashoutBtn.addEventListener('click', () => {
            if (isFlying) {
                isFlying = false;
                cancelAnimationFrame(animationId);
                alert('You won! Cash out at: ' + multiplier.toFixed(2) + 'x');
                betBtn.disabled = false;
                cashoutBtn.disabled = true;
            }
        });

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw multiplier
            ctx.fillStyle = 'white';
            ctx.font = '40px Arial';
            ctx.fillText(multiplier.toFixed(2) + 'x', 50, 100);

            // Draw plane
            ctx.fillStyle = 'red';
            ctx.fillRect(planeX, planeY, 30, 20);

            if (isFlying) {
                multiplier += 0.02;
                planeX += 2;
                planeY -= 1;

                if (multiplier >= crashPoint) {
                    isFlying = false;
                    ctx.fillStyle = 'red';
                    ctx.fillText('CRASHED', 200, 200);
                    betBtn.disabled = false;
                    cashoutBtn.disabled = true;
                } else {
                    animationId = requestAnimationFrame(animate);
                }
            }
        }
    </script>
</body>
</html>
