<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIA Aviator Pro</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #050b14;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .game-wrapper {
            width: 100%;
            max-width: 900px;
            background-color: #0d1b2a;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border: 1px solid #1b263b;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #1b263b;
            padding-bottom: 15px;
        }
        .header h2 {
            color: #e0e1dd;
            font-size: 24px;
            letter-spacing: 1px;
        }
        .balance-container {
            background-color: #1b263b;
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid #415a77;
        }
        .balance {
            font-size: 20px;
            font-weight: bold;
            color: #70e000;
        }
        .canvas-container {
            position: relative;
            width: 100%;
            height: 400px;
            background: linear-gradient(to top, #001219, #005f73, #94d2bd);
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #1b263b;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .multiplier-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 72px;
            font-weight: 900;
            pointer-events: none;
            text-shadow: 0 0 20px rgba(0,0,0,0.8);
            color: #ffffff;
            z-index: 10;
        }
        .controls-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        .bet-card {
            background-color: #1b263b;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border: 1px solid #415a77;
            transition: border-color 0.3s;
        }
        .bet-card.active-bet {
            border-color: #70e000;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .input-group label {
            font-size: 13px;
            color: #90e0ef;
            font-weight: 600;
        }
        .input-row {
            display: flex;
            gap: 6px;
        }
        input[type="number"] {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #778da9;
            background-color: #0d1b2a;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
        }
        input[type="number"]:focus {
            outline: none;
            border-color: #00b4d8;
        }
        .btn {
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-bet {
            background-color: #00b4d8;
            color: white;
        }
        .btn-bet:hover {
            background-color: #0077b6;
        }
        .btn-cashout {
            background-color: #ffb703;
            color: #000;
        }
        .btn-cashout:hover {
            background-color: #fb8500;
            color: #fff;
        }
        .btn:disabled {
            background-color: #415a77;
            color: #778da9;
            cursor: not-allowed;
        }
        .preset-btns {
            display: flex;
            gap: 4px;
        }
        .btn-sm {
            padding: 6px 10px;
            font-size: 12px;
            background-color: #415a77;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-sm:hover {
            background-color: #778da9;
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <div class="header">
        <h2>PIA Aviator Pro</h2>
        <div class="balance-container">
            Balance: $<span id="user-balance" class="balance">1000.00</span>
        </div>
    </div>

    <div class="canvas-container">
        <canvas id="gameCanvas" width="900" height="400"></canvas>
        <div class="multiplier-overlay" id="multiplier-display">1.00x</div>
    </div>

    <div class="controls-container">
        <!-- Bet Panel 1 -->
        <div class="bet-card" id="card-1">
            <div class="input-group">
                <label>Bet Amount ($)</label>
                <div class="input-row">
                    <button class="btn-sm" onclick="adjustBet(1, -10)">-10</button>
                    <input type="number" id="bet-amount-1" value="10" min="1" step="1">
                    <button class="btn-sm" onclick="adjustBet(1, 10)">+10</button>
                    <button class="btn-sm" onclick="adjustBet(1, 50)">+50</button>
                </div>
            </div>
            <div class="input-group">
                <label>Auto Cashout (x)</label>
                <input type="number" id="auto-cashout-1" placeholder="Disabled" min="1.01" step="0.1">
            </div>
            <button id="btn-action-1" class="btn btn-bet" onclick="handleBetClick(1)">Place Bet</button>
        </div>

        <!-- Bet Panel 2 -->
        <div class="bet-card" id="card-2">
            <div class="input-group">
                <label>Bet Amount ($)</label>
                <div class="input-row">
                    <button class="btn-sm" onclick="adjustBet(2, -10)">-10</button>
                    <input type="number" id="bet-amount-2" value="10" min="1" step="1">
                    <button class="btn-sm" onclick="adjustBet(2, 10)">+10</button>
                    <button class="btn-sm" onclick="adjustBet(2, 50)">+50</button>
                </div>
            </div>
            <div class="input-group">
                <label>Auto Cashout (x)</label>
                <input type="number" id="auto-cashout-2" placeholder="Disabled" min="1.01" step="0.1">
            </div>
            <button id="btn-action-2" class="btn btn-bet" onclick="handleBetClick(2)">Place Bet</button>
        </div>
    </div>
</div>
