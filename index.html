<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIA Aviator Clone</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #0b132b;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .game-wrapper {
            width: 100%;
            max-width: 800px;
            background-color: #1c2541;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.8);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #3a506b;
            padding-bottom: 10px;
        }
        .balance {
            font-size: 18px;
            font-weight: bold;
            color: #4ef037;
        }
        .canvas-container {
            position: relative;
            width: 100%;
            height: 350px;
            background: linear-gradient(180deg, #10002b 0%, #240046 50%, #3c096c 100%);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #5a189a;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .multiplier-overlay {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 60px;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 0 0 20px rgba(0,0,0,0.9);
            color: #ffb703;
        }
        .controls-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }
        .bet-card {
            background-color: #0b132b;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border: 1px solid #1c2541;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .input-group label {
            font-size: 12px;
            color: #7393b3;
        }
        .input-row {
            display: flex;
            gap: 5px;
        }
        input[type="number"] {
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #3a506b;
            background-color: #1c2541;
            color: #fff;
            font-size: 14px;
        }
        .btn {
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-bet {
            background-color: #10b981;
            color: white;
        }
        .btn-bet:hover {
            background-color: #059669;
        }
        .btn-cashout {
            background-color: #f59e0b;
            color: white;
        }
        .btn-cashout:hover {
            background-color: #d97706;
        }
        .btn:disabled {
            background-color: #334155;
            cursor: not-allowed;
            color: #94a3b8;
        }
        .preset-btns {
            display: flex;
            gap: 4px;
        }
        .btn-sm {
            padding: 4px 6px;
            font-size: 12px;
            background-color: #334155;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-sm:hover {
            background-color: #475569;
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <div class="header">
        <h2>PIA Aviator</h2>
        <div class="balance">Balance: $<span id="user-balance">1000.00</span></div>
    </div>

    <div class="canvas-container">
        <canvas id="gameCanvas" width="760" height="350"></canvas>
        <div class="multiplier-overlay" id="multiplier-display">1.00x</div>
    </div>

    <div class="controls-container">
        <!-- Bet Panel 1 -->
        <div class="bet-card">
            <div class="input-group">
                <label>Bet Amount ($)</label>
                <div class="input-row">
                    <button class="btn-sm" onclick="adjustBet(1, -10)">-10</button>
                    <input type="number" id="bet-amount-1" value="10" min="1" step="1">
                    <button class="btn-sm" onclick="adjustBet(1, 10)">+10</button>
                    <button class="btn-sm" onclick="adjustBet(1, 50)">+50</button>
                </div>
            </div>
            <div class="input-group">
                <label>Auto Cashout (x)</label>
                <input type="number" id="auto-cashout-1" placeholder="Disabled" min="1.01" step="0.1">
            </div>
            <button id="btn-action-1" class="btn btn-bet" onclick="handleBetClick(1)">BET</button>
        </div>

        <!-- Bet Panel 2 -->
        <div class="bet-card">
            <div class="input-group">
                <label>Bet Amount ($)</label>
                <div class="input-row">
                    <button class="btn-sm" onclick="adjustBet(2, -10)">-10</button>
                    <input type="number" id="bet-amount-2" value="10" min="1" step="1">
                    <button class="btn-sm" onclick="adjustBet(2, 10)">+10</button>
                    <button class="btn-sm" onclick="adjustBet(2, 50)">+50</button>
                </div>
            </div>
            <div class="input-group">
                <label>Auto Cashout (x)</label>
                <input type="number" id="auto-cashout-2" placeholder="Disabled" min="1.01" step="0.1">
            </div>
            <button id="btn-action-2" class="btn btn-bet" onclick="handleBetClick(2)">BET</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const multiplierDisplay = document.getElementById('multiplier-display');
    const balanceDisplay = document.getElementById('user-balance');

    let balance = 1000.00;
    let multiplier = 1.00;
    let crashPoint = 0;
    let gameState = 'IDLE'; // IDLE, RUNNING, CRASHED
    let animationFrameId = null;
    let startTime = null;

    const bets = {
        1: { active: false, amount: 0, cashedOut: false, auto: null },
        2: { active: false, amount: 0, cashedOut: false, auto: null }
    };

    function adjustBet(panel, value) {
        if (gameState === 'RUNNING') return;
        const input = document.getElementById(`bet-amount-${panel}`);
        const currentVal = parseFloat(input.value || 0);
        input.value = Math.max(1, currentVal + value);
    }

    function handleBetClick(panel) {
        const btn = document.getElementById(`btn-action-${panel}`);
        const amountInput = document.getElementById(`bet-amount-${panel}`);
        const autoInput = document.getElementById(`auto-cashout-${panel}`);

        if (gameState === 'RUNNING') {
            if (bets[panel].active && !bets[panel].cashedOut) {
                cashOut(panel);
            }
            return;
        }

        if (!bets[panel].active) {
            const amount = parseFloat(amountInput.value);
            if (isNaN(amount) || amount <= 0 || amount > balance) return;

            balance -= amount;
            updateBalance();

            bets[panel].active = true;
            bets[panel].amount = amount;
            bets[panel].cashedOut = false;
            bets[panel].auto = parseFloat(autoInput.value) || null;

            btn.innerText = 'CANCEL';
            btn.classList.remove('btn-bet');
            btn.classList.add('btn-cashout');
        } else {
            balance += bets[panel].amount;
            updateBalance();

            bets[panel].active = false;
            btn.innerText = 'BET';
            btn.classList.remove('btn-cashout');
            btn.classList.add('btn-bet');
        }
    }

    function startRound() {
        if (!bets[1].active && !bets[2].active) return;
        gameState = 'RUNNING';
        multiplier = 1.00;
        crashPoint = generateCrashPoint();
        startTime = performance.now();

        [1, 2].forEach(panel => {
            document.getElementById(`bet-amount-${panel}`).disabled = true;
            document.getElementById(`auto-cashout-${panel}`).disabled = true;

            const btn = document.getElementById(`btn-action-${panel}`);
            if (bets[panel].active) {
                btn.innerText = 'CASH OUT';
                btn.classList.remove('btn-bet');
                btn.classList.add('btn-cashout');
            } else {
                btn.disabled = true;
                btn.innerText = 'MISSED';
            }
        });

        multiplierDisplay.style.color = '#ffb703';
        requestAnimationFrame(updateGame);
    }

    function generateCrashPoint() {
        const e = 2 ** 32;
        const h = crypto.getRandomValues(new Uint32Array(1))[0];
        if (h % 33 === 0) return 1.00;
        return Math.max(1.00, parseFloat(((100 * e - h) / (e - h) / 100).toFixed(2)));
    }

    function cashOut(panel) {
        if (!bets[panel].active || bets[panel].cashedOut || gameState !== 'RUNNING') return;

        bets[panel].cashedOut = true;
        const winnings = bets[panel].amount * multiplier;
        balance += winnings;
        updateBalance();

        const btn = document.getElementById(`btn-action-${panel}`);
        btn.innerText = `SOLD (${multiplier.toFixed(2)}x)`;
        btn.disabled = true;
    }

    function updateGame(timestamp) {
        const elapsed = (timestamp - startTime) / 1000;
        multiplier = Math.pow(Math.E, 0.06 * elapsed);

        [1, 2].forEach(panel => {
            if (bets[panel].active && !bets[panel].cashedOut && bets[panel].auto) {
                if (multiplier >= bets[panel].auto) {
                    cashOut(panel);
                }
            }
        });

        if (multiplier >= crashPoint) {
            endRound();
            return;
        }

        multiplierDisplay.innerText = `${multiplier.toFixed(2)}x`;
        renderCanvas();
        animationFrameId = requestAnimationFrame(updateGame);
    }

    function endRound() {
        gameState = 'CRASHED';
        multiplierDisplay.innerText = `FLAPPED @ ${crashPoint.toFixed(2)}x`;
        multiplierDisplay.style.color = '#ef4444';

        renderCanvas(true);

        setTimeout(() => {
            resetInterfaces();
        }, 3000);
    }

    function resetInterfaces() {
        gameState = 'IDLE';
        multiplierDisplay.innerText = '1.00x';
        multiplierDisplay.style.color = '#ffb703';
        clearCanvas();

        [1, 2].forEach(panel => {
            const btn = document.getElementById(`btn-action-${panel}`);
            btn.innerText = 'BET';
            btn.classList.remove('btn-cashout');
            btn.classList.add('btn-bet');
            btn.disabled = false;

            document.getElementById(`bet-amount-${panel}`).disabled = false;
            document.getElementById(`auto-cashout-${panel}`).disabled = false;

            bets[panel].active = false;
            bets[panel].cashedOut = false;
        });
    }

    function renderCanvas(crashed = false) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        drawBackground();

        const progress = Math.min(1, (multiplier - 1) / 10);
        const startX = 50;
        const startY = canvas.height - 50;
        const endX = startX + (canvas.width - 150) * progress;
        const endY = startY - (canvas.height - 150) * progress;

        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.quadraticCurveTo(endX * 0.5, startY, endX, endY);
        ctx.strokeStyle = crashed ? '#ef4444' : '#00a8cc';
        ctx.lineWidth = 5;
        ctx.setLineDash([10, 10]);
        ctx.stroke();
        ctx.setLineDash([]);

        if (!crashed) {
            drawPIAPlane(endX, endY, progress);
        } else {
            drawCrashSite(endX, endY);
        }
    }

    function drawBackground() {
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(100, 50, 2, 2);
        ctx.fillRect(300, 80, 3, 3);
        ctx.fillRect(500, 40, 2, 2);
        ctx.fillRect(650, 100, 4, 4);
        ctx.fillRect(200, 200, 2, 2);
        ctx.fillRect(700, 250, 3, 3);

        ctx.beginPath();
        ctx.arc(700, 80, 30, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255, 255, 255, 0.1)";
        ctx.fill();
    }

    function drawPIAPlane(x, y, progress) {
        ctx.save();
        ctx.translate(x, y);
        
        const angle = -Math.PI / 6 + (progress * Math.PI / 12);
        ctx.rotate(angle);

        const planeWidth = 60;
        const planeHeight = 20;

        ctx.fillStyle = "#FFFFFF";
        ctx.beginPath();
        ctx.ellipse(0, 0, planeWidth/2, planeHeight/2, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#01411C";
        ctx.beginPath();
        ctx.moveTo(-planeWidth/2 + 5, 0);
        ctx.lineTo(-planeWidth/2 - 15, -15);
        ctx.lineTo(-planeWidth/2 + 5, -15);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = "#000000";
        ctx.fillRect(planeWidth/4, -5, 5, 5);

        ctx.strokeStyle = "#E31D2B";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-planeWidth/4, 2);
        ctx.lineTo(planeWidth/4, 2);
        ctx.stroke();

        ctx.restore();
    }

    function drawCrashSite(x, y) {
        ctx.fillStyle = "#ef4444";
        ctx.beginPath();
        ctx.arc(x, y, 40, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.fillStyle = "#f97316";
        ctx.beginPath();
        ctx.arc(x, y, 20, 0, Math.PI * 2);
        ctx.fill();
    }

    function clearCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function updateBalance() {
        balanceDisplay.innerText = balance.toFixed(2);
    }
</script>

</body>
</html>
