<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money Coming Game</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body {
            background-color: #1a0000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .game-container {
            width: 100%;
            max-width: 400px;
            background: radial-gradient(circle, #590000, #1a0000);
            border: 6px solid #d4af37;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 0 30px #d4af37;
        }
        .header h1 {
            color: #e50914;
            text-shadow: 0 0 10px #ff0055;
            margin-bottom: 10px;
        }
        .wheel-container {
            position: relative;
            width: 250px;
            height: 250px;
            margin: 10px auto;
            border-radius: 50%;
            border: 8px solid #d4af37;
            overflow: hidden;
            background: conic-gradient(#2e7d32 0deg 90deg, #c62828 90deg 180deg, #2e7d32 180deg 270deg, #fbc02d 270deg 360deg);
            box-shadow: inset 0 0 20px #000;
        }
        .wheel-container.spinning {
            animation: spinWheel 2s linear infinite;
        }
        @keyframes spinWheel {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .wheel-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #d4af37;
            font-weight: bold;
            padding: 20px;
            text-align: center;
            border-radius: 50%;
            border: 4px dashed #d4af37;
        }
        .wheel-overlay.unlocked { display: none; }
        .chain-gfx {
            position: absolute;
            width: 100%; height: 100%;
            background: repeating-linear-gradient(45deg, transparent, transparent 20px, rgba(212,175,55,0.3) 20px, rgba(212,175,55,0.3) 40px);
        }
        .reels-container {
            display: flex;
            justify-content: space-around;
            background: #0d0d0d;
            padding: 15px;
            border-radius: 10px;
            border: 3px solid #d4af37;
            margin: 15px 0;
        }
        .reel {
            width: 20%;
            height: 70px;
            background: linear-gradient(180deg, #004d40, #00796b);
            border: 2px solid #d4af37;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            font-weight: bold;
            color: #ffd700;
            position: relative;
            text-shadow: 0 0 5px #000;
        }
        .reel.locked::after {
            content: '🔒';
            position: absolute;
            font-size: 20px;
            background: rgba(0,0,0,0.6);
            width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 6px;
        }
        .status-panel {
            background: #4a0e0e;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #d4af37;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-around;
            font-weight: bold;
        }
        .status-panel span { color: #ffd700; }
        .bet- tiers {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .bet-btn {
            background: #b71c1c;
            color: #fff;
            border: 2px solid #d4af37;
            padding: 10px 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        .bet-btn.active {
            background: #d4af37;
            color: #000;
            transform: scale(1.1);
        }
        .action-panel {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .spin-btn {
            flex: 2;
            background: linear-gradient(90deg, #2e7d32, #4caf50);
            color: white;
            border: 3px solid #d4af37;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px #1b5e20;
        }
        .auto-btn {
            flex: 1;
            background: #f57c00;
            color: white;
            border: 2px solid #d4af37;
            padding: 15px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
        }
        .auto-btn.active { background: #e65100; border-color: #fff; }
    </style>
</head>
<body>

<div class="game-container">
    <div class="header">
        <h1>Money Coming</h1>
    </div>

    <div class="wheel-container" id="mainWheel">
        <div class="chain-gfx"></div>
        <div id="wheelOverlay" class="wheel-overlay">
            <span>Bet 5 Up Game</span>
            <span>To unlock Lucky Wheel</span>
        </div>
    </div>

    <div class="reels-container">
        <div class="reel" id="r1">1</div>
        <div class="reel" id="r2">0</div>
        <div class="reel" id="r3">0</div>
        <div class="reel locked" id="r4">?</div>
    </div>

    <div class="status-panel">
        <div>BALANCE: <span id="balDisplay">100</span></div>
        <div>WIN: <span id="winDisplay">0</span></div>
    </div>

    <div class="bet- tiers">
        <button class="bet-btn active" onclick="setBet(1, this)">Bet 1</button>
        <button class="bet-btn" onclick="setBet(5, this)">Bet 5</button>
        <button class="bet-btn" onclick="setBet(10, this)">Bet 10</button>
    </div>

    <div class="action-panel">
        <button class="spin-btn" id="spinBtn" onclick="spinGame()">SPIN</button>
        <button class="auto-btn" id="autoBtn" onclick="toggleAuto()">AUTO</button>
    </div>
</div>

<script>
    let balance = 100;
    let currentBet = 1;
    let isAuto = false;
    let autoInterval = null;
    const symbols = ['1', '5', '10', '50', '100', '777'];

    function setBet(amount, btnElement) {
        currentBet = amount;
        document.querySelectorAll('.bet-btn').forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');
        
        const overlay = document.getElementById('wheelOverlay');
        const r4 = document.getElementById('r4');
        const wheel = document.getElementById('mainWheel');

        if(currentBet >= 5) {
            overlay.classList.add('unlocked');
            r4.classList.remove('locked');
            r4.innerText = '50';
        } else {
            overlay.classList.remove('unlocked');
            r4.classList.add('locked');
            r4.innerText = '?';
            wheel.classList.remove('spinning');
        }
    }

    function toggleAuto() {
        isAuto = !isAuto;
        const autoBtn = document.getElementById('autoBtn');
        if(isAuto) {
            autoBtn.classList.add('active');
            autoInterval = setInterval(spinGame, 2000);
        } else {
            autoBtn.classList.remove('active');
            clearInterval(autoInterval);
        }
    }

    function spinGame() {
        if(balance < currentBet) {
            alert("Balance khatam ho gaya!");
            if(isAuto) toggleAuto();
            return;
        }

        balance -= currentBet;
        document.getElementById('balDisplay').innerText = balance;
        
        const wheel = document.getElementById('mainWheel');
        if(currentBet >= 5) wheel.classList.add('spinning');

        setTimeout(() => {
            if(currentBet >= 5) wheel.classList.remove('spinning');
            
            let s1 = symbols[Math.floor(Math.random() * symbols.length)];
            let s2 = symbols[Math.floor(Math.random() * symbols.length)];
            let s3 = symbols[Math.floor(Math.random() * symbols.length)];
            let s4 = currentBet >= 5 ? symbols[Math.floor(Math.random() * symbols.length)] : '?';

            document.getElementById('r1').innerText = s1;
            document.getElementById('r2').innerText = s2;
            document.getElementById('r3').innerText = s3;
            if(currentBet >= 5) document.getElementById('r4').innerText = s4;

            let winnings = 0;
            if(s1 === s2 && s2 === s3) {
                winnings = currentBet * 10;
            } else if(s1 === '777' || s2 === '777' || s3 === '777') {
                winnings = currentBet * 5;
            }

            balance += winnings;
            document.getElementById('balDisplay').innerText = balance;
            document.getElementById('winDisplay').innerText = winnings;
        }, 1500);
    }
</script>

</body>
</html>
