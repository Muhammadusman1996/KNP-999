<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money Coming Game</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body {
            background-color: #1a0000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .game-container {
            width: 100%;
            max-width: 400px;
            background: radial-gradient(circle, #590000, #1a0000);
            border: 6px solid #d4af37;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 0 30px #d4af37;
        }
        .header h1 {
            color: #e50914;
            text-shadow: 0 0 10px #ff0055;
            margin-bottom: 10px;
        }
        .wheel-container {
            position: relative;
            width: 240px;
            height: 240px;
            margin: 10px auto;
            border-radius: 50%;
            border: 8px solid #d4af37;
            overflow: hidden;
            background: conic-gradient(
                #2e7d32 0deg 90deg, 
                #c62828 90deg 180deg, 
                #f57c00 180deg 270deg, 
                #fbc02d 270deg 360deg
            );
            box-shadow: inset 0 0 20px #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .wheel-inner {
            width: 85%;
            height: 85%;
            border-radius: 50%;
            border: 4px dashed #ffd700;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffd700;
            font-weight: bold;
            text-shadow: 1px 1px 2px #000;
        }
        .wheel-container.spinning {
            animation: spinWheel 0.5s linear infinite;
        }
        @keyframes spinWheel {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .wheel-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #d4af37;
            font-weight: bold;
            z-index: 10;
            border-radius: 50%;
            padding: 10px;
            text-align: center;
        }
        .wheel-overlay.unlocked { display: none; }
        
        .multiplier-badge {
            position: absolute;
            background: #ffd700;
            color: #000;
            padding: 4px 8px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            display: none;
        }
        .wheel-container.unlocked .multiplier-badge { display: block; }
        #mult-2x { top: 22%; left: 22%; }
        #mult-5x { top: 22%; right: 22%; }
        #mult-free { bottom: 22%; }

        .reels-container {
            display: flex;
            justify-content: space-around;
            background: #000;
            padding: 15px;
            border-radius: 10px;
            border: 3px solid #d4af37;
            margin: 15px 0;
        }
        .reel {
            width: 22%;
            height: 70px;
            background: linear-gradient(180deg, #004d40, #00796b);
            border: 2px solid #d4af37;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            color: #ffd700;
            position: relative;
        }
        .reel.locked {
            filter: grayscale(100%) brightness(0.3);
            color: #555;
        }
        .reel.locked::after {
            content: '🔒';
            position: absolute;
            font-size: 24px;
            background: rgba(0,0,0,0.8);
            width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 6px;
        }
        .status-panel {
            background: #4a0e0e;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #d4af37;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-around;
            font-size: 16px;
            font-weight: bold;
        }
        .status-panel span { color: #ffd700; }
        
        .bet-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            background: #3a0d0d;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #d4af37;
        }
        .bet-btn {
            background: #b71c1c;
            color: #fff;
            border: 2px solid #ffd700;
            width: 50px;
            height: 50px;
            font-size: 28px;
            font-weight: bold;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .bet-btn:active { transform: scale(0.95); }
        #betDisplay {
            font-size: 32px;
            color: #ffd700;
            min-width: 60px;
        }
        
        .action-panel { display: flex; gap: 10px; }
        .spin-btn {
            flex: 2;
            background: linear-gradient(180deg, #4caf50, #1b5e20);
            color: white;
            border: 3px solid #ffd700;
            padding: 15px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px #1b5e20;
        }
        .spin-btn:active { transform: translateY(4px); }
        .auto-btn {
            flex: 1;
            background: #e65100;
            color: white;
            border: 3px solid #ffd700;
            padding: 15px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
        }
        .auto-btn.active { background: #ff5722; border-color: #fff; }
    </style>
</head>
<body>

<div class="game-container">
    <div class="header">
        <h1>Money Coming</h1>
    </div>

    <div class="wheel-container" id="mainWheel">
        <div id="wheelOverlay" class="wheel-overlay">
            <span style="font-size: 16px;">Bet 50 Up Game</span>
            <span style="font-size: 14px;">To unlock Lucky Wheel</span>
        </div>
        <div class="multiplier-badge" id="mult-2x">2X</div>
        <div class="multiplier-badge" id="mult-5x">5X</div>
        <div class="multiplier-badge" id="mult-free">FREE</div>
        <div class="wheel-inner">
            <span>LUCKY</span><span>WHEEL</span>
        </div>
    </div>

    <div class="reels-container">
        <div class="reel" id="r1">1</div>
        <div class="reel" id="r2">0</div>
        <div class="reel" id="r3">0</div>
        <div class="reel locked" id="r4">50</div>
    </div>

    <div class="status-panel">
        <div>BALANCE: <span id="balDisplay">100</span></div>
        <div>WIN: <span id="winDisplay">0</span></div>
    </div>

    <div class="bet-controls">
        <button class="bet-btn" onclick="adjustBet(-5)">-</button>
        <div>BET: <span id="betDisplay">5</span></div>
        <button class="bet-btn" onclick="adjustBet(5)">+</button>
    </div>

    <div class="action-panel">
        <button class="spin-btn" id="spinBtn" onclick="spinGame()">SPIN</button>
        <button class="auto-btn" id="autoBtn" onclick="toggleAuto()">AUTO</button>
    </div>
</div>

<script>
    let balance = 100;
    let currentBet = 5;
    let isAuto = false;
    let autoInterval = null;
    let isSpinning = false;
    const symbols = ['1', '5', '10', '50', '100', '777', 'ALL'];

    function adjustBet(amount) {
        if (isSpinning) return;
        let newBet = currentBet + amount;
        if (newBet < 5) newBet = 5;
        currentBet = newBet;
        document.getElementById('betDisplay').innerText = currentBet;
        updateUI();
    }

    function updateUI() {
        const overlay = document.getElementById('wheelOverlay');
        const wheel = document.getElementById('mainWheel');
        const r4 = document.getElementById('r4');

        if(currentBet >= 50) {
            overlay.classList.add('unlocked');
            wheel.classList.add('unlocked');
            r4.classList.remove('locked');
            r4.innerText = '50';
        } else {
            overlay.classList.remove('unlocked');
            wheel.classList.remove('unlocked');
            r4.classList.add('locked');
            r4.innerText = '50';
            wheel.classList.remove('spinning');
        }
    }

    function toggleAuto() {
        isAuto = !isAuto;
        const btn = document.getElementById('autoBtn');
        btn.classList.toggle('active', isAuto);
        if(isAuto && !isSpinning) spinGame();
        else if(!isAuto) clearInterval(autoInterval);
    }

    function spinGame() {
        if(isSpinning || balance < currentBet) {
            if(balance < currentBet && !isSpinning) alert("Balance khatam ho gaya!");
            return;
        }

        isSpinning = true;
        balance -= currentBet;
        document.getElementById('balDisplay').innerText = balance;
        document.getElementById('winDisplay').innerText = "0";
        
        const wheel = document.getElementById('mainWheel');
        if(currentBet >= 50) wheel.classList.add('spinning');

        document.querySelectorAll('.reel').forEach(r => r.innerText = '...');

        setTimeout(() => {
            if(currentBet >= 50) wheel.classList.remove('spinning');
            
            let s1 = symbols[Math.floor(Math.random() * symbols.length)];
            let s2 = symbols[Math.floor(Math.random() * symbols.length)];
            let s3 = symbols[Math.floor(Math.random() * symbols.length)];
            let s4 = currentBet >= 50 ? symbols[Math.floor(Math.random() * symbols.length)] : '50';

            document.getElementById('r1').innerText = s1;
            document.getElementById('r2').innerText = s2;
            document.getElementById('r3').innerText = s3;
            document.getElementById('r4').innerText = s4;

            calculate(s1, s2, s3, s4);
        }, 1000);
    }

    function calculate(s1, s2, s3, s4) {
        if(s1 === 'ALL' || s2 === 'ALL' || s3 === 'ALL') {
            document.getElementById('winDisplay').innerText = "ALL TRIGGERED!";
            setTimeout(spinGame, 1000);
            return;
        }

        let win = 0;
        if(s1 === s2 && s2 === s3) {
            win = currentBet * (s1 === '777' ? 50 : 10);
        }

        if(win > 0 && currentBet >= 50) {
            let mults = [1, 2, 5];
            let m = mults[Math.floor(Math.random() * mults.length)];
            win *= m;
            if(m > 1) alert(m + "X MULTIPLIER HIT!");
        }

        balance += win;
        document.getElementById('balDisplay').innerText = balance;
        document.getElementById('winDisplay').innerText = win;
        isSpinning = false;

        if(isAuto && balance >= currentBet) {
            autoInterval = setTimeout(spinGame, 1000);
        } else if(isAuto) {
            toggleAuto();
        }
    }
    updateUI();
</script>

</body>
</html>
