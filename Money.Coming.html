<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money Coming Game</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body {
            background-color: #112219;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .game-container {
            width: 100%;
            max-width: 400px;
            background: radial-gradient(circle, #2a4d3c, #112219);
            border: 8px solid #d4af37;
            border-radius: 25px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 0 40px #d4af37, inset 0 0 20px #000;
        }
        .wheel-outer {
            position: relative;
            width: 250px;
            height: 250px;
            margin: 10px auto;
            border-radius: 50%;
            border: 10px solid #d4af37;
            box-shadow: 0 0 20px rgba(0,0,0,0.8), inset 0 0 15px #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .wheel-pie {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(
                #2e7d32 0deg 60deg,
                #1b5e20 60deg 120deg,
                #2e7d32 120deg 180deg,
                #1b5e20 180deg 240deg,
                #2e7d32 240deg 300deg,
                #1b5e20 300deg 360deg
            );
        }
        .wheel-inner {
            position: relative;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, #2e7d32, #0d3b12);
            border: 6px dashed #ffd700;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 10px #000;
        }
        .wheel-inner h2 {
            font-size: 16px;
            color: #ffd700;
            text-shadow: 1px 1px 2px #000;
            line-height: 1.2;
        }
        .wheel-container.spinning { animation: spinWheel 0.2s linear infinite; }
        @keyframes spinWheel { 100% { transform: rotate(360deg); } }

        .segment-label {
            position: absolute;
            font-weight: bold;
            font-size: 14px;
            color: #ffd700;
            text-shadow: 1px 1px 2px #000;
        }
        #seg-50 { top: 15%; }
        #seg-100 { bottom: 15%; }
        #seg-200 { right: 20%; }
        #seg-300 { left: 20%; }
        #seg-500 { top: 35%; right: 15%; }
        #seg-2000 { bottom: 35%; left: 15%; }

        .slots-wrapper {
            background: #112219;
            padding: 12px;
            border-radius: 15px;
            border: 4px solid #d4af37;
            margin: 15px 0;
            box-shadow: inset 0 0 15px #000;
            display: flex;
            justify-content: space-around;
        }
        .slot-reel {
            width: 22%;
            height: 70px;
            background: linear-gradient(180deg, #1b5e21, #0a3a12);
            border: 3px solid #ffd700;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 8px #000;
            box-shadow: 0 4px 5px rgba(0,0,0,0.5);
        }
        .slot-reel.locked {
            background: #081a0d;
            color: #4a5d51;
            border-color: #2b4535;
            position: relative;
        }
        .slot-reel.locked::after { content: '🔒'; font-size: 24px; }

        .info-panel {
            background: linear-gradient(180deg, #112219, #0a110c);
            border: 2px solid #d4af37;
            border-radius: 10px;
            padding: 8px;
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 16px;
        }
        .info-panel span { color: #ffd700; }

        .bet-control-panel {
            background: linear-gradient(180deg, #112219, #0a110c);
            border: 3px solid #d4af37;
            border-radius: 15px;
            padding: 10px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-bottom: 15px;
        }
        .round-btn {
            background: linear-gradient(180deg, #2e7d32, #1b5e20);
            color: white;
            border: 3px solid #ffd700;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px #000;
        }
        .round-btn:active { transform: translateY(4px); box-shadow: none; }
        #bet-amount {
            font-size: 36px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 10px #2e7d32;
            min-width: 80px;
        }

        .action-container { display: flex; gap: 15px; }
        .action-btn {
            flex: 1;
            padding: 15px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 40px;
            cursor: pointer;
            border: 4px solid #ffd700;
            color: white;
            text-shadow: 0 2px 4px #000;
            box-shadow: 0 5px #000;
        }
        .action-btn:active { transform: translateY(5px); box-shadow: none; }
        #spin-btn { background: linear-gradient(180deg, #ff8f00, #d84315); flex: 2; }
        #auto-btn { background: linear-gradient(180deg, #2e7d32, #1b5e20); }
    </style>
</head>
<body>

<div class="game-container">
    <div class="wheel-outer" id="main-wheel">
        <div class="wheel-pie"></div>
        <div class="segment-label" id="seg-50">50</div>
        <div class="segment-label" id="seg-100">100</div>
        <div class="segment-label" id="seg-200">200</div>
        <div class="segment-label" id="seg-300">300</div>
        <div class="segment-label" id="seg-500">500</div>
        <div class="segment-label" id="seg-2000">2000</div>
        <div class="wheel-inner">
            <h2>LUCKY<br>WHEEL</h2>
        </div>
    </div>

    <div class="slots-wrapper">
        <div class="slot-reel" id="slot-1">5</div>
        <div class="slot-reel" id="slot-2">50</div>
        <div class="slot-reel" id="slot-3">10</div>
        <div class="slot-reel locked" id="slot-4"></div>
    </div>

    <div class="info-panel">
        <div>BALANCE: <span id="bal-txt">100</span></div>
        <div>WIN: <span id="win-txt">0</span></div>
    </div>

    <div class="bet-control-panel">
        <button class="round-btn" onclick="updateBet(-5)">-</button>
        <div id="bet-amount">5</div>
        <button class="round-btn" onclick="updateBet(5)">+</button>
    </div>

    <div class="action-container">
        <button class="action-btn" id="spin-btn" onclick="executeSpin()">SPIN</button>
        <button class="action-btn" id="auto-btn" onclick="toggleAuto()">AUTO</button>
    </div>
</div>

<script>
    let userBalance = 100;
    let currentBet = 5;
    let isSpinning = false;
    let autoMode = false;
    let autoTimer = null;
    const symbols = ['1', '5', '10', '50', '100', '777', 'ALL'];

    function updateBet(val) {
        if(isSpinning) return;
        currentBet = Math.max(5, currentBet + val);
        document.getElementById('bet-amount').innerText = currentBet;
        refreshLockState();
    }

    function refreshLockState() {
        const slot4 = document.getElementById('slot-4');
        if(currentBet >= 50) {
            slot4.classList.remove('locked');
            slot4.innerText = '50';
        } else {
            slot4.classList.add('locked');
            slot4.innerText = '';
        }
    }

    function toggleAuto() {
        autoMode = !autoMode;
        const btn = document.getElementById('auto-btn');
        btn.style.background = autoMode ? '#b71c1c' : 'linear-gradient(180deg, #2e7d32, #1b5e20)';
        if(autoMode && !isSpinning) executeSpin();
        else if(!autoMode) { clearTimeout(autoTimer); }
    }

    function executeSpin() {
        if(isSpinning) return;
        if(userBalance < currentBet) {
            alert("Balance khatam ho gaya!");
            if(autoMode) toggleAuto();
            return;
        }

        isSpinning = true;
        userBalance -= currentBet;
        document.getElementById('bal-txt').innerText = userBalance;
        document.getElementById('win-txt').innerText = "0";
        
        document.getElementById('main-wheel').classList.add('spinning');
        document.querySelectorAll('.slot-reel').forEach(r => {
            if(!r.classList.contains('locked')) r.innerText = '...';
        });

        setTimeout(() => {
            document.getElementById('main-wheel').classList.remove('spinning');
            
            let s1 = symbols[Math.floor(Math.random() * symbols.length)];
            let s2 = symbols[Math.floor(Math.random() * symbols.length)];
            let s3 = symbols[Math.floor(Math.random() * symbols.length)];
            let s4 = currentBet >= 50 ? symbols[Math.floor(Math.random() * symbols.length)] : '';

            document.getElementById('slot-1').innerText = s1;
            document.getElementById('slot-2').innerText = s2;
            document.getElementById('slot-3').innerText = s3;
            if(currentBet >= 50) document.getElementById('slot-4').innerText = s4;

            evaluateWin(s1, s2, s3, s4);
            isSpinning = false;

            if(autoMode) {
                if(userBalance >= currentBet) {
                    autoTimer = setTimeout(executeSpin, 800);
                } else {
                    toggleAuto();
                }
            }
        }, 1200);
    }

    function evaluateWin(s1, s2, s3, s4) {
        let payout = 0;
        if(s1 === 'ALL' || s2 === 'ALL' || s3 === 'ALL' || s4 === 'ALL') {
            document.getElementById('win-txt').innerText = "ALL TRIGGERED!";
            setTimeout(executeSpin, 1000);
            return;
        }

        if(s1 === s2 && s2 === s3) {
            let multiplier = (s1 === '777') ? 50 : (s1 === '100') ? 20 : 10;
            payout = currentBet * multiplier;
        }

        if(payout > 0 && currentBet >= 50) {
            const wheelMults = [1, 2, 5];
            const selectedMult = wheelMults[Math.floor(Math.random() * wheelMults.length)];
            payout *= selectedMult;
            if(selectedMult > 1) alert(selectedMult + "X Wheel Multiplier Applied!");
        }

        userBalance += payout;
        document.getElementById('bal-txt').innerText = userBalance;
        document.getElementById('win-txt').innerText = payout;
    }
</script>

</body>
</html>
