<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money Coming Slot Game</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #121212;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .game-container {
            width: 360px;
            background: linear-gradient(180deg, #500 0%, #1a0000 100%);
            border: 4px solid #ffd700;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
        }
      @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
.spinning {
    animation: spin 2s linear infinite;
}
        .header h1 {
            color: #ff3333;
            font-size: 24px;
            text-shadow: 0 0 5px #fff;
        }
        .wheel-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 15px auto;
            border-radius: 50%;
            border: 6px solid #ffd700;
            overflow: hidden;
            background: conic-gradient(#4caf50 0deg 90deg, #f44336 90deg 180deg, #4caf50 180deg 270deg, #ffeb3b 270deg 360deg);
        }
        .wheel-lock {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffd700;
            font-weight: bold;
            font-size: 14px;
            padding: 10px;
        }
        .wheel-lock.unlocked { display: none; }
        .reels-container {
            display: flex;
            justify-content: space-between;
            background: #000;
            padding: 10px;
            border-radius: 8px;
            border: 2px solid #ffd700;
            margin-bottom: 15px;
        }
        .reel {
            width: 22%;
            height: 60px;
            background: #222;
            border: 1px solid #444;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            color: #ffd700;
            position: relative;
        }
        .reel.locked::after {
            content: '🔒';
            position: absolute;
            font-size: 14px;
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .bet-info {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }
        .spin-btn {
            background: linear-gradient(180deg, #4caf50 0%, #2e7d32 100%);
            color: white;
            border: none;
            padding: 12px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
        }
        .spin-btn:disabled { background: #555; }
        .bet-buttons {
            display: flex;
            justify-content: space-around;
        }
        .bet-btn {
            background: #ffd700;
            color: #000;
            border: none;
            padding: 6px 12px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>Money Coming</h1>
        </div>
        <div class="wheel-container">
            <div id="wheelLock" class="wheel-lock">Bet 5 to Unlock Lucky Wheel</div>
        </div>
        <div class="reels-container">
            <div class="reel" id="reel1">1</div>
            <div class="reel" id="reel2">0</div>
            <div class="reel" id="reel3">0</div>
            <div class="reel locked" id="reel4">?</div>
        </div>
        <div class="controls">
            <div class="bet-info">
                <span>Balance: Rs <span id="balance">100</span></span>
                <span>Win: Rs <span id="winDisplay">0</span></span>
            </div>
            <div class="bet-buttons">
                <button class="bet-btn" onclick="setBet(1)">Bet Rs 1</button>
                <button class="bet-btn" onclick="setBet(5)">Bet Rs 5</button>
                <button class="bet-btn" onclick="setBet(10)">Bet Rs 10</button>
            </div>
            <button id="spinBtn" class="spin-btn" onclick="spin()">SPIN (Bet: Rs <span id="currentBet">1</span>)</button>
        </div>
    </div>

    <script>
        let balance = 100;
        let bet = 1;
        const symbols = ['0', '1', '5', '10', '50', '100'];

        function setBet(amount) {
            bet = amount;
            document.getElementById('currentBet').innerText = bet;
            const wheelLock = document.getElementById('wheelLock');
            const reel4 = document.getElementById('reel4');
            
            if (bet >= 5) {
                wheelLock.classList.add('unlocked');
                reel4.classList.remove('locked');
            } else {
                wheelLock.classList.remove('unlocked');
                reel4.classList.add('locked');
            }
        }

        function spin() {
            if (balance < bet) {
                alert("Insufficient Balance!");
                return;
            }
            balance -= bet;
            document.getElementById('balance').innerText = balance;
            
            let r1 = symbols[Math.floor(Math.random() * symbols.length)];
            let r2 = symbols[Math.floor(Math.random() * symbols.length)];
            let r3 = symbols[Math.floor(Math.random() * symbols.length)];
            let r4 = bet >= 5 ? symbols[Math.floor(Math.random() * symbols.length)] : '?';

            document.getElementById('reel1').innerText = r1;
            document.getElementById('reel2').innerText = r2;
            document.getElementById('reel3').innerText = r3;
            document.getElementById('reel4').innerText = r4;

            let winAmount = 0;
            if (r1 === r2 && r2 === r3) {
                winAmount = bet * parseInt(r1 || 1) * 10;
            } else {
                winAmount = (r1 === '10' || r2 === '10' || r3 === '10') ? bet * 2 : 0;
            }

            balance += winAmount;
            document.getElementById('balance').innerText = balance;
            document.getElementById('winDisplay').innerText = winAmount;
        }
   <div class="controls">
    <div class="bet-info">
        <span>Balance: Rs <span id="balance">100</span></span>
        <span>Win: Rs <span id="winDisplay">0</span></span>
    </div>
    <div class="bet-buttons">
        <button class="bet-btn" onclick="setBet(1)">Bet Rs 1</button>
        <button class="bet-btn" onclick="setBet(5)">Bet Rs 5</button>
        <button class="bet-btn" onclick="setBet(10)">Bet Rs 10</button>
    </div>
    <button id="spinBtn" class="spin-btn" onclick="spin()">SPIN</button>
</div>   
    </script>
</body>
</html>
