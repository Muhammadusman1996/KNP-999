<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plinko - The Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a0500;
            color: #ffd700;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            height: 100vh;
            background: radial-gradient(circle, #4a2f13 0%, #0f0701 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
            border-left: 3px solid #b5651d;
            border-right: 3px solid #b5651d;
        }
        #top-bar {
            width: 100%;
            height: 50px;
            background: #2b1700;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-bottom: 3px solid #d4a373;
            font-size: 18px;
            font-weight: bold;
            box-sizing: border-box;
            padding: 0 20px;
        }
        #balance-display {
            background: #4a2511;
            padding: 5px 15px;
            border-radius: 20px;
            border: 1px solid #dda15e;
            color: #74c69d;
        }
        #aztec-header {
            width: 100%;
            height: 100px;
            background: linear-gradient(to bottom, #d4a373, #5c3818);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            border-bottom: 4px solid #dda15e;
        }
        #aztec-idol {
            width: 70px;
            height: 70px;
            background: #eddcd2;
            border-radius: 50%;
            border: 4px solid #6c584c;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 35px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.6);
            filter: drop-shadow(0px 5px 5px rgba(0,0,0,0.5));
        }
        #multipliers-arch {
            position: absolute;
            top: 5px;
            display: flex;
            gap: 4px;
        }
        .arch-slot {
            width: 26px;
            height: 26px;
            background: #283618;
            border: 1px solid #606c38;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 9px;
            font-weight: bold;
            color: #fefae0;
        }
        #plinko-board {
            flex-grow: 1;
            width: 100%;
            position: relative;
        }
        canvas {
            display: block;
        }
        #control-panel {
            width: 100%;
            height: 200px;
            background: #1f0d05;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px 0;
            border-top: 4px solid #d4a373;
            box-sizing: border-box;
            gap: 15px;
        }
        .mode-buttons {
            display: flex;
            gap: 15px;
        }
        .btn {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            text-shadow: 1px 1px 2px black;
            transition: transform 0.1s, filter 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
        }
        .btn:active { transform: scale(0.95); }
        #btn-green { background-color: #2e7d32; border: 2px solid #81c784; }
        #btn-orange { background-color: #ef6c00; border: 2px solid #ffb74d; }
        #btn-red { background-color: #c62828; border: 2px solid #e57373; }
        .btn.active { filter: brightness(1.3); box-shadow: 0 0 15px #dda15e; border-color: white; }
        
        .action-buttons {
            display: flex;
            gap: 20px;
        }
        .action-btn {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            border: 2px solid #dda15e;
            cursor: pointer;
            color: #fff;
            background: linear-gradient(to bottom, #b5651d, #5c3818);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }
        .action-btn:active { transform: scale(0.92); }
        .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .bet-controls {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #361a0b;
            padding: 8px 20px;
            border-radius: 30px;
            border: 1px solid #d4a373;
        }
        .bet-btn {
            background: #d4a373;
            color: #361a0b;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 3px 6px rgba(0,0,0,0.3);
        }
        #bet-display {
            font-size: 22px;
            font-weight: bold;
            width: 80px;
            text-align: center;
            color: #faedcd;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="top-bar">
        <div>بیلنس: <span id="balance-display">1000.00</span>$</div>
        <div id="last-win" style="color: #ffd700;"></div>
    </div>

    <div id="aztec-header">
        <div id="multipliers-arch">
            <div class="arch-slot" style="background:#55a630;">35</div>
            <div class="arch-slot" style="background:#55a630;">20</div>
            <div class="arch-slot" style="background:#80b918;">10</div>
            <div class="arch-slot" style="background:#bfd200;">5</div>
            <div class="arch-slot" style="background:#d4d700;">2</div>
            <div class="arch-slot" style="background:#ee9b00;">0.5</div>
            <div class="arch-slot" style="background:#ca6702;">0.2</div>
            <div class="arch-slot" style="background:#bb3e03;">0.2</div>
            <div class="arch-slot" style="background:#bb3e03;">0.2</div>
            <div class="arch-slot" style="background:#ca6702;">0.2</div>
            <div class="arch-slot" style="background:#ee9b00;">0.5</div>
            <div class="arch-slot" style="background:#d4d700;">2</div>
            <div class="arch-slot" style="background:#bfd200;">5</div>
            <div class="arch-slot" style="background:#80b918;">10</div>
            <div class="arch-slot" style="background:#55a630;">20</div>
            <div class="arch-slot" style="background:#55a630;">35</div>
        </div>
        <div id="aztec-idol">🗿</div>
    </div>

    <div id="plinko-board">
        <canvas id="canvas"></canvas>
    </div>

    <div id="control-panel">
        <div class="mode-buttons">
            <button id="btn-green" class="btn active" onclick="setMode('green')">ایزی</button>
            <button id="btn-orange" class="btn" onclick="setMode('orange')">میڈیم</button>
            <button id="btn-red" class="btn" onclick="setMode('red')">ہائی اسپیڈ</button>
        </div>
        
        <div class="bet-controls">
            <button class="bet-btn" onclick="adjustBet(-1)">-</button>
            <div id="bet-display">50</div>
            <button class="bet-btn" onclick="adjustBet(1)">+</button>
        </div>

        <div class="action-buttons">
            <button id="spin-btn" class="action-btn" onclick="manualSpin()">سنگل اسپن</button>
            <button id="auto-spin-btn" class="action-btn" onclick="toggleAutoSpin()">آٹو اسپن</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let currentMode = 'green';
    let currentBet = 50;
    let balance = 1000.00;
    let autoSpinActive = false;
    let autoSpinInterval = null;

    const balanceDisplay = document.getElementById('balance-display');
    const lastWinDisplay = document.getElementById('last-win');

    const modes = {
        green: { speed: 1.2, color: '#2e7d32', gravity: 0.25, spread: 0.3, bias: 0.5 },
        orange: { speed: 2.0, color: '#ef6c00', gravity: 0.45, spread: 0.8, bias: 0.4 },
        red: { speed: 3.5, color: '#c62828', gravity: 0.75, spread: 1.8, bias: 0.3 }
    };

    function updateBalance(amount) {
        balance += amount;
        balanceDisplay.innerText = balance.toFixed(2);
    }

    function resize() {
        const container = document.getElementById('plinko-board');
        width = container.clientWidth;
        height = container.clientHeight;
        canvas.width = width;
        canvas.height = height;
        initPegs();
    }

    window.addEventListener('resize', resize);

    let pegs = [];
    const rows = 12; 

    function initPegs() {
        pegs = [];
        const padding = 40;
        const usableWidth = width - padding * 2;
        const rowHeight = (height - 100) / rows;

        for (let i = 0; i < rows; i++) {
            const currentCols = i + 3; 
            const spacing = usableWidth / (currentCols - 1);
            for (let j = 0; j < currentCols; j++) {
                const px = padding + j * spacing;
                const py = 60 + i * rowHeight;
                pegs.push({ x: px, y: py, size: 4 });
            }
        }
    }

    let balls = [];

    function spawnBall() {
        if (balance < currentBet) {
            if (autoSpinActive) toggleAutoSpin();
            alert("بیلنس کم ہے!");
            return;
        }

        updateBalance(-currentBet);
        lastWinDisplay.innerText = "";

        const modeCfg = modes[currentMode];
        let startX = width / 2;
        
        if (currentMode === 'orange') {
            startX += (Math.random() - 0.5) * 40;
        } else if (currentMode === 'red') {
            startX += (Math.random() - 0.5) * 120;
        }

        balls.push({
            x: startX,
            y: 10,
            vx: (Math.random() - 0.5) * modeCfg.spread,
            vy: 1,
            radius: 8,
            color: modeCfg.color,
            mode: currentMode
        });
    }

    function setMode(mode) {
        currentMode = mode;
        document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`btn-${mode}`).classList.add('active');
    }

    function adjustBet(val) {
        currentBet = Math.max(10, currentBet + val * 10);
        document.getElementById('bet-display').innerText = currentBet;
    }

    function manualSpin() {
        spawnBall();
    }

    function toggleAutoSpin() {
        autoSpinActive = !autoSpinActive;
        const autoBtn = document.getElementById('auto-spin-btn');
        if (autoSpinActive) {
            autoBtn.innerText = "اسٹاپ آٹو";
            autoBtn.style.background = "#c62828";
            spawnBall();
            autoSpinInterval = setInterval(spawnBall, 1500);
        } else {
            autoBtn.innerText = "آٹو اسپن";
            autoBtn.style.background = "linear-gradient(to bottom, #b5651d, #5c3818)";
            clearInterval(autoSpinInterval);
        }
    }

    function update() {
        const modeCfg = modes[currentMode];

        for (let i = balls.length - 1; i >= 0; i--) {
            let b = balls[i];
            b.vy += modeCfg.gravity;
            b.x += b.vx * modeCfg.speed;
            b.y += b.vy * modeCfg.speed;

            for (let p of pegs) {
                const dist = Math.hypot(b.x - p.x, b.y - p.y);
                if (dist < b.radius + p.size) {
                    const angle = Math.atan2(b.y - p.y, b.x - p.x);
                    const force = 3.5;
                    b.vx = Math.cos(angle) * force;
                    b.vy = Math.sin(angle) * force;
                    
                    if (Math.random() < modeCfg.bias) {
                        b.vx += (width / 2 - b.x) * 0.05;
                    }
                    
                    b.y = p.y + (b.radius + p.size) * Math.sin(angle);
                    b.x = p.x + (b.radius + p.size) * Math.cos(angle);
                }
            }

            if (b.y > height - 35) {
                const landingX = b.x;
                const slotWidth = width / 16;
                const slotIndex = Math.min(15, Math.floor(landingX / slotWidth));
                const multipliers = [35, 20, 10, 5, 2, 0.5, 0.2, 0.2, 0.2, 0.2, 0.5, 2, 5, 10, 20, 35];
                const wonMultiplier = multipliers[slotIndex];
                const winAmount = currentBet * wonMultiplier;
                
                updateBalance(winAmount);
                if(winAmount > 0) {
                    lastWinDisplay.innerText = `جیت: +${winAmount.toFixed(2)}$`;
                }

                balls.splice(i, 1);
            }
        }
    }

    function draw() {
        ctx.clearRect(0, 0, width, height);

        // Draw pegs
        ctx.fillStyle = '#d4a373';
        for (let p of pegs) {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
        }

        // Draw balls
        for (let b of balls) {
            ctx.fillStyle = b.color;
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        // Draw multipliers base
        const slots = 16;
        const slotWidth = width / slots;
        const colors = ['#55a630', '#80b918', '#bfd200', '#d4d700', '#ee9b00', '#ca6702', '#bb3e03', '#9b2226', '#9b2226', '#bb3e03', '#ca6702', '#ee9b00', '#d4d700', '#bfd200', '#80b918', '#55a630'];
        const mults = ['35', '20', '10', '5', '2', '0.5', '0.2', '0.2', '0.2', '0.2', '0.5', '2', '5', '10', '20', '35'];
        
        for (let i = 0; i < slots; i++) {
            ctx.fillStyle = colors[i];
            ctx.fillRect(i * slotWidth, height - 30, slotWidth - 2, 30);
            ctx.fillStyle = 'white';
            ctx.font = 'bold 12px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(mults[i], (i + 0.5) * slotWidth, height - 10);
        }
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    resize();
    loop();
</script>
</body>
</html>
