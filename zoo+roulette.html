<script>
    const trackData = [
        { icon: '🦈', name: 'shark', mult: 'x22', group: 'beast' },
        { icon: '🦁', name: 'lion', mult: 'x10', group: 'beast' },
        { icon: '🐰', name: 'rabbit', mult: 'x5', group: 'beast' },
        { icon: '🐘', name: 'elephant', mult: 'x5', group: 'beast' },
        { icon: '🦅', name: 'eagle', mult: 'x10', group: 'birds' },
        { icon: '🦚', name: 'peacock', mult: 'x7', group: 'birds' },
        { icon: '🐦', name: 'pigeon', mult: 'x5', group: 'birds' },
        { icon: '🌟', name: 'gold_shark', mult: 'x70', group: 'all' },
        { icon: '🐒', name: 'monkey', mult: 'x6', group: 'beast' },
        { icon: '🐼', name: 'panda', mult: 'x5', group: 'beast' },
        { icon: '🐰', name: 'rabbit', mult: 'x5', group: 'beast' },
        { icon: '🦁', name: 'lion', mult: 'x10', group: 'beast' },
        { icon: '🦅', name: 'eagle', mult: 'x10', group: 'birds' },
        { icon: '🦚', name: 'peacock', mult: 'x7', group: 'birds' },
        { icon: '🦈', name: 'shark', mult: 'x22', group: 'beast' },
        { icon: '🐘', name: 'elephant', mult: 'x6', group: 'beast' },
        { icon: '🐒', name: 'monkey', mult: 'x8', group: 'beast' },
        { icon: '🐼', name: 'panda', mult: 'x8', group: 'beast' },
        { icon: '🐦', name: 'pigeon', mult: 'x6', group: 'birds' },
        { icon: '🦚', name: 'peacock', mult: 'x8', group: 'birds' },
        { icon: '🦅', name: 'eagle', mult: 'x12', group: 'birds' },
        { icon: '🐰', name: 'rabbit', mult: 'x6', group: 'beast' },
        { icon: '🦁', name: 'lion', mult: 'x12', group: 'beast' },
        { icon: '🐘', name: 'elephant', mult: 'x6', group: 'beast' },
        { icon: '🐒', name: 'monkey', mult: 'x8', group: 'beast' },
        { icon: '🐼', name: 'panda', mult: 'x8', group: 'beast' },
        { icon: '🐦', name: 'pigeon', mult: 'x6', group: 'birds' },
        { icon: '🦚', name: 'peacock', mult: 'x8', group: 'birds' }
    ];

    const trackPositions = [
        {r:1,c:1},{r:1,c:2},{r:1,c:3},{r:1,c:4},{r:1,c:5},{r:1,c:6},{r:1,c:7},{r:1,c:8},{r:1,c:9},
        {r:2,c:9},{r:3,c:9},{r:4,c:9},{r:5,c:9},{r:6,c:9},
        {r:7,c:9},{r:7,c:8},{r:7,c:7},{r:7,c:6},{r:7,c:5},{r:7,c:4},{r:7,c:3},{r:7,c:2},{r:7,c:1},
        {r:6,c:1},{r:5,c:1},{r:4,c:1},{r:3,c:1},{r:2,c:1}
    ];

    let balance = 10000;
    let selectedChipValue = 1;
    let currentBets = {};
    let isSpinning = false;
    let currentTrackIndex = 0;
    let history = ['🦈', '🦁', '🦅', '🐰', '🐼'];

    let bettingTimeLeft = 10;
    let bettingTimerInterval = null;

    const boardContainer = document.getElementById('boardContainer');
    const balanceDisplay = document.getElementById('balanceDisplay');
    const statusBox = document.getElementById('statusBox');
    const recordHistory = document.getElementById('recordHistory');
    const btnSpin = document.getElementById('btnSpin');
    const btnClear = document.getElementById('btnClear');
    const bettingGrid = document.getElementById('bettingGrid');

    const trackElements = [];
    function initTrack() {
        trackPositions.forEach((pos, idx) => {
            const data = trackData[idx];
            const div = document.createElement('div');
            div.className = 'track-block';
            div.style.gridRow = pos.r;
            div.style.gridColumn = pos.c;
            div.innerHTML = `<span class="icon">${data.icon}</span><span class="mult">${data.mult}</span>`;
            boardContainer.appendChild(div);
            trackElements.push(div);
        });
        trackElements[0].classList.add('active');
    }

    function updateHistory() {
        recordHistory.innerHTML = '';
        history.slice(-8).forEach(icon => {
            const div = document.createElement('div');
            div.className = 'record-item';
            div.innerText = icon;
            recordHistory.appendChild(div);
        });
    }

    document.getElementById('chipSelector').addEventListener('click', (e) => {
        const chip = e.target.closest('.chip');
        if (!chip) return;
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
        chip.classList.add('selected');
        selectedChipValue = parseInt(chip.dataset.value);
    });

    document.querySelectorAll('.bet-zone').forEach(zone => {
        zone.addEventListener('click', () => {
            if (isSpinning) return;
            const zoneKey = zone.dataset.zone;
            if (balance < selectedChipValue) return;

            balance -= selectedChipValue;
            currentBets[zoneKey] = (currentBets[zoneKey] || 0) + selectedChipValue;

            balanceDisplay.innerText = `$${balance.toLocaleString()}`;
            zone.querySelector('.bet-chip-display').innerText = currentBets[zoneKey];
            zone.classList.add('has-bet');
        });
    });

    btnClear.addEventListener('click', () => {
        if (isSpinning) return;
        Object.keys(currentBets).forEach(key => {
            balance += currentBets[key];
        });
        currentBets = {};
        balanceDisplay.innerText = `$${balance.toLocaleString()}`;
        document.querySelectorAll('.bet-zone').forEach(z => {
            z.classList.remove('has-bet');
            z.querySelector('.bet-chip-display').innerText = '0';
        });
    });

    const multipliers = {
        shark: 24, lion: 12, eagle: 12, monkey: 8, panda: 8, peacock: 8,
        rabbit: 6, elephant: 6, pigeon: 6, gold_shark: 100, beast: 2, birds: 2
    };

    function startBettingTimer() {
        bettingTimeLeft = 10;
        statusBox.innerText = `TIME: ${bettingTimeLeft}s`;
        if(bettingGrid) bettingGrid.classList.remove('disabled');
        if(btnSpin) btnSpin.disabled = false;
        if(btnClear) btnClear.disabled = false;

        bettingTimerInterval = setInterval(() => {
            bettingTimeLeft--;
            if (bettingTimeLeft > 0) {
                statusBox.innerText = `TIME: ${bettingTimeLeft}s`;
            } else {
                clearInterval(bettingTimerInterval);
                statusBox.innerText = 'BETS CLOSED';
                lockBetsAndSpin();
            }
        }, 1000);
    }

    function lockBetsAndSpin() {
        isSpinning = true;
        if(bettingGrid) bettingGrid.classList.add('disabled');
        if(btnSpin) btnSpin.disabled = true;
        if(btnClear) btnClear.disabled = true;

        const totalSteps = 28 * 3 + Math.floor(Math.random() * 28);
        let step = 0;
        let speed = Math.max(30, Math.floor(3000 / totalSteps));

        function runSpin() {
            trackElements[currentTrackIndex].classList.remove('active');
            currentTrackIndex = (currentTrackIndex + 1) % 28;
            trackElements[currentTrackIndex].classList.add('active');

            step++;
            if (step < totalSteps) {
                setTimeout(runSpin, speed);
            } else {
                resolveWin(currentTrackIndex);
            }
        }
        runSpin();
    }

    btnSpin.addEventListener('click', () => {
        if (isSpinning || bettingTimeLeft <= 0) return;
        clearInterval(bettingTimerInterval);
        statusBox.innerText = 'BETS CLOSED';
        lockBetsAndSpin();
    });

    function resolveWin(index) {
        const winningBlock = trackData[index];
        const animal = winningBlock.name;
        const group = winningBlock.group;

        let totalWin = 0;

        if (currentBets[animal]) {
            totalWin += currentBets[animal] * multipliers[animal];
        }

        if (group && currentBets[group]) {
            totalWin += currentBets[group] * multipliers[group];
        }

        balance += totalWin;
        balanceDisplay.innerText = `$${balance.toLocaleString()}`;

        if (totalWin > 0) {
            statusBox.innerText = `WIN: +$${totalWin.toLocaleString()}!`;
        } else {
            statusBox.innerText = 'NO WIN';
        }

        history.push(winningBlock.icon);
        updateHistory();

        setTimeout(() => {
            currentBets = {};
            document.querySelectorAll('.bet-zone').forEach(z => {
                z.classList.remove('has-bet');
                z.querySelector('.bet-chip-display').innerText = '0';
            });
            isSpinning = false;
            startBettingTimer();
        }, 2000);
    }

    initTrack();
    updateHistory();
    startBettingTimer();
</script>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Kingdom Roulette - Timed Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background: #0a0d12;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .game-wrapper {
            width: 1000px;
            max-width: 100%;
            background: #141a24;
            border: 4px solid #b8860b;
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8), inset 0 0 15px rgba(218,165,32,0.2);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Top Header & Record Bar */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0d121c;
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #2a3547;
        }

        .profile-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #b8860b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            border: 2px solid #ffd700;
        }

        .user-info {
            display: flex;
            flex-direction: column;
        }

        .username {
            font-weight: bold;
            font-size: 14px;
            color: #e0e0e0;
        }

        .balance {
            color: #2ed573;
            font-weight: bold;
            font-size: 16px;
        }

        .record-panel {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow-x: auto;
            max-width: 500px;
            padding: 5px;
            background: #080b10;
            border-radius: 6px;
            border: 1px solid #1f293d;
        }

        .record-title {
            font-size: 12px;
            font-weight: bold;
            color: #ffd700;
            text-transform: uppercase;
            padding: 0 5px;
        }

        .record-item {
            min-width: 32px;
            height: 32px;
            border-radius: 6px;
            background: #1a2332;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            border: 1px solid #34495e;
            flex-shrink: 0;
        }

        .timer-box {
            background: #b8860b;
            color: #000;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 0 10px rgba(255,215,0,0.5);
        }

        /* Outer Track 28 Blocks Layout */
        .board-container {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            grid-template-rows: repeat(7, 1fr);
            gap: 4px;
            background: #0b0e14;
            padding: 8px;
            border-radius: 10px;
            border: 2px solid #2c3e50;
            position: relative;
        }

        .track-block {
            background: #151d2a;
            border: 1px solid #2a384d;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #ccc;
            position: relative;
            transition: all 0.1s ease;
        }

        .track-block .icon {
            font-size: 20px;
        }

        .track-block .mult {
            font-size: 10px;
            color: #ffd700;
            font-weight: bold;
        }

        .track-block.active {
            background: #ffd700;
            color: #000;
            box-shadow: 0 0 15px #ffd700;
            border-color: #fff;
            z-index: 10;
        }

        .track-block.active .mult {
            color: #a00000;
        }

        /* Inner Grid (12 Betting Zones) */
        .inner-betting-grid {
            grid-column: 2 / 9;
            grid-row: 2 / 7;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 6px;
            padding: 8px;
            background: #101622;
            border-radius: 8px;
            border: 1px dashed #34495e;
        }

        .bet-zone {
            background: linear-gradient(145deg, #1a2536, #121a26);
            border: 2px solid #2c3e50;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            transition: transform 0.1s, border-color 0.2s;
        }

        .bet-zone:hover {
            border-color: #ffd700;
            transform: translateY(-2px);
        }

        .bet-zone .zone-title {
            font-size: 13px;
            font-weight: bold;
            color: #fff;
        }

        .bet-zone .zone-mult {
            font-size: 11px;
            color: #2ed573;
            font-weight: bold;
        }

        .bet-chip-display {
            position: absolute;
            top: 4px;
            right: 4px;
            background: #e74c3c;
            color: #fff;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 10px;
            display: none;
            border: 1px solid #fff;
        }

        .bet-zone.has-bet .bet-chip-display {
            display: block;
        }

        /* Bottom Controls & Chip Selector */
        .controls-bar {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #0d121c;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #2a3547;
        }

        .chip-selector {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
            overflow-x: auto;
            padding: 4px 0;
        }

        .chip {
            min-width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
            border: 3px dashed #fff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            transition: transform 0.15s, box-shadow 0.15s;
            flex-shrink: 0;
        }

        .chip:hover {
            transform: scale(1.1);
        }

        .chip.selected {
            transform: scale(1.15);
            box-shadow: 0 0 12px #ffd700;
            border-style: solid;
        }

        /* 10 Chip Colors */
        .chip-1 { background: #7f8c8d; color: #fff; }
        .chip-5 { background: #e74c3c; color: #fff; }
        .chip-10 { background: #3498db; color: #fff; }
        .chip-25 { background: #2ecc71; color: #fff; }
        .chip-50 { background: #9b59b6; color: #fff; }
        .chip-100 { background: #f1c40f; color: #000; }
        .chip-500 { background: #e67e22; color: #fff; }
        .chip-1000 { background: #1abc9c; color: #fff; }
        .chip-5000 { background: #d35400; color: #fff; }
        .chip-10000 { background: #8e44ad; color: #fff; }

        .action-btns {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 6px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        .btn-clear {
            background: #e74c3c;
            color: #fff;
        }

        .btn-clear:hover { background: #c0392b; }

        .btn-spin {
            background: #2ed573;
            color: #000;
            font-size: 15px;
            min-width: 120px;
        }

        .btn-spin:hover { background: #26af5f; }

        .btn:disabled, .bet-zone.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }
    </style>
</head>
